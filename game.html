<!DOCTYPE html>
<html lang="fa">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Stickman Game</title>

<style>

*{
    box-sizing:border-box;
    user-select:none;
}

html,
body{

    margin:0;

    width:100%;
    height:100%;

    overflow:hidden;

}

body{

    background:
    linear-gradient(
        #38bdf8,
        #dbeafe
    );

    font-family:Arial;
}

canvas{

    display:block;

    width:100%;
    height:100%;

    touch-action:none;
}

#info{

    position:fixed;

    top:15px;

    left:50%;

    transform:translateX(-50%);

    padding:10px 18px;

    border-radius:15px;

    background:#0008;

    color:white;

    text-align:center;

    z-index:10;
}

#controls{

    position:fixed;

    bottom:25px;

    left:0;

    right:0;

    display:flex;

    justify-content:space-between;

    padding:0 25px;

    pointer-events:none;
}

button{

    pointer-events:auto;

    width:70px;

    height:70px;

    border-radius:50%;

    border:2px solid white;

    background:#0008;

    color:white;

    font-size:30px;

    touch-action:none;
}

</style>

</head>

<body>

<canvas id="game"></canvas>

<div id="info">

🎮 <span id="name"></span>

<br>

اتاق:
<span id="room"></span>

</div>


<div id="controls">

<button
id="left"
type="button"
>
◀
</button>

<button
id="right"
type="button"
>
▶
</button>

</div>


<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");


const myName =
localStorage.getItem("player")
|| "Player";

const roomCode =
localStorage.getItem("room")
|| "";


document.getElementById("name")
.textContent = myName;

document.getElementById("room")
.textContent = roomCode;


function resize(){

    canvas.width =
    window.innerWidth;

    canvas.height =
    window.innerHeight;

}

resize();

window.addEventListener(
    "resize",
    resize
);


/* بازیکن */

const me = {

    id:"",

    name:myName,

    x:300,

    direction:1,

    walking:false,

    frame:0

};


const others = {};


/* کنترل */

const keys = {

    left:false,

    right:false

};


window.addEventListener(
"keydown",
(e)=>{

    if(
        e.key==="a" ||
        e.key==="A" ||
        e.key==="ش"
    ){

        keys.left=true;

    }

    if(
        e.key==="d" ||
        e.key==="D" ||
        e.key==="ی"
    ){

        keys.right=true;

    }

});


window.addEventListener(
"keyup",
(e)=>{

    if(
        e.key==="a" ||
        e.key==="A" ||
        e.key==="ش"
    ){

        keys.left=false;

    }

    if(
        e.key==="d" ||
        e.key==="D" ||
        e.key==="ی"
    ){

        keys.right=false;

    }

});


function mobileButton(
    id,
    key
){

    const b =
    document.getElementById(id);

    b.addEventListener(
        "pointerdown",
        ()=>{
            keys[key]=true;
        }
    );

    b.addEventListener(
        "pointerup",
        ()=>{
            keys[key]=false;
        }
    );

    b.addEventListener(
        "pointercancel",
        ()=>{
            keys[key]=false;
        }
    );

}


mobileButton(
    "left",
    "left"
);

mobileButton(
    "right",
    "right"
);


/* اتصال */

socket.on(
"connect",
()=>{

    me.id =
    socket.id;

    socket.emit(
        "gameJoin"
    );

});


/* بازیکنان */

socket.on(
"gamePlayers",
(list)=>{

    list.forEach(
        p=>{

            if(
                p.id === me.id
            ){

                me.x =
                p.x;

                return;

            }

            others[p.id] = {
                ...p,
                frame:0
            };

        }
    );

});


socket.on(
"playerMove",
p=>{

    if(
        p.id !== me.id
    ){

        others[p.id] = {

            ...others[p.id],

            ...p

        };

    }

});


socket.on(
"playerLeave",
id=>{

    delete others[id];

});


/* آپدیت */

function update(){

    me.walking=false;

    if(keys.left){

        me.x -= 5;

        me.direction=-1;

        me.walking=true;

    }

    if(keys.right){

        me.x += 5;

        me.direction=1;

        me.walking=true;

    }

    if(me.x<30)
        me.x=30;

    if(
        me.x >
        canvas.width-30
    )
        me.x =
        canvas.width-30;

    me.frame++;

    socket.emit(
        "playerMove",
        {
            x:me.x,
            y:0,
            direction:me.direction,
            walking:me.walking
        }
    );

}


/* استیکمن */

function drawPlayer(
    p
){

    const ground =
    canvas.height*0.78;

    const walk =
    p.walking
    ? Math.sin(p.frame*0.3)
    : 0;

    ctx.save();

    ctx.translate(
        p.x,
        ground
    );

    ctx.scale(
        p.direction || 1,
        1
    );

    ctx.strokeStyle="#111827";

    ctx.lineWidth=6;

    ctx.lineCap="round";

    /* اسم */

    ctx.font=
    "bold 15px Arial";

    ctx.textAlign=
    "center";

    ctx.fillStyle="white";

    ctx.fillText(
        p.name,
        0,
        -110
    );

    /* سر */

    ctx.beginPath();

    ctx.arc(
        0,
        -85,
        16,
        0,
        Math.PI*2
    );

    ctx.fillStyle="#f8fafc";

    ctx.fill();

    ctx.stroke();

    /* بدن */

    ctx.beginPath();

    ctx.moveTo(
        0,
        -69
    );

    ctx.lineTo(
        0,
        -35
    );

    ctx.stroke();

    /* دست‌ها */

    ctx.beginPath();

    ctx.moveTo(
        0,
        -60
    );

    ctx.lineTo(
        -25,
        -40 + walk*8
    );

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(
        0,
        -60
    );

    ctx.lineTo(
        25,
        -40 - walk*8
    );

    ctx.stroke();

    /* پاها */

    ctx.beginPath();

    ctx.moveTo(
        0,
        -35
    );

    ctx.lineTo(
        -18 + walk*10,
        0
    );

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(
        0,
        -35
    );

    ctx.lineTo(
        18 - walk*10,
        0
    );

    ctx.stroke();

    ctx.restore();

}


/* رسم */

function draw(){

    const w =
    canvas.width;

    const h =
    canvas.height;

    /* آسمان */

    const sky =
    ctx.createLinearGradient(
        0,
        0,
        0,
        h
    );

    sky.addColorStop(
        0,
        "#38bdf8"
    );

    sky.addColorStop(
        1,
        "#dbeafe"
    );

    ctx.fillStyle=sky;

    ctx.fillRect(
        0,
        0,
        w,
        h
    );


    /* خورشید */

    ctx.fillStyle="#fde047";

    ctx.beginPath();

    ctx.arc(
        w-100,
        100,
        45,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* زمین */

    const ground =
    h*0.78;

    ctx.fillStyle="#22c55e";

    ctx.fillRect(
        0,
        ground,
        w,
        h-ground
    );


    /* درخت */

    for(
        let x=80;
        x<w;
        x+=250
    ){

        ctx.fillStyle="#78350f";

        ctx.fillRect(
            x,
            ground-120,
            25,
            120
        );

        ctx.fillStyle="#166534";

        ctx.beginPath();

        ctx.arc(
            x+12,
            ground-140,
            55,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    /* دیگران */

    for(
        const id in others
    ){

        drawPlayer(
            others[id]
        );

    }


    /* من */

    drawPlayer(me);

}


function loop(){

    update();

    draw();

    requestAnimationFrame(
        loop
    );

}

loop();

</script>

</body>

</html>
