<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Stickman Multiplayer</title>

<style>

*{
    box-sizing:border-box;
    user-select:none;
}

html,
body{

    margin:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:#75c9ff;

    font-family:Arial;
}

canvas{

    display:block;

    width:100%;
    height:100%;

    touch-action:none;
}

#top{

    position:fixed;

    top:10px;
    left:10px;

    z-index:10;

    background:#000b;

    color:white;

    padding:10px 15px;

    border-radius:14px;

    font-weight:bold;
}

#admin{

    color:#ffd700;

    display:none;
}

#players{

    position:fixed;

    top:10px;
    right:10px;

    z-index:10;

    background:#000b;

    color:white;

    padding:10px;

    border-radius:14px;

    min-width:130px;
}

#buttons{

    position:fixed;

    left:0;
    right:0;
    bottom:20px;

    z-index:20;

    display:flex;

    justify-content:space-between;

    padding:0 20px;

    direction:ltr;
}

button{

    width:70px;
    height:70px;

    border-radius:50%;

    border:2px solid white;

    background:#000a;

    color:white;

    font-size:27px;

    font-weight:bold;

    touch-action:none;
}

.group{

    display:flex;

    gap:10px;
}

</style>

</head>

<body>


<canvas id="game"></canvas>


<div id="top">

👤
<span id="name"></span>

<br>

🏠
<span id="room"></span>

<div id="admin">
👑 ADMIN
</div>

</div>


<div id="players">

👥 بازیکنان

<div id="list"></div>

</div>


<div id="buttons">

<div class="group">

<button id="left">
◀
</button>

<button id="right">
▶
</button>

<button id="run">
🏃
</button>

</div>

<button id="jump">
⬆
</button>

</div>


<script src="/socket.io/socket.io.js"></script>

<script>

/* =====================
اطلاعات
===================== */

const socket = io();

const myName =
localStorage.getItem("player")
|| "Player";

const myRoom =
localStorage.getItem("room")
|| "------";


document.getElementById(
    "name"
).textContent = myName;


document.getElementById(
    "room"
).textContent = myRoom;


if(
    myName.toLowerCase()
    === "tahagamertnt"
){

    document.getElementById(
        "admin"
    ).style.display = "block";

}


/* =====================
Canvas
===================== */

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");


function resize(){

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

}

resize();

window.addEventListener(
    "resize",
    resize
);


/* =====================
بازیکن
===================== */

const me = {

    id:"",

    x:500,

    y:0,

    vx:0,

    vy:0,

    direction:1,

    walking:false,

    running:false,

    jumping:false,

    frame:0

};


const players = {};


/* =====================
کنترل
===================== */

const keys = {

    left:false,

    right:false,

    run:false,

    jump:false

};


/* کیبورد */

document.addEventListener(
    "keydown",
    e => {

        if(
            e.key === "ArrowLeft" ||
            e.key.toLowerCase() === "a"
        ){

            keys.left = true;

        }


        if(
            e.key === "ArrowRight" ||
            e.key.toLowerCase() === "d"
        ){

            keys.right = true;

        }


        if(
            e.key === "Shift"
        ){

            keys.run = true;

        }


        if(
            e.code === "Space"
        ){

            e.preventDefault();

            keys.jump = true;

        }

    }
);


document.addEventListener(
    "keyup",
    e => {

        if(
            e.key === "ArrowLeft" ||
            e.key.toLowerCase() === "a"
        ){

            keys.left = false;

        }


        if(
            e.key === "ArrowRight" ||
            e.key.toLowerCase() === "d"
        ){

            keys.right = false;

        }


        if(
            e.key === "Shift"
        ){

            keys.run = false;

        }


        if(
            e.code === "Space"
        ){

            keys.jump = false;

        }

    }
);


/* موبایل */

function control(
    id,
    key
){

    const b =
        document.getElementById(id);


    b.addEventListener(
        "pointerdown",
        e => {

            e.preventDefault();

            keys[key] = true;

        }
    );


    b.addEventListener(
        "pointerup",
        e => {

            e.preventDefault();

            keys[key] = false;

        }
    );


    b.addEventListener(
        "pointercancel",
        () => {

            keys[key] = false;

        }
    );

}


control("left","left");

control("right","right");

control("run","run");

control("jump","jump");


/* =====================
Socket
===================== */

socket.on(
    "connect",
    () => {

        me.id =
            socket.id;

        socket.emit(
            "gameJoin"
        );

    }
);


/* بازیکنان */

socket.on(
    "gamePlayers",
    list => {

        list.forEach(
            p => {

                if(
                    p.id === me.id
                ){

                    me.x =
                        p.x || 500;

                    return;

                }


                players[p.id] = {

                    ...p,

                    frame:0

                };

            }
        );

        updateList();

    }
);


socket.on(
    "playerMove",
    p => {

        if(
            p.id === me.id
        )
            return;


        players[p.id] = {

            ...players[p.id],

            ...p

        };

    }
);


socket.on(
    "playerLeave",
    id => {

        delete players[id];

        updateList();

    }
);


/* =====================
لیست
===================== */

function updateList(){

    const list =
        document.getElementById(
            "list"
        );

    list.innerHTML =
        myName;


    Object.values(players)
    .forEach(
        p => {

            list.innerHTML +=
                "<br>" +
                p.name +
                (
                    p.admin
                    ? " 👑"
                    : ""
                );

        }
    );

}


/* =====================
حرکت
===================== */

const ground = 500;


function update(){

    let speed = 4;


    me.walking = false;

    me.running = false;


    if(keys.run){

        speed = 8;

        me.running = true;

    }


    if(keys.left){

        me.vx = -speed;

        me.direction = -1;

        me.walking = true;

    }
    else if(keys.right){

        me.vx = speed;

        me.direction = 1;

        me.walking = true;

    }
    else{

        me.vx *= .75;

    }


    me.x += me.vx;


    /* پرش */

    if(
        keys.jump &&
        !me.jumping
    ){

        me.vy = -14;

        me.jumping = true;

    }


    me.vy += .7;

    me.y += me.vy;


    if(
        me.y >= 0
    ){

        me.y = 0;

        me.vy = 0;

        me.jumping = false;

    }


    if(me.x < 30)
        me.x = 30;


    if(me.x > 5000)
        me.x = 5000;


    me.frame++;

}


/* =====================
ارسال حرکت
===================== */

let lastSend = 0;


function send(){

    const now =
        Date.now();


    if(
        now - lastSend < 40
    )
        return;


    lastSend = now;


    socket.emit(
        "playerMove",
        {

            x:me.x,

            y:me.y,

            direction:
                me.direction,

            walking:
                me.walking,

            running:
                me.running,

            jumping:
                me.jumping

        }
    );

}


/* =====================
رسم بازیکن
===================== */

function drawPlayer(
    p,
    screenX,
    screenY
){

    ctx.save();

    ctx.translate(
        screenX,
        screenY
    );

    ctx.scale(
        p.direction || 1,
        1
    );


    const walk =
        p.walking
        ? Math.sin(
            p.frame * .3
        ) * 15
        : 0;


    /* اسم */

    ctx.font =
        "bold 15px Arial";

    ctx.textAlign =
        "center";

    ctx.fillStyle =
        "white";

    ctx.fillText(
        p.name,
        0,
        -90
    );


    /* ادمین */

    if(
        p.name.toLowerCase()
        === "tahagamertnt"
    ){

        ctx.fillStyle =
            "#ffd700";

        ctx.font =
            "18px Arial";

        ctx.fillText(
            "👑",
            0,
            -108
        );

    }


    ctx.strokeStyle =
        "#111";

    ctx.lineWidth =
        6;

    ctx.lineCap =
        "round";


    /* سر */

    ctx.beginPath();

    ctx.arc(
        0,
        -65,
        16,
        0,
        Math.PI*2
    );

    ctx.fillStyle =
        "white";

    ctx.fill();

    ctx.stroke();


    /* بدن */

    ctx.beginPath();

    ctx.moveTo(
        0,
        -49
    );

    ctx.lineTo(
        0,
        -15
    );

    ctx.stroke();


    /* دست */

    ctx.beginPath();

    ctx.moveTo(
        0,
        -40
    );

    ctx.lineTo(
        -25,
        -20 + walk
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
        0,
        -40
    );

    ctx.lineTo(
        25,
        -20 - walk
    );

    ctx.stroke();


    /* پا */

    ctx.beginPath();

    ctx.moveTo(
        0,
        -15
    );

    ctx.lineTo(
        -18 + walk,
        20
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
        0,
        -15
    );

    ctx.lineTo(
        18 - walk,
        20
    );

    ctx.stroke();


    ctx.restore();

}


/* =====================
رسم
===================== */

function draw(){

    /* آسمان */

    ctx.fillStyle =
        "#60c8ff";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* ابر */

    ctx.fillStyle =
        "#ffffffaa";


    for(
        let x = -200;
        x < canvas.width + 400;
        x += 350
    ){

        ctx.beginPath();

        ctx.arc(
            x,
            100,
            35,
            0,
            Math.PI*2
        );

        ctx.arc(
            x+40,
            90,
            45,
            0,
            Math.PI*2
        );

        ctx.arc(
            x+85,
            105,
            30,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    /* زمین */

    ctx.fillStyle =
        "#22c55e";

    ctx.fillRect(
        0,
        ground,
        canvas.width,
        canvas.height
    );


    ctx.fillStyle =
        "#15803d";

    ctx.fillRect(
        0,
        ground,
        canvas.width,
        10
    );


    /* دوربین */

    const camera =
        me.x -
        canvas.width / 2;


    /* بازیکنان دیگر */

    Object.values(players)
    .forEach(
        p => {

            p.frame =
                (p.frame || 0) + 1;


            drawPlayer(
                p,
                p.x - camera,
                ground + p.y
            );

        }
    );


    /* خودم */

    drawPlayer(
        me,
        canvas.width / 2,
        ground + me.y
    );

}


/* =====================
حلقه بازی
===================== */

function loop(){

    update();

    send();

    draw();

    requestAnimationFrame(
        loop
    );

}


loop();

</script>

</body>

</html>
