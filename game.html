<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stickman Online</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

#game{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

/* اطلاعات */

#info{
    position:fixed;
    top:15px;
    left:15px;
    z-index:50;

    background:rgba(0,0,0,.7);
    color:white;

    padding:10px 16px;
    border-radius:12px;

    font-size:16px;
}


/* =========================
   دکمه ADMIN
========================= */

#adminButton{

    display:none;

    position:fixed;

    top:15px;
    right:15px;

    z-index:9999;

    border:0;
    border-radius:14px;

    padding:14px 22px;

    background:#ef4444;
    color:white;

    font-size:18px;
    font-weight:bold;

    cursor:pointer;

    box-shadow:0 5px 25px rgba(0,0,0,.5);
}

#adminButton:active{
    transform:scale(.95);
}


/* =========================
   پنل
========================= */

#adminOverlay{

    display:none;

    position:fixed;
    inset:0;

    z-index:9998;

    background:rgba(0,0,0,.75);

    align-items:center;
    justify-content:center;

    padding:20px;
}


#adminPanel{

    width:min(650px,95vw);

    max-height:90vh;

    overflow:auto;

    background:#111827;

    color:white;

    border-radius:24px;

    padding:24px;

    box-shadow:0 20px 80px #000;

}


.adminHeader{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:20px;
}


.adminTitle{

    font-size:27px;

    font-weight:bold;
}


#closeAdmin{

    width:45px;
    height:45px;

    border:0;

    border-radius:50%;

    background:#374151;

    color:white;

    font-size:22px;

    cursor:pointer;
}


/* بازیکنان */

.section{

    background:#1f2937;

    border-radius:18px;

    padding:17px;

    margin-top:15px;
}


.sectionTitle{

    font-size:19px;

    font-weight:bold;

    margin-bottom:12px;
}


#playerList{

    display:grid;

    grid-template-columns:
        repeat(auto-fit,minmax(140px,1fr));

    gap:10px;
}


.playerButton{

    border:0;

    border-radius:12px;

    padding:12px;

    background:#374151;

    color:white;

    cursor:pointer;

    font-size:15px;
}


.playerButton.selected{

    outline:3px solid #facc15;

    background:#4b5563;
}


/* قابلیت‌ها */

.actions{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:12px;
}


.actionButton{

    min-height:65px;

    border:0;

    border-radius:15px;

    color:white;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;
}


.fly{
    background:#7c3aed;
}

.color{
    background:#db2777;
}

.kill{
    background:#dc2626;
}

.kick{
    background:#ea580c;
}

.allColor{
    background:#0891b2;
}


#adminStatus{

    margin-top:15px;

    padding:12px;

    border-radius:12px;

    background:#0f172a;

    text-align:center;

    color:#cbd5e1;
}


/* کنترل‌ها */

#controls{

    position:fixed;

    left:0;
    right:0;
    bottom:20px;

    z-index:100;

    display:flex;

    justify-content:space-between;

    padding:0 20px;
}


.controlGroup{

    display:flex;

    gap:12px;
}


.control{

    width:70px;
    height:70px;

    border:0;

    border-radius:50%;

    background:#111827cc;

    color:white;

    font-size:28px;

    font-weight:bold;

    touch-action:none;
}

</style>
</head>


<body>


<canvas id="game"></canvas>


<div id="info">
🎮 Player
</div>


<!-- دکمه -->

<button
    id="adminButton"
    type="button"
>
👑 ADMIN
</button>


<!-- پنل -->

<div
    id="adminOverlay"
>

<div id="adminPanel">

<div class="adminHeader">

<div class="adminTitle">
👑 پنل مدیریت
</div>

<button
    id="closeAdmin"
    type="button"
>
✕
</button>

</div>


<div class="section">

<div class="sectionTitle">
👥 انتخاب بازیکن
</div>

<div id="playerList">
بازیکنی نیست
</div>

</div>


<div class="section">

<div class="sectionTitle">
⚡ قابلیت‌ها
</div>


<div class="actions">

<button
    id="flyButton"
    class="actionButton fly"
>
✈️ پرواز
</button>


<button
    id="colorButton"
    class="actionButton color"
>
🌈 رنگی شدن
</button>


<button
    id="killButton"
    class="actionButton kill"
>
💀 کشتن
</button>


<button
    id="kickButton"
    class="actionButton kick"
>
🚪 بیرون انداختن
</button>

</div>

</div>


<div class="section">

<button
    id="allColorButton"
    class="actionButton allColor"
    style="width:100%"
>
🌈 رنگی کردن همه
</button>

</div>


<div id="adminStatus">
اول یک بازیکن را انتخاب کن
</div>


</div>
</div>


<!-- کنترل -->

<div id="controls">

<div class="controlGroup">

<button
    id="left"
    class="control"
>
◀
</button>

<button
    id="right"
    class="control"
>
▶
</button>

</div>


<div class="controlGroup">

<button
    id="jump"
    class="control"
>
⬆
</button>

</div>

</div>


<script src="/socket.io/socket.io.js"></script>

<script src="/game.js"></script>


<script>

/* =================================
   اسم بازیکن
================================= */

const storedName =
    localStorage.getItem("player");

const name =
    String(storedName || "")
        .trim();

const finalName =
    name || "Player";


document.getElementById(
    "info"
).textContent =
    "🎮 " + finalName;


/* =================================
   ادمین
================================= */

const isAdmin =
    finalName.toLowerCase() ===
    "tahagamertnt";


const adminButton =
    document.getElementById(
        "adminButton"
    );

const overlay =
    document.getElementById(
        "adminOverlay"
    );

const closeAdmin =
    document.getElementById(
        "closeAdmin"
    );


/*
   این قسمت خیلی مهم است:
   اگر اسم tahagamertnt باشد
   دکمه حتماً نمایش داده می‌شود.
*/

if(isAdmin){

    adminButton.style.display =
        "block";

}


/* =================================
   باز کردن
================================= */

adminButton.addEventListener(
    "click",
    function(){

        if(!isAdmin)
            return;

        overlay.style.display =
            "flex";

    }
);


/* =================================
   بستن
================================= */

closeAdmin.addEventListener(
    "click",
    function(){

        overlay.style.display =
            "none";

    }
);


/* کلیک بیرون پنل */

overlay.addEventListener(
    "click",
    function(event){

        if(
            event.target === overlay
        ){

            overlay.style.display =
                "none";

        }

    }
);


/* =================================
   بازیکن انتخاب‌شده
================================= */

let selectedPlayer = null;


function choosePlayer(
    id,
    name
){

    selectedPlayer = id;


    document
        .querySelectorAll(
            ".playerButton"
        )
        .forEach(
            button => {

                button.classList.remove(
                    "selected"
                );

            }
        );


    const button =
        document.querySelector(
            `[data-player-id="${id}"]`
        );


    if(button){

        button.classList.add(
            "selected"
        );

    }


    document.getElementById(
        "adminStatus"
    ).textContent =
        "🎯 انتخاب: " + name;

}


/* =================================
   لیست بازیکنان
================================= */

if(isAdmin){

    socket.on(
        "players",
        function(players){

            const list =
                document.getElementById(
                    "playerList"
                );


            list.innerHTML = "";


            if(
                !Array.isArray(players)
            ){

                list.textContent =
                    "بازیکنی نیست";

                return;

            }


            players.forEach(
                player => {

                    if(
                        !player ||
                        player.id === socket.id
                    )
                        return;


                    const button =
                        document.createElement(
                            "button"
                        );


                    button.className =
                        "playerButton";


                    button.dataset.playerId =
                        player.id;


                    const playerName =
                        player.name ||
                        "Player";


                    button.textContent =
                        "👤 " +
                        playerName;


                    button.onclick =
                        function(){

                            choosePlayer(
                                player.id,
                                playerName
                            );

                        };


                    list.appendChild(
                        button
                    );

                }
            );


            if(
                list.children.length === 0
            ){

                list.textContent =
                    "بازیکن دیگری نیست";

            }

        }
    );

}


/* =================================
   ارسال قابلیت
================================= */

function sendAdminAction(
    action
){

    if(!isAdmin)
        return;


    if(!selectedPlayer){

        document.getElementById(
            "adminStatus"
        ).textContent =
            "⚠️ اول بازیکن را انتخاب کن";

        return;

    }


    socket.emit(
        "adminAction",
        {
            action:
                action,

            targetId:
                selectedPlayer
        }
    );


    document.getElementById(
        "adminStatus"
    ).textContent =
        "✅ دستور ارسال شد";

}


/* =================================
   دکمه‌ها
================================= */

document.getElementById(
    "flyButton"
).onclick =
function(){

    sendAdminAction(
        "fly"
    );

};


document.getElementById(
    "colorButton"
).onclick =
function(){

    sendAdminAction(
        "color"
    );

};


document.getElementById(
    "killButton"
).onclick =
function(){

    sendAdminAction(
        "kill"
    );

};


document.getElementById(
    "kickButton"
).onclick =
function(){

    sendAdminAction(
        "kick"
    );

};


document.getElementById(
    "allColorButton"
).onclick =
function(){

    if(!isAdmin)
        return;


    socket.emit(
        "adminAction",
        {
            action:
                "allColor"
        }
    );


    document.getElementById(
        "adminStatus"
    ).textContent =
        "🌈 دستور برای همه ارسال شد";

};

</script>

</body>
</html>
