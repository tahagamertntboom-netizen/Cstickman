<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Stickman World</title>

<style>

*{
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#7dd3fc;
    font-family:Arial,sans-serif;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    touch-action:none;
}

#hud{
    position:fixed;
    top:12px;
    left:12px;
    z-index:10;

    background:#0009;
    color:white;

    padding:12px 16px;
    border-radius:15px;

    font-weight:bold;
    line-height:1.8;
}

#admin{
    color:#facc15;
    display:none;
}

#players{
    position:fixed;
    top:12px;
    right:12px;
    z-index:10;

    min-width:130px;

    background:#0009;
    color:white;

    padding:12px;

    border-radius:15px;

    font-size:13px;
}

#controls{
    position:fixed;
    left:0;
    right:0;
    bottom:20px;

    z-index:20;

    display:flex;
    justify-content:space-between;

    padding:0 20px;

    direction:ltr;

    pointer-events:none;
}

.group{
    display:flex;
    gap:10px;
}

.btn{
    width:70px;
    height:70px;

    border-radius:50%;

    border:2px solid white;

    background:#0009;

    color:white;

    font-size:27px;

    font-weight:bold;

    pointer-events:auto;

    touch-action:none;
}

#run{
    background:#2563eb;
}

#jump{
    background:#f59e0b;
}

</style>
</head>


<body>

<canvas id="game"></canvas>


<div id="hud">

🎮 <span id="name"></span>

<br>

🏠 اتاق:
<span id="room"></span>

<br>

❤️ جان:
<span id="hp">100</span>

<br>

⭐ امتیاز:
<span id="score">0</span>

<div id="admin">
👑 ADMIN
</div>

</div>


<div id="players">

👥 بازیکنان

<div id="playerList"></div>

</div>


<div id="controls">

<div class="group">

<button
class="btn"
id="left">
◀
</button>

<button
class="btn"
id="right">
▶
</button>

<button
class="btn"
id="run">
🏃
</button>

</div>


<button
class="btn"
id="jump">
⬆
</button>

</div>


<script src="/socket.io/socket.io.js"></script>

<script>

/* =========================
   اتصال
========================= */

const socket = io();


/* =========================
   اطلاعات بازیکن
========================= */

const myName =
localStorage.getItem("player")
|| "Player";

const roomCode =
localStorage.getItem("room")
|| "------";


document.getElementById("name")
.textContent = myName;

document.getElementById("room")
.textContent = roomCode;


/* ادمین واقعی */

if(
    myName.toLowerCase()
    === "tahagamertnt"
){

    document.getElementById("admin")
    .style.display = "block";

}


/* =========================
   Canvas
========================= */

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");


function resize(){

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

}

resize();

window.addEventListener(
    "resize",
    resize
);


/* =========================
   دنیا
========================= */

const WORLD_WIDTH = 7000;

const GROUND = 520;


/* =========================
   بازیکن
========================= */

const player = {

    id:"",

    x:600,

    y:GROUND,

    vx:0,

    vy:0,

    direction:1,

    jumping:false,

    walking:false,

    running:false,

    frame:0,

    hp:100,

    score:0

};


const others = {};


/* =========================
   کنترل
========================= */

const keys = {

    left:false,

    right:false,

    run:false,

    jump:false

};


/* کیبورد */

window.addEventListener(
    "keydown",
    e=>{

        if(
            e.key==="ArrowLeft" ||
            e.key==="a" ||
            e.key==="A" ||
            e.key==="ش"
        ){
            keys.left=true;
        }


        if(
            e.key==="ArrowRight" ||
            e.key==="d" ||
            e.key==="D" ||
            e.key==="ی"
        ){
            keys.right=true;
        }


        if(
            e.key==="Shift"
        ){
            keys.run=true;
        }


        if(
            e.code==="Space"
        ){

            e.preventDefault();

            keys.jump=true;

        }

    }
);


window.addEventListener(
    "keyup",
    e=>{

        if(
            e.key==="ArrowLeft" ||
            e.key==="a" ||
            e.key==="A" ||
            e.key==="ش"
        ){
            keys.left=false;
        }


        if(
            e.key==="ArrowRight" ||
            e.key==="d" ||
            e.key==="D" ||
            e.key==="ی"
        ){
            keys.right=false;
        }


        if(
            e.key==="Shift"
        ){
            keys.run=false;
        }


        if(
            e.code==="Space"
        ){
            keys.jump=false;
        }

    }
);


/* موبایل */

function mobileButton(
    id,
    key
){

    const btn =
        document.getElementById(id);


    btn.addEventListener(
        "pointerdown",
        e=>{

            e.preventDefault();

            keys[key]=true;

        }
    );


    btn.addEventListener(
        "pointerup",
        e=>{

            e.preventDefault();

            keys[key]=false;

        }
    );


    btn.addEventListener(
        "pointercancel",
        ()=>{
            keys[key]=false;
        }
    );

}


mobileButton("left","left");

mobileButton("right","right");

mobileButton("run","run");

mobileButton("jump","jump");


/* =========================
   اتصال به بازی
========================= */

socket.on(
    "connect",
    ()=>{

        player.id =
            socket.id;

        socket.emit(
            "gameJoin"
        );

    }
);


/* =========================
   دریافت بازیکن‌ها
========================= */

socket.on(
    "gamePlayers",
    list=>{

        list.forEach(
            p=>{

                if(
                    p.id === player.id
                ){

                    player.x =
                        p.x || player.x;

                    return;

                }


                others[p.id] = {

                    ...p,

                    frame:0

                };

            }
        );

        updatePlayerList();

    }
);


socket.on(
    "playerJoined",
    p=>{

        if(
            p.id === player.id
        ){
            return;
        }


        others[p.id] = {

            ...p,

            frame:0

        };

        updatePlayerList();

    }
);


socket.on(
    "playerMove",
    p=>{

        if(
            p.id === player.id
        ){
            return;
        }


        if(
            !others[p.id]
        ){

            others[p.id] = {

                ...p,

                frame:0

            };

        }
        else{

            Object.assign(
                others[p.id],
                p
            );

        }

    }
);


socket.on(
    "playerLeave",
    id=>{

        delete others[id];

        updatePlayerList();

    }
);


/* =========================
   لیست بازیکنان
========================= */

function updatePlayerList(){

    const list =
        document.getElementById(
            "playerList"
        );

    list.innerHTML =
        "👤 " + myName;


    Object.values(others)
    .forEach(
        p=>{

            list.innerHTML +=
                "<br>👤 " +
                p.name +
                (
                    p.admin
                    ? " 👑"
                    : ""
                );

        }
    );

}


/* =========================
   سکه‌ها
========================= */

const coins = [];

for(
    let x=800;
    x<WORLD_WIDTH;
    x+=280
){

    coins.push({

        x:x,

        y:GROUND-70,

        taken:false

    });

}


/* =========================
   ساختمان‌ها
========================= */

const houses = [

    {
        x:1200,
        y:GROUND-170
    },

    {
        x:3300,
        y:GROUND-170
    },

    {
        x:5100,
        y:GROUND-170
    }

];


/* =========================
   درخت‌ها
========================= */

const trees = [];

for(
    let x=300;
    x<WORLD_WIDTH;
    x+=450
){

    trees.push(x);

}


/* =========================
   فیزیک
========================= */

function update(){

    player.walking=false;

    player.running=false;


    let speed = 4;


    if(keys.run){

        speed=8;

        player.running=true;

    }


    if(keys.left){

        player.vx =
            -speed;

        player.direction=-1;

        player.walking=true;

    }
    else if(keys.right){

        player.vx =
            speed;

        player.direction=1;

        player.walking=true;

    }
    else{

        player.vx *= .75;

    }


    player.x +=
        player.vx;


    /* پرش */

    if(
        keys.jump &&
        !player.jumping
    ){

        player.vy=-14;

        player.jumping=true;

    }


    player.vy += .7;

    player.y +=
        player.vy;


    if(
        player.y >= GROUND
    ){

        player.y=GROUND;

        player.vy=0;

        player.jumping=false;

    }


    /* مرز */

    if(player.x<50)
        player.x=50;


    if(
        player.x >
        WORLD_WIDTH-50
    ){

        player.x =
            WORLD_WIDTH-50;

    }


    /* سکه */

    coins.forEach(
        coin=>{

            if(
                !coin.taken &&
                Math.abs(
                    player.x-coin.x
                ) < 45 &&
                Math.abs(
                    player.y-coin.y
                ) < 60
            ){

                coin.taken=true;

                player.score += 10;

                document.getElementById(
                    "score"
                ).textContent =
                    player.score;

            }

        }
    );


    player.frame++;

}


/* =========================
   ارسال حرکت
========================= */

let lastSend=0;


function sendMovement(){

    const now =
        Date.now();


    if(
        now-lastSend<40
    ){
        return;
    }


    lastSend=now;


    socket.emit(
        "playerMove",
        {

            x:player.x,

            y:player.y,

            direction:
                player.direction,

            walking:
                player.walking,

            running:
                player.running,

            jumping:
                player.jumping

        }
    );

}


/* =========================
   دوربین
========================= */

let camera=0;


function cameraUpdate(){

    const target =
        player.x -
        canvas.width/2;


    camera +=
        (target-camera)*.08;


    if(camera<0)
        camera=0;


    const max =
        WORLD_WIDTH -
        canvas.width;


    if(camera>max)
        camera=max;

}


/* =========================
   پس‌زمینه
========================= */

function background(){

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            canvas.height
        );


    gradient.addColorStop(
        0,
        "#38bdf8"
    );


    gradient.addColorStop(
        1,
        "#dbeafe"
    );


    ctx.fillStyle =
        gradient;


    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* خورشید */

    ctx.fillStyle =
        "#fde047";


    ctx.beginPath();

    ctx.arc(
        canvas.width-100,
        90,
        45,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* ابر */

    for(
        let x=-camera%500-200;
        x<canvas.width+500;
        x+=500
    ){

        ctx.fillStyle="#ffffffaa";

        ctx.beginPath();

        ctx.arc(
            x,
            120,
            30,
            0,
            Math.PI*2
        );

        ctx.arc(
            x+35,
            110,
            40,
            0,
            Math.PI*2
        );

        ctx.arc(
            x+75,
            125,
            28,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

}


/* =========================
   زمین
========================= */

function ground(){

    ctx.fillStyle =
        "#22c55e";


    ctx.fillRect(
        0,
        GROUND,
        canvas.width,
        canvas.height
    );


    ctx.fillStyle =
        "#15803d";


    ctx.fillRect(
        0,
        GROUND,
        canvas.width,
        12
    );


}


/* =========================
   درخت
========================= */

function tree(worldX){

    const x =
        worldX-camera;


    if(
        x < -100 ||
        x > canvas.width+100
    ){
        return;
    }


    ctx.fillStyle =
        "#78350f";


    ctx.fillRect(
        x-13,
        GROUND-120,
        26,
        120
    );


    ctx.fillStyle =
        "#166534";


    ctx.beginPath();

    ctx.arc(
        x,
        GROUND-145,
        55,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        x-35,
        GROUND-125,
        40,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        x+35,
        GROUND-125,
        40,
        0,
        Math.PI*2
    );

    ctx.fill();

}


/* =========================
   خانه
========================= */

function house(h){

    const x =
        h.x-camera;


    if(
        x < -300 ||
        x > canvas.width+300
    ){
        return;
    }


    /* بدنه */

    ctx.fillStyle =
        "#fbbf24";


    ctx.fillRect(
        x-100,
        GROUND-150,
        200,
        150
    );


    /* سقف */

    ctx.fillStyle =
        "#dc2626";


    ctx.beginPath();

    ctx.moveTo(
        x-130,
        GROUND-150
    );

    ctx.lineTo(
        x,
        GROUND-250
    );

    ctx.lineTo(
        x+130,
        GROUND-150
    );

    ctx.closePath();

    ctx.fill();


    /* در */

    ctx.fillStyle =
        "#78350f";


    ctx.fillRect(
        x-25,
        GROUND-90,
        50,
        90
    );


    /* پنجره */

    ctx.fillStyle =
        "#38bdf8";


    ctx.fillRect(
        x-75,
        GROUND-125,
        40,
        40
    );


    ctx.fillRect(
        x+35,
        GROUND-125,
        40,
        40
    );

}


/* =========================
   سکه
========================= */

function drawCoin(coin){

    if(coin.taken)
        return;


    const x =
        coin.x-camera;


    const y =
        coin.y;


    if(
        x < -50 ||
        x > canvas.width+50
    ){
        return;
    }


    ctx.fillStyle =
        "#facc15";


    ctx.beginPath();

    ctx.arc(
        x,
        y,
        15,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.strokeStyle =
        "#ca8a04";


    ctx.lineWidth=4;

    ctx.stroke();


    ctx.fillStyle =
        "#92400e";


    ctx.font =
        "bold 15px Arial";


    ctx.textAlign =
        "center";


    ctx.fillText(
        "$",
        x,
        y+6
    );

}


/* =========================
   استیکمن
========================= */

function drawStickman(p){

    const x =
        p.x-camera;


    const y =
        p.y;


    if(
        x < -150 ||
        x > canvas.width+150
    ){
        return;
    }


    const walk =
        p.walking
        ? Math.sin(
            p.frame*.3
        )
        : 0;


    const run =
        p.running
        ? 1.5
        : 1;


    ctx.save();


    ctx.translate(
        x,
        y
    );


    ctx.scale(
        p.direction || 1,
        1
    );


    /* اسم */

    ctx.font =
        "bold 16px Arial";


    ctx.textAlign =
        "center";


    ctx.lineWidth=4;


    ctx.strokeStyle="#000";


    ctx.fillStyle="#fff";


    ctx.strokeText(
        p.name,
        0,
        -145
    );


    ctx.fillText(
        p.name,
        0,
        -145
    );


    /* تاج ادمین */

    if(
        p.name.toLowerCase()
        === "tahagamertnt"
    ){

        ctx.fillStyle =
            "#facc15";


        ctx.font =
            "22px Arial";


        ctx.fillText(
            "👑",
            0,
            -165
        );

    }


    /* بدن */

    ctx.strokeStyle =
        "#111827";


    ctx.lineWidth =
        7;


    ctx.lineCap =
        "round";


    /* سر */

    ctx.beginPath();

    ctx.arc(
        0,
        -112,
        20,
        0,
        Math.PI*2
    );


    ctx.fillStyle =
        "#f8fafc";


    ctx.fill();

    ctx.stroke();


    /* بدن */

    ctx.beginPath();

    ctx.moveTo(
        0,
        -91
    );

    ctx.lineTo(
        0,
        -45
    );

    ctx.stroke();


    /* دست */

    ctx.beginPath();

    ctx.moveTo(
        0,
        -80
    );

    ctx.lineTo(
        -32,
        -50 +
        walk*10*run
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
        0,
        -80
    );

    ctx.lineTo(
        32,
        -50 -
        walk*10*run
    );

    ctx.stroke();


    /* پا */

    ctx.beginPath();

    ctx.moveTo(
        0,
        -45
    );

    ctx.lineTo(
        -22 +
        walk*15*run,
        0
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
        0,
        -45
    );

    ctx.lineTo(
        22 -
        walk*15*run,
        0
    );

    ctx.stroke();


    ctx.restore();

}


/* =========================
   رسم
========================= */

function draw(){

    background();

    ground();


    trees.forEach(
        tree
    );


    houses.forEach(
        house
    );


    coins.forEach(
        drawCoin
    );


    Object.values(
        others
    ).forEach(
        p=>{

            p.frame =
                (p.frame||0)+1;

            drawStickman(p);

        }
    );


    drawStickman(player);

}


/* =========================
   حلقه
========================= */

function loop(){

    update();

    cameraUpdate();

    sendMovement();

    draw();

    requestAnimationFrame(
        loop
    );

}


loop();

</script>

</body>

</html>
