<!DOCTYPE html>
<html lang="fa">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Stickman Game</title>

<style>

*{
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}

html,body{

    margin:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:#87ceeb;

}

canvas{

    display:block;

    width:100%;
    height:100%;

    touch-action:none;

}


/* کنترل موبایل */

#mobileControls{

    position:fixed;

    left:0;
    right:0;
    bottom:20px;

    display:flex;

    justify-content:space-between;

    padding:0 25px;

    pointer-events:none;

}

.controlGroup{

    display:flex;

    gap:15px;

    pointer-events:auto;

}

.control{

    width:70px;
    height:70px;

    border-radius:50%;

    border:2px solid white;

    background:#0008;

    color:white;

    font-size:30px;

    display:flex;

    align-items:center;
    justify-content:center;

    touch-action:none;

}

.control:active{

    background:#ffffff55;

}

#hint{

    position:fixed;

    top:15px;

    left:50%;

    transform:translateX(-50%);

    padding:10px 18px;

    border-radius:15px;

    background:#0008;

    color:white;

    font-family:Arial;

    font-size:14px;

    pointer-events:none;

}

</style>

</head>

<body>


<canvas id="game"></canvas>


<div id="hint">
A / D یا ش / ی برای حرکت
</div>


<div id="mobileControls">

<div class="controlGroup">

<button
    class="control"
    id="left"
>
◀
</button>

<button
    class="control"
    id="right"
>
▶
</button>

</div>

</div>


<script src="/socket.io/socket.io.js"></script>

<script src="./game.js"></script>


</body>

</html>
