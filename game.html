<!DOCTYPE html>
<html lang="fa">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Stickman Game</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    width: 100%;

    height: 100%;

    overflow: hidden;

    font-family: Arial, sans-serif;

    background: #7dd3fc;
}

canvas {

    position: fixed;

    left: 0;

    top: 0;

    width: 100vw;

    height: 100vh;

    display: block;

    z-index: 1;
}


/* =========================
   اطلاعات بازی
========================= */

#info {

    position: fixed;

    top: 15px;

    left: 15px;

    z-index: 20;

    padding: 10px 15px;

    border-radius: 12px;

    background: rgba(0,0,0,.65);

    color: white;

    font-size: 16px;
}


/* =========================
   دکمه ادمین
========================= */

#adminButton {

    display: none;

    position: fixed;

    top: 15px;

    right: 15px;

    z-index: 30;

    padding: 12px 18px;

    border: none;

    border-radius: 12px;

    background: #dc2626;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;
}


/* =========================
   کنترل‌ها
========================= */

#controls {

    position: fixed;

    left: 0;

    right: 0;

    bottom: 20px;

    z-index: 20;

    display: flex;

    justify-content: space-between;

    padding: 0 20px;

    pointer-events: none;
}

.controlGroup {

    display: flex;

    gap: 12px;

    pointer-events: auto;
}

.control {

    width: 70px;

    height: 70px;

    border: none;

    border-radius: 50%;

    background: rgba(15,23,42,.8);

    color: white;

    font-size: 28px;

    font-weight: bold;

    touch-action: none;

    user-select: none;

    cursor: pointer;
}

.control:active {

    transform: scale(.92);

}

</style>

</head>


<body>


<!-- =========================
     بازی
========================= -->

<canvas id="game"></canvas>


<!-- =========================
     اطلاعات
========================= -->

<div id="info">
    🎮 Stickman
</div>


<!-- =========================
     ادمین
========================= -->

<button
    id="adminButton"
    type="button"
>
    👑 ADMIN
</button>


<!-- =========================
     کنترل‌ها
========================= -->

<div id="controls">

    <div class="controlGroup">

        <button
            id="left"
            class="control"
            type="button"
        >
            ◀
        </button>

        <button
            id="right"
            class="control"
            type="button"
        >
            ▶
        </button>

    </div>


    <div class="controlGroup">

        <button
            id="jump"
            class="control"
            type="button"
        >
            ⬆
        </button>

    </div>

</div>


<!-- =========================
     Socket
========================= -->

<script src="/socket.io/socket.io.js"></script>


<!-- =========================
     بازی
========================= -->

<script src="/game.js"></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const name =
            localStorage.getItem(
                "player"
            );

        const adminButton =
            document.getElementById(
                "adminButton"
            );


        // جلوگیری از undefined

        const safeName =
            name &&
            name !== "undefined" &&
            name !== "null"
                ? name.trim()
                : "Player";


        // نمایش اسم

        document.getElementById(
            "info"
        ).textContent =
            "🎮 " + safeName;


        // فقط tahagamertnt ادمین است

        if (
            safeName.toLowerCase() ===
            "tahagamertnt"
        ) {

            adminButton.style.display =
                "block";


            adminButton.onclick =
                function () {

                    alert(
                        "👑 پنل ادمین"
                    );

                };

        }

    }
);

</script>


</body>

</html>
