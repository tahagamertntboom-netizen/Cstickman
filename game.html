<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Stickman World</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#87ceeb;
    font-family:Arial,sans-serif;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    touch-action:none;
}

#top{
    position:fixed;
    top:12px;
    left:50%;
    transform:translateX(-50%);
    z-index:20;

    background:#0009;
    color:white;

    padding:10px 18px;
    border-radius:15px;

    text-align:center;
    font-weight:bold;
}

#players{
    position:fixed;
    top:12px;
    right:12px;
    z-index:20;

    min-width:120px;

    background:#0008;
    color:white;

    padding:10px;
    border-radius:14px;

    font-size:13px;
}

#controls{
    position:fixed;
    left:0;
    right:0;
    bottom:20px;

    display:flex;
    justify-content:space-between;

    padding:0 20px;

    z-index:30;

    direction:ltr;
}

.group{
    display:flex;
    gap:12px;
}

.btn{
    width:72px;
    height:72px;

    border:2px solid white;
    border-radius:50%;

    background:#0009;
    color:white;

    font-size:28px;
    font-weight:bold;

    touch-action:none;
}

#jump{
    background:#f59e0b;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="top">
🎮 <span id="myName"></span>
<br>
اتاق: <span id="myRoom"></span>
</div>

<div id="players">
👥 بازیکنان
<div id="playerList"></div>
</div>

<div id="controls">

    <div class="group">
        <button class="btn" id="left">◀</button>
        <button class="btn" id="right">▶</button>
    </div>

    <button class="btn" id="jump">⬆</button>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");


/* =========================
   اطلاعات
========================= */

const myName =
localStorage.getItem("player") || "Player";

const roomCode =
localStorage.getItem("room") || "------";

document.getElementById("myName")
.textContent = myName;

document.getElementById("myRoom")
.textContent = roomCode;


/* =========================
   اندازه
========================= */

function resize(){

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

}

resize();

window.addEventListener(
    "resize",
    resize
);


/* =========================
   دنیا
========================= */

const WORLD_WIDTH = 6000;

const GROUND = 500;


/* =========================
   بازیکن من
========================= */

const me = {

    id:"",
    name:myName,

    x:500,
    y:GROUND,

    vx:0,
    vy:0,

    direction:1,

    walking:false,
    jumping:false,

    frame:0

};


/* بازیکن‌های دیگر */

const players = {};


/* =========================
   کنترل
========================= */

const control = {

    left:false,
    right:false,
    jump:false

};


/* کیبورد */

window.addEventListener(
    "keydown",
    function(e){

        if(
            e.key==="ArrowLeft" ||
            e.key==="a" ||
            e.key==="A" ||
            e.key==="ش"
        ){
            control.left=true;
        }

        if(
            e.key==="ArrowRight" ||
            e.key==="d" ||
            e.key==="D" ||
            e.key==="ی"
        ){
            control.right=true;
        }

        if(e.code==="Space"){

            e.preventDefault();

            control.jump=true;

        }

    }
);


window.addEventListener(
    "keyup",
    function(e){

        if(
            e.key==="ArrowLeft" ||
            e.key==="a" ||
            e.key==="A" ||
            e.key==="ش"
        ){
            control.left=false;
        }

        if(
            e.key==="ArrowRight" ||
            e.key==="d" ||
            e.key==="D" ||
            e.key==="ی"
        ){
            control.right=false;
        }

        if(e.code==="Space"){
            control.jump=false;
        }

    }
);


/* موبایل */

function touchButton(id,key){

    const b =
        document.getElementById(id);

    b.addEventListener(
        "pointerdown",
        function(e){

            e.preventDefault();

            control[key]=true;

        }
    );

    b.addEventListener(
        "pointerup",
        function(e){

            e.preventDefault();

            control[key]=false;

        }
    );

    b.addEventListener(
        "pointercancel",
        function(){

            control[key]=false;

        }
    );

    b.addEventListener(
        "pointerleave",
        function(){

            control[key]=false;

        }
    );

}

touchButton("left","left");
touchButton("right","right");
touchButton("jump","jump");


/* =========================
   اتصال
========================= */

socket.on(
    "connect",
    function(){

        me.id =
            socket.id;

        socket.emit(
            "gameJoin"
        );

    }
);


/* =========================
   دریافت بازیکنان
========================= */

socket.on(
    "gamePlayers",
    function(list){

        list.forEach(
            function(p){

                if(p.id===me.id){

                    me.x =
                        p.x || me.x;

                    return;

                }

                players[p.id] = {

                    id:p.id,
                    name:p.name,

                    x:p.x || 500,
                    y:p.y || GROUND,

                    direction:
                        p.direction || 1,

                    walking:
                        !!p.walking,

                    jumping:
                        !!p.jumping,

                    frame:0

                };

            }
        );

        updatePlayerList();

    }
);


/* حرکت بازیکن */

socket.on(
    "playerMove",
    function(p){

        if(p.id===me.id){
            return;
        }

        players[p.id] = {

            ...(players[p.id] || {}),

            ...p,

            frame:
                players[p.id]
                ? players[p.id].frame
                : 0

        };

        updatePlayerList();

    }
);


/* خروج */

socket.on(
    "playerLeave",
    function(id){

        delete players[id];

        updatePlayerList();

    }
);


/* =========================
   لیست بازیکنان
========================= */

function updatePlayerList(){

    const list =
        document.getElementById(
            "playerList"
        );

    list.innerHTML="";

    const names =
        Object.values(players);

    list.innerHTML =
        "<div>👤 "+myName+"</div>";

    names.forEach(
        function(p){

            list.innerHTML +=
                "<div>👤 "+p.name+
                "</div>";

        }
    );

}


/* =========================
   فیزیک
========================= */

function update(){

    me.walking=false;


    if(control.left){

        me.vx=-5;

        me.direction=-1;

        me.walking=true;

    }

    else if(control.right){

        me.vx=5;

        me.direction=1;

        me.walking=true;

    }

    else{

        me.vx *= 0.75;

    }


    me.x += me.vx;


    /* پرش */

    if(
        control.jump &&
        !me.jumping
    ){

        me.vy=-13;

        me.jumping=true;

    }


    me.vy += 0.65;

    me.y += me.vy;


    if(me.y>=GROUND){

        me.y=GROUND;

        me.vy=0;

        me.jumping=false;

    }


    /* مرز دنیا */

    if(me.x<50){
        me.x=50;
    }

    if(
        me.x>
        WORLD_WIDTH-50
    ){

        me.x=
            WORLD_WIDTH-50;

    }


    me.frame++;

}


/* =========================
   ارسال موقعیت
========================= */

let lastSend=0;

function send(){

    const now=Date.now();

    if(
        now-lastSend<40
    ){
        return;
    }

    lastSend=now;

    socket.emit(
        "playerMove",
        {

            x:me.x,
            y:me.y,

            direction:
                me.direction,

            walking:
                me.walking,

            jumping:
                me.jumping

        }
    );

}


/* =========================
   دوربین
========================= */

let cameraX=0;

function updateCamera(){

    const target =
        me.x -
        canvas.width/2;

    cameraX +=
        (target-cameraX)*0.08;


    if(cameraX<0){
        cameraX=0;
    }


    const max =
        Math.max(
            0,
            WORLD_WIDTH-
            canvas.width
        );


    if(cameraX>max){
        cameraX=max;
    }

}


/* =========================
   پس زمینه
========================= */

function drawBackground(){

    const sky =
        ctx.createLinearGradient(
            0,
            0,
            0,
            canvas.height
        );

    sky.addColorStop(
        0,
        "#38bdf8"
    );

    sky.addColorStop(
        1,
        "#dbeafe"
    );

    ctx.fillStyle=sky;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* خورشید */

    ctx.fillStyle="#fde047";

    ctx.beginPath();

    ctx.arc(
        canvas.width-100,
        90,
        45,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* کوه‌ها */

    ctx.fillStyle="#64748b";

    ctx.beginPath();

    ctx.moveTo(
        0,
        GROUND
    );

    for(
        let x=-cameraX%500-500;
        x<canvas.width+600;
        x+=500
    ){

        ctx.lineTo(
            x+150,
            280
        );

        ctx.lineTo(
            x+300,
            GROUND
        );

        ctx.lineTo(
            x+500,
            260
        );

        ctx.lineTo(
            x+650,
            GROUND
        );

    }

    ctx.lineTo(
        canvas.width,
        GROUND
    );

    ctx.lineTo(
        0,
        GROUND
    );

    ctx.fill();

}


/* =========================
   زمین
========================= */

function drawGround(){

    ctx.fillStyle="#22c55e";

    ctx.fillRect(
        0,
        GROUND,
        canvas.width,
        canvas.height-GROUND
    );


    ctx.fillStyle="#15803d";

    ctx.fillRect(
        0,
        GROUND,
        canvas.width,
        12
    );


    /* سنگ‌ها و چمن */

    for(
        let x=-cameraX%100;
        x<canvas.width;
        x+=100
    ){

        ctx.fillStyle="#166534";

        ctx.fillRect(
            x,
            GROUND+35,
            45,
            5
        );

    }

}


/* =========================
   درخت
========================= */

function drawTree(worldX){

    const x =
        worldX-cameraX;


    if(
        x<-150 ||
        x>canvas.width+150
    ){
        return;
    }


    ctx.fillStyle="#78350f";

    ctx.fillRect(
        x-14,
        GROUND-130,
        28,
        130
    );


    ctx.fillStyle="#166534";

    ctx.beginPath();

    ctx.arc(
        x,
        GROUND-155,
        60,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        x-42,
        GROUND-135,
        42,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        x+42,
        GROUND-135,
        42,
        0,
        Math.PI*2
    );

    ctx.fill();

}


/* =========================
   استیکمن
========================= */

function drawPlayer(p){

    const x =
        p.x-cameraX;

    const y =
        p.y;


    if(
        x<-100 ||
        x>canvas.width+100
    ){
        return;
    }


    const walk =
        p.walking
        ? Math.sin(
            p.frame*0.3
        )
        : 0;


    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.scale(
        p.direction||1,
        1
    );


    /* سایه */

    ctx.fillStyle="#0004";

    ctx.beginPath();

    ctx.ellipse(
        0,
        4,
        30,
        7,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* اسم */

    ctx.font=
        "bold 16px Arial";

    ctx.textAlign=
        "center";

    ctx.lineWidth=4;

    ctx.strokeStyle=
        "#000";

    ctx.fillStyle=
        "#fff";

    ctx.strokeText(
        p.name,
        0,
        -130
    );

    ctx.fillText(
        p.name,
        0,
        -130
    );


    /* بدن */

    ctx.strokeStyle="#111827";

    ctx.lineWidth=7;

    ctx.lineCap="round";


    /* سر */

    ctx.beginPath();

    ctx.arc(
        0,
        -100,
        18,
        0,
        Math.PI*2
    );

    ctx.fillStyle="#f8fafc";

    ctx.fill();

    ctx.stroke();


    /* چشم */

    ctx.fillStyle="#111827";

    ctx.beginPath();

    ctx.arc(
        6,
        -103,
        3,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* بدن */

    ctx.beginPath();

    ctx.moveTo(
        0,
        -82
    );

    ctx.lineTo(
        0,
        -42
    );

    ctx.stroke();


    /* دست چپ */

    ctx.beginPath();

    ctx.moveTo(
        0,
        -73
    );

    ctx.lineTo(
        -28,
        -45+walk*9
    );

    ctx.stroke();


    /* دست راست */

    ctx.beginPath();

    ctx.moveTo(
        0,
        -73
    );

    ctx.lineTo(
        28,
        -45-walk*9
    );

    ctx.stroke();


    /* پای چپ */

    ctx.beginPath();

    ctx.moveTo(
        0,
        -42
    );

    ctx.lineTo(
        -20+walk*12,
        0
    );

    ctx.stroke();


    /* پای راست */

    ctx.beginPath();

    ctx.moveTo(
        0,
        -42
    );

    ctx.lineTo(
        20-walk*12,
        0
    );

    ctx.stroke();


    ctx.restore();

}


/* =========================
   رسم
========================= */

function draw(){

    drawBackground();

    drawGround();


    /* درخت‌ها */

    for(
        let x=150;
        x<WORLD_WIDTH;
        x+=380
    ){

        drawTree(x);

    }


    /* بازیکنان دیگر */

    for(
        const id in players
    ){

        const p=players[id];

        p.frame++;

        drawPlayer(p);

    }


    /* بازیکن خودم */

    drawPlayer(me);

}


/* =========================
   حلقه بازی
========================= */

function loop(){

    update();

    updateCamera();

    send();

    draw();

    requestAnimationFrame(loop);

}

loop();

</script>

</body>
</html>
