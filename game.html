<!DOCTYPE html>
<html>
<head>

<title>Stickman Forest</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow:hidden;
background:#87ceeb;
}

canvas{
display:block;
width:100vw;
height:100vh;
}

.controls{
position:fixed;
bottom:20px;
width:100%;
text-align:center;
}

button{
font-size:30px;
padding:15px 30px;
margin:10px;
border:0;
border-radius:20px;
background:#222;
color:white;
opacity:.7;
}

</style>

</head>

<body>


<canvas id="game"></canvas>


<div class="controls">

<button id="left">⬅️</button>
<button id="right">➡️</button>

</div>



<script>


const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");


let W;
let H;


function resize(){

W=window.innerWidth;
H=window.innerHeight;


canvas.width=W;
canvas.height=H;

}


resize();

window.addEventListener("resize",resize);



let player={

x:500,
y:0,

name:"Taha",

speed:7,

walk:0

};



let keys={};


document.addEventListener("keydown",e=>{

keys[e.key]=true;

});


document.addEventListener("keyup",e=>{

keys[e.key]=false;

});



let left=false;
let right=false;


document.getElementById("left").ontouchstart=()=>{
left=true;
};

document.getElementById("left").ontouchend=()=>{
left=false;
};


document.getElementById("right").ontouchstart=()=>{
right=true;
};

document.getElementById("right").ontouchend=()=>{
right=false;
};





function update(){


if(keys["a"] || keys["A"] || keys["ش"] || left){

player.x-=player.speed;
player.walk+=0.4;

}



if(keys["d"] || keys["D"] || keys["ی"] || right){

player.x+=player.speed;
player.walk+=0.4;

}


player.y=H-180;


}





function forest(){



// آسمان

ctx.fillStyle="#75d7ff";
ctx.fillRect(0,0,W,H);



// خورشید

ctx.fillStyle="yellow";

ctx.beginPath();

ctx.arc(100,100,50,0,Math.PI*2);

ctx.fill();



// زمین

ctx.fillStyle="#35a94a";

ctx.fillRect(0,H-100,W,100);




// درخت ها

for(let x=100;x<W;x+=250){


ctx.fillStyle="#704214";

ctx.fillRect(
x,
H-270,
50,
170
);



ctx.fillStyle="green";

ctx.beginPath();

ctx.arc(
x+25,
H-300,
90,
0,
Math.PI*2
);

ctx.fill();


}


}





function playerDraw(){


let x=player.x;
let y=player.y;


let move=Math.sin(player.walk)*25;



ctx.strokeStyle="black";
ctx.lineWidth=7;


// اسم

ctx.fillStyle="black";
ctx.font="26px Arial";

ctx.fillText(
player.name,
x-40,
y-170
);



// سر

ctx.beginPath();

ctx.arc(
x,
y-120,
30,
0,
Math.PI*2
);

ctx.stroke();



// بدن

ctx.beginPath();

ctx.moveTo(x,y-90);

ctx.lineTo(x,y);

ctx.stroke();




// دست ها

ctx.beginPath();

ctx.moveTo(x,y-60);

ctx.lineTo(
x-50,
y-30+move
);


ctx.moveTo(x,y-60);

ctx.lineTo(
x+50,
y-30-move
);

ctx.stroke();




// پاها

ctx.beginPath();


ctx.moveTo(x,y);

ctx.lineTo(
x-30,
y+70+move
);


ctx.moveTo(x,y);

ctx.lineTo(
x+30,
y+70-move
);


ctx.stroke();



}





function loop(){


update();

forest();

playerDraw();


requestAnimationFrame(loop);


}


loop();


</script>


</body>
</html>
