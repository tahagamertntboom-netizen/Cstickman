<!DOCTYPE html>
<html>
<head>
<title>Stickman Forest</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
margin:0;
overflow:hidden;
background:#87ceeb;
touch-action:none;
}

canvas{
display:block;
}

.controls{
position:fixed;
bottom:20px;
left:0;
right:0;
text-align:center;
}

button{
font-size:30px;
padding:15px 30px;
margin:10px;
border-radius:20px;
border:0;
background:#222;
color:white;
opacity:0.7;
}

</style>

</head>

<body>

<canvas id="game"></canvas>


<div class="controls">
<button id="left">⬅️</button>
<button id="right">➡️</button>
</div>



<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");


function resize(){

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

}

resize();

window.onresize=resize;



let player={

x:canvas.width/2,

y:canvas.height-150,

name:"Taha",

speed:6,

walk:0

};



let keys={};



document.addEventListener("keydown",e=>{

keys[e.key]=true;

});


document.addEventListener("keyup",e=>{

keys[e.key]=false;

});



// گوشی

let moveLeft=false;
let moveRight=false;


left.ontouchstart=()=>moveLeft=true;
left.ontouchend=()=>moveLeft=false;


right.ontouchstart=()=>moveRight=true;
right.ontouchend=()=>moveRight=false;




function update(){


if(keys["a"]||keys["A"]||keys["ش"]||moveLeft){

player.x-=player.speed;
player.walk+=0.4;

}



if(keys["d"]||keys["D"]||keys["ی"]||moveRight){

player.x+=player.speed;
player.walk+=0.4;

}


}




function draw(){

let w=canvas.width;
let h=canvas.height;



// آسمان

ctx.fillStyle="#87ceeb";
ctx.fillRect(0,0,w,h);


// خورشید

ctx.fillStyle="yellow";
ctx.beginPath();
ctx.arc(100,100,50,0,Math.PI*2);
ctx.fill();



// زمین

ctx.fillStyle="#3d9b42";
ctx.fillRect(0,h-100,w,100);




// درخت‌ها

for(let x=100;x<w;x+=250){

ctx.fillStyle="#6b3515";
ctx.fillRect(x,h-250,40,150);


ctx.fillStyle="green";
ctx.beginPath();
ctx.arc(x+20,h-270,80,0,Math.PI*2);
ctx.fill();

}



drawPlayer();


}




function drawPlayer(){


let x=player.x;
let y=player.y;


let move=Math.sin(player.walk)*20;



ctx.strokeStyle="black";
ctx.lineWidth=6;



// اسم بالاتر

ctx.font="24px Arial";
ctx.fillStyle="black";

ctx.fillText(
player.name,
x-35,
y-150
);



// سر

ctx.beginPath();
ctx.arc(x,y-100,25,0,Math.PI*2);
ctx.stroke();



// بدن

ctx.beginPath();
ctx.moveTo(x,y-75);
ctx.lineTo(x,y+10);
ctx.stroke();



// دست‌ها

ctx.beginPath();

ctx.moveTo(x,y-45);
ctx.lineTo(x-45,y+move);

ctx.moveTo(x,y-45);
ctx.lineTo(x+45,y-move);

ctx.stroke();



// پاها

ctx.beginPath();

ctx.moveTo(x,y+10);
ctx.lineTo(x-25,y+80+move);

ctx.moveTo(x,y+10);
ctx.lineTo(x+25,y+80-move);

ctx.stroke();


}




function loop(){

update();

draw();

requestAnimationFrame(loop);

}


loop();

</script>


</body>
</html>
