<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Stickman Online</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

#info{
    position:fixed;
    top:15px;
    left:15px;
    z-index:20;
    background:#000b;
    color:white;
    padding:10px 15px;
    border-radius:12px;
}

#adminButton{
    display:none;
    position:fixed;
    top:15px;
    right:15px;
    z-index:30;
    border:0;
    border-radius:12px;
    padding:12px 18px;
    background:#dc2626;
    color:white;
    font-weight:bold;
    font-size:16px;
}

#adminPanel{
    display:none;
    position:fixed;
    top:70px;
    right:15px;
    width:280px;
    max-height:75vh;
    overflow:auto;
    z-index:40;
    background:#111827;
    color:white;
    padding:18px;
    border-radius:18px;
    box-shadow:0 15px 50px #000b;
}

.adminTitle{
    font-size:22px;
    font-weight:bold;
    margin-bottom:15px;
}

.section{
    margin-top:15px;
    padding-top:12px;
    border-top:1px solid #334155;
}

.sectionTitle{
    margin-bottom:8px;
    font-weight:bold;
}

#playerList button,
.adminAction{
    width:100%;
    border:0;
    padding:11px;
    margin:5px 0;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

.adminAction{
    background:#2563eb;
    color:white;
}

.kill{
    background:#dc2626 !important;
}

.kick{
    background:#f97316 !important;
}

.fly{
    background:#7c3aed !important;
}

.color{
    background:#db2777 !important;
}

#controls{
    position:fixed;
    left:0;
    right:0;
    bottom:20px;
    z-index:20;
    display:flex;
    justify-content:space-between;
    padding:0 20px;
}

.controlGroup{
    display:flex;
    gap:12px;
}

.control{
    width:68px;
    height:68px;
    border:0;
    border-radius:50%;
    background:#111827cc;
    color:white;
    font-size:27px;
    font-weight:bold;
    touch-action:none;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="info">🎮 Stickman</div>

<button id="adminButton" type="button">
👑 ADMIN
</button>

<div id="adminPanel">

    <div class="adminTitle">
        👑 پنل مدیریت
    </div>

    <div class="section">

        <div class="sectionTitle">
            👥 انتخاب بازیکن
        </div>

        <div id="playerList">
            هنوز بازیکنی نیست
        </div>

    </div>

    <div class="section">

        <div class="sectionTitle">
            ✨ قابلیت‌ها
        </div>

        <button
            class="adminAction fly"
            id="flyButton"
        >
            ✈️ پرواز
        </button>

        <button
            class="adminAction color"
            id="colorButton"
        >
            🌈 رنگی شدن
        </button>

        <button
            class="adminAction kill"
            id="killButton"
        >
            💀 کشتن
        </button>

        <button
            class="adminAction kick"
            id="kickButton"
        >
            🚪 بیرون انداختن
        </button>

    </div>

    <div class="section">

        <button
            class="adminAction"
            id="allColorButton"
        >
            🌈 رنگی کردن همه
        </button>

    </div>

</div>

<div id="controls">

    <div class="controlGroup">

        <button class="control" id="left">
            ◀
        </button>

        <button class="control" id="right">
            ▶
        </button>

    </div>

    <div class="controlGroup">

        <button class="control" id="jump">
            ⬆
        </button>

    </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/game.js"></script>

<script>
const savedName =
    localStorage.getItem("player") || "";

const safeName =
    savedName.trim();

document.getElementById("info").textContent =
    "🎮 " + (safeName || "Player");

const admin =
    safeName.toLowerCase() === "tahagamertnt";

const adminButton =
    document.getElementById("adminButton");

const adminPanel =
    document.getElementById("adminPanel");

let selectedPlayer = null;

if (admin) {

    adminButton.style.display = "block";

}

adminButton.onclick = function(){

    if (!admin) return;

    adminPanel.style.display =
        adminPanel.style.display === "block"
        ? "none"
        : "block";

};


// بازیکن انتخاب‌شده
window.selectAdminPlayer = function(id){

    selectedPlayer = id;

    document.querySelectorAll(
        "#playerList button"
    ).forEach(btn=>{
        btn.style.outline = "";
    });

    const button =
        document.querySelector(
            `[data-player="${id}"]`
        );

    if(button){
        button.style.outline =
            "3px solid #facc15";
    }
};


// فرمان ادمین
function adminCommand(action){

    if(!admin) return;

    if(!selectedPlayer){
        alert("اول یک بازیکن را انتخاب کن!");
        return;
    }

    socket.emit("adminAction",{
        action:action,
        targetId:selectedPlayer
    });
}


document.getElementById(
    "flyButton"
).onclick = ()=>{
    adminCommand("fly");
};

document.getElementById(
    "colorButton"
).onclick = ()=>{
    adminCommand("color");
};

document.getElementById(
    "killButton"
).onclick = ()=>{
    adminCommand("kill");
};

document.getElementById(
    "kickButton"
).onclick = ()=>{
    adminCommand("kick");
};


document.getElementById(
    "allColorButton"
).onclick = ()=>{

    if(!admin) return;

    socket.emit(
        "adminAction",
        {
            action:"allColor"
        }
    );

};


// لیست بازیکن‌ها
socket.on("players",function(players){

    if(!admin) return;

    const list =
        document.getElementById(
            "playerList"
        );

    list.innerHTML = "";

    players.forEach(player=>{

        if(player.id === socket.id)
            return;

        const button =
            document.createElement("button");

        button.textContent =
            "👤 " +
            (player.name || "Player");

        if(player.admin){
            button.textContent +=
                " 👑";
        }

        button.dataset.player =
            player.id;

        button.onclick = function(){

            window.selectAdminPlayer(
                player.id
            );

        };

        list.appendChild(button);

    });

    if(!list.children.length){

        list.textContent =
            "بازیکن دیگری نیست";

    }

});

</script>

</body>
</html>
