<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stickman Online</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#000;
}

#game{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

#info{
    position:fixed;
    top:15px;
    left:15px;
    z-index:50;

    background:rgba(0,0,0,.7);
    color:white;

    padding:10px 16px;
    border-radius:12px;

    font-size:16px;
}


/* =========================
   ADMIN BUTTON
========================= */

#adminButton{

    display:none;

    position:fixed;
    top:15px;
    right:15px;

    z-index:9999;

    border:0;
    border-radius:14px;

    padding:14px 22px;

    background:#ef4444;
    color:white;

    font-size:18px;
    font-weight:bold;

    cursor:pointer;

    box-shadow:0 5px 25px rgba(0,0,0,.5);
}

#adminButton:active{
    transform:scale(.95);
}


/* =========================
   ADMIN OVERLAY
========================= */

#adminOverlay{

    display:none;

    position:fixed;
    inset:0;

    z-index:9998;

    background:rgba(0,0,0,.75);

    align-items:center;
    justify-content:center;

    padding:20px;
}


/* =========================
   ADMIN PANEL
========================= */

#adminPanel{

    width:min(650px,95vw);

    max-height:90vh;

    overflow:auto;

    background:#111827;

    color:white;

    border-radius:24px;

    padding:24px;

    box-shadow:0 20px 80px #000;
}


.adminHeader{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:20px;
}


.adminTitle{

    font-size:27px;

    font-weight:bold;
}


#closeAdmin{

    width:45px;
    height:45px;

    border:0;

    border-radius:50%;

    background:#374151;

    color:white;

    font-size:22px;

    cursor:pointer;
}


/* =========================
   SECTIONS
========================= */

.section{

    background:#1f2937;

    border-radius:18px;

    padding:17px;

    margin-top:15px;
}


.sectionTitle{

    font-size:19px;

    font-weight:bold;

    margin-bottom:12px;
}


/* =========================
   PLAYER LIST
========================= */

#playerList{

    display:grid;

    grid-template-columns:
        repeat(auto-fit,minmax(140px,1fr));

    gap:10px;
}


.playerButton{

    border:0;

    border-radius:12px;

    padding:12px;

    background:#374151;

    color:white;

    cursor:pointer;

    font-size:15px;
}


.playerButton.selected{

    outline:3px solid #facc15;

    background:#4b5563;
}


/* =========================
   ACTIONS
========================= */

.actions{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:12px;
}


.actionButton{

    min-height:65px;

    border:0;

    border-radius:15px;

    color:white;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;
}


.fly{
    background:#7c3aed;
}

.color{
    background:#db2777;
}

.kill{
    background:#dc2626;
}

.kick{
    background:#ea580c;
}

.allColor{
    background:#0891b2;
}


#adminStatus{

    margin-top:15px;

    padding:12px;

    border-radius:12px;

    background:#0f172a;

    text-align:center;

    color:#cbd5e1;
}


/* =========================
   CONTROLS
========================= */

#controls{

    position:fixed;

    left:0;
    right:0;
    bottom:20px;

    z-index:100;

    display:flex;

    justify-content:space-between;

    padding:0 20px;

    pointer-events:none;
}


.controlGroup{

    display:flex;

    gap:12px;

    pointer-events:auto;
}


.control{

    width:70px;
    height:70px;

    border:0;

    border-radius:50%;

    background:#111827cc;

    color:white;

    font-size:28px;

    font-weight:bold;

    touch-action:none;

    cursor:pointer;

    user-select:none;
}


.control:active{

    transform:scale(.92);

    background:#374151dd;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .control{

        width:62px;
        height:62px;

        font-size:24px;
    }

    #adminPanel{

        padding:17px;
    }

    .adminTitle{

        font-size:22px;
    }

}

</style>

</head>


<body>


<!-- =========================
     GAME
========================= -->

<canvas id="game"></canvas>


<!-- =========================
     INFO
========================= -->

<div id="info">
🎮 Player
</div>


<!-- =========================
     ADMIN BUTTON
========================= -->

<button
    id="adminButton"
    type="button"
>
👑 ADMIN
</button>


<!-- =========================
     ADMIN PANEL
========================= -->

<div
    id="adminOverlay"
>

<div id="adminPanel">


<div class="adminHeader">

<div class="adminTitle">
👑 پنل مدیریت
</div>


<button
    id="closeAdmin"
    type="button"
>
✕
</button>

</div>


<!-- =========================
     PLAYERS
========================= -->

<div class="section">

<div class="sectionTitle">
👥 انتخاب بازیکن
</div>


<div id="playerList">
بازیکنی نیست
</div>

</div>


<!-- =========================
     ACTIONS
========================= -->

<div class="section">

<div class="sectionTitle">
⚡ قابلیت‌ها
</div>


<div class="actions">


<button
    id="flyButton"
    class="actionButton fly"
    type="button"
>
✈️ پرواز
</button>


<button
    id="colorButton"
    class="actionButton color"
    type="button"
>
🌈 رنگی شدن
</button>


<button
    id="killButton"
    class="actionButton kill"
    type="button"
>
💀 کشتن
</button>


<button
    id="kickButton"
    class="actionButton kick"
    type="button"
>
🚪 بیرون انداختن
</button>


</div>

</div>


<!-- =========================
     ALL COLOR
========================= -->

<div class="section">

<button
    id="allColorButton"
    class="actionButton allColor"
    type="button"
    style="width:100%"
>
🌈 رنگی کردن همه
</button>

</div>


<div id="adminStatus">
اول یک بازیکن را انتخاب کن
</div>


</div>

</div>


<!-- =========================
     CONTROLS
========================= -->

<div id="controls">


<div class="controlGroup">

<button
    id="left"
    class="control"
    type="button"
>
◀
</button>


<button
    id="right"
    class="control"
    type="button"
>
▶
</button>

</div>


<div class="controlGroup">

<button
    id="jump"
    class="control"
    type="button"
>
⬆
</button>

</div>


</div>


<!-- =========================
     SOCKET.IO
========================= -->

<script src="/socket.io/socket.io.js"></script>


<!-- =========================
     GAME.JS
========================= -->

<script src="/game.js"></script>


<!-- =========================
     ADMIN JAVASCRIPT
========================= -->

<script>

const storedName =
    localStorage.getItem("player");


const finalName =
    String(
        storedName || "Player"
    ).trim();


document.getElementById(
    "info"
).textContent =
    "🎮 " + finalName;


// =================================
// ADMIN
// =================================

const isAdmin =
    finalName.toLowerCase() ===
    "tahagamertnt";


const adminButton =
    document.getElementById(
        "adminButton"
    );


const overlay =
    document.getElementById(
        "adminOverlay"
    );


const closeAdmin =
    document.getElementById(
        "closeAdmin"
    );


if(isAdmin){

    adminButton.style.display =
        "block";

}


// =================================
// OPEN
// =================================

adminButton.addEventListener(
    "click",
    function(){

        if(!isAdmin)
            return;

        overlay.style.display =
            "flex";

    }
);


// =================================
// CLOSE
// =================================

closeAdmin.addEventListener(
    "click",
    function(){

        overlay.style.display =
            "none";

    }
);


overlay.addEventListener(
    "click",
    function(event){

        if(
            event.target ===
            overlay
        ){

            overlay.style.display =
                "none";

        }

    }
);


// =================================
// SELECT PLAYER
// =================================

let selectedPlayer = null;


function choosePlayer(
    id,
    name
){

    selectedPlayer =
        id;


    document
        .querySelectorAll(
            ".playerButton"
        )
        .forEach(
            button => {

                button.classList.remove(
                    "selected"
                );

            }
        );


    const button =
        document.querySelector(
            `[data-player-id="${id}"]`
        );


    if(button){

        button.classList.add(
            "selected"
        );

    }


    document.getElementById(
        "adminStatus"
    ).textContent =
        "🎯 انتخاب: " + name;

}


// =================================
// PLAYER LIST
// =================================

if(isAdmin){

    socket.on(
        "players",
        function(players){

            const list =
                document.getElementById(
                    "playerList"
                );


            list.innerHTML =
                "";


            if(
                !Array.isArray(players)
            ){

                list.textContent =
                    "بازیکنی نیست";

                return;

            }


            players.forEach(
                player => {

                    if(
                        !player ||
                        !player.id
                    )
                        return;


                    const button =
                        document.createElement(
                            "button"
                        );


                    button.className =
                        "playerButton";


                    button.dataset.playerId =
                        player.id;


                    const playerName =
                        player.name ||
                        "Player";


                    button.textContent =
                        "👤 " +
                        playerName +
                        (
                            player.admin
                                ? " 👑"
                                : ""
                        );


                    button.onclick =
                        function(){

                            choosePlayer(
                                player.id,
                                playerName
                            );

                        };


                    list.appendChild(
                        button
                    );

                }
            );


            if(
                list.children.length === 0
            ){

                list.textContent =
                    "بازیکنی نیست";

            }

        }
    );

}


// =================================
// SEND ADMIN ACTION
// =================================

function sendAdminAction(
    action
){

    if(!isAdmin)
        return;


    if(!selectedPlayer){

        document.getElementById(
            "adminStatus"
        ).textContent =
            "⚠️ اول یک بازیکن را انتخاب کن";

        return;

    }


    socket.emit(
        "adminAction",
        {

            action:
                action,

            targetId:
                selectedPlayer

        }
    );


    document.getElementById(
        "adminStatus"
    ).textContent =
        "✅ دستور ارسال شد";

}


// =================================
// BUTTONS
// =================================

document.getElementById(
    "flyButton"
).onclick =
function(){

    sendAdminAction(
        "fly"
    );

};


document.getElementById(
    "colorButton"
).onclick =
function(){

    sendAdminAction(
        "color"
    );

};


document.getElementById(
    "killButton"
).onclick =
function(){

    sendAdminAction(
        "kill"
    );

};


document.getElementById(
    "kickButton"
).onclick =
function(){

    sendAdminAction(
        "kick"
    );

};


document.getElementById(
    "allColorButton"
).onclick =
function(){

    if(!isAdmin)
        return;


    socket.emit(
        "adminAction",
        {
            action:
                "allColor"
        }
    );


    document.getElementById(
        "adminStatus"
    ).textContent =
        "🌈 همه رنگی شدند";

};

</script>


</body>
</html>
