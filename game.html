<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no,
      viewport-fit=cover">

<title>Stickman Forest</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    position:fixed;
    inset:0;
    background:#75d7ff;
    touch-action:none;
    overscroll-behavior:none;
}

body{
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
    width:100vw;
    height:100vh;
    touch-action:none;
}

/* دکمه‌های موبایل */

.controls{
    position:fixed;
    left:0;
    right:0;
    bottom:
        max(18px, env(safe-area-inset-bottom));

    display:flex;
    justify-content:flex-start;

    padding-left:20px;

    z-index:50;

    pointer-events:none;
}

.control-group{
    display:flex;
    gap:12px;
    pointer-events:auto;
}

.control{
    width:70px;
    height:70px;

    border:0;
    border-radius:20px;

    background:rgba(20,20,20,.65);
    color:white;

    font-size:30px;

    touch-action:none;

    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;

    -webkit-tap-highlight-color:transparent;

    outline:none;
}

.control:active{
    transform:scale(.94);
    background:rgba(50,50,50,.85);
}


/* ادمین */

#adminButton{
    display:none;

    position:fixed;

    top:
        max(15px, env(safe-area-inset-top));

    right:15px;

    z-index:100;

    padding:12px 18px;

    border:0;
    border-radius:14px;

    background:#7c3aed;
    color:white;

    font-size:16px;
    font-weight:bold;

    touch-action:manipulation;
}


/* پنل ادمین */

#adminPanel{
    display:none;

    position:fixed;

    top:70px;
    right:15px;

    width:280px;
    max-width:calc(100vw - 30px);

    z-index:90;

    padding:18px;

    border-radius:18px;

    background:rgba(20,20,25,.96);
    color:white;

    text-align:center;

    box-shadow:0 10px 35px #0008;
}

.adminBtn{
    width:100%;

    padding:12px;

    margin:5px 0;

    border:0;
    border-radius:10px;

    background:#333;

    color:white;

    font-size:15px;

    touch-action:manipulation;
}

.close{
    background:#b91c1c;
}


/* موبایل */

@media(max-width:700px){

    .control{
        width:64px;
        height:64px;
        font-size:27px;
    }

    #adminButton{
        font-size:14px;
        padding:10px 14px;
    }

}


/* کامپیوتر */

@media(min-width:701px){

    .controls{
        display:none;
    }

}

</style>
</head>

<body>

<canvas id="game"></canvas>


<button id="adminButton">
⚡ ADMIN
</button>


<div id="adminPanel">

    <h2>⚡ ADMIN PANEL</h2>

    <p id="adminName"></p>

    <button class="adminBtn" onclick="adminMessage()">
        📢 پیام
    </button>

    <button class="adminBtn" onclick="changeSpeed()">
        🏃 تغییر سرعت
    </button>

    <button class="adminBtn" onclick="giveCoins()">
        🪙 دادن سکه
    </button>

    <button class="adminBtn" onclick="teleport()">
        📍 تلپورت
    </button>

    <button class="adminBtn" onclick="nightMode()">
        🌙 شب
    </button>

    <button class="adminBtn close" onclick="closeAdmin()">
        ❌ بستن
    </button>

</div>


<div class="controls">

    <div class="control-group">

        <button
            class="control"
            id="left"
            type="button">
            ⬅️
        </button>

        <button
            class="control"
            id="right"
            type="button">
            ➡️
        </button>

    </div>

</div>


<script>

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");


/* =========================
   صفحه
========================= */

let W = 0;
let H = 0;

function resize(){

    W = window.innerWidth;
    H = window.innerHeight;

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        Math.floor(W * dpr);

    canvas.height =
        Math.floor(H * dpr);

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

}

resize();

window.addEventListener(
    "resize",
    resize
);


/* =========================
   اسم
========================= */

const PLAYER_NAME =
    "tahagamertnt";

const ADMIN_NAME =
    "tahagamertnt";


/* =========================
   بازیکن
========================= */

let player = {

    x: W / 2,

    y: H - 180,

    speed: 6,

    walk: 0,

    coins: 0

};


/* =========================
   کیبورد
========================= */

let keys = {};

document.addEventListener(
    "keydown",
    function(e){

        keys[e.key] = true;

    }
);

document.addEventListener(
    "keyup",
    function(e){

        keys[e.key] = false;

    }
);


/* =========================
   موبایل
========================= */

let moveLeft = false;
let moveRight = false;


const leftButton =
    document.getElementById("left");

const rightButton =
    document.getElementById("right");


/* لمس مدرن */

function leftStart(e){

    e.preventDefault();

    moveLeft = true;

    if(e.pointerId !== undefined){

        try{
            leftButton.setPointerCapture(
                e.pointerId
            );
        }catch(err){}

    }

}


function leftEnd(e){

    e.preventDefault();

    moveLeft = false;

}


function rightStart(e){

    e.preventDefault();

    moveRight = true;

    if(e.pointerId !== undefined){

        try{
            rightButton.setPointerCapture(
                e.pointerId
            );
        }catch(err){}

    }

}


function rightEnd(e){

    e.preventDefault();

    moveRight = false;

}


/* pointer */

leftButton.addEventListener(
    "pointerdown",
    leftStart,
    {passive:false}
);

leftButton.addEventListener(
    "pointerup",
    leftEnd,
    {passive:false}
);

leftButton.addEventListener(
    "pointercancel",
    leftEnd,
    {passive:false}
);

leftButton.addEventListener(
    "pointerleave",
    leftEnd,
    {passive:false}
);


rightButton.addEventListener(
    "pointerdown",
    rightStart,
    {passive:false}
);

rightButton.addEventListener(
    "pointerup",
    rightEnd,
    {passive:false}
);

rightButton.addEventListener(
    "pointercancel",
    rightEnd,
    {passive:false}
);

rightButton.addEventListener(
    "pointerleave",
    rightEnd,
    {passive:false}
);


/* جلوگیری از منوی نگه داشتن */

document.addEventListener(
    "contextmenu",
    function(e){

        e.preventDefault();

    }
);


document.addEventListener(
    "selectstart",
    function(e){

        e.preventDefault();

    }
);


document.addEventListener(
    "dragstart",
    function(e){

        e.preventDefault();

    }
);


/* =========================
   حرکت
========================= */

function update(){

    let moving = false;


    if(
        keys["a"] ||
        keys["A"] ||
        keys["ش"] ||
        moveLeft
    ){

        player.x -=
            player.speed;

        player.walk +=
            0.35;

        moving = true;

    }


    if(
        keys["d"] ||
        keys["D"] ||
        keys["ی"] ||
        moveRight
    ){

        player.x +=
            player.speed;

        player.walk +=
            0.35;

        moving = true;

    }


    if(!moving){

        player.walk *= 0.8;

    }


    if(player.x < 50){

        player.x = 50;

    }


    if(player.x > W - 50){

        player.x = W - 50;

    }


    player.y =
        H - 180;

}


/* =========================
   جنگل
========================= */

function drawForest(){

    let sky =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );

    sky.addColorStop(
        0,
        "#69cfff"
    );

    sky.addColorStop(
        1,
        "#d8f7ff"
    );

    ctx.fillStyle = sky;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* خورشید */

    ctx.fillStyle =
        "#ffd83d";

    ctx.beginPath();

    ctx.arc(
        90,
        80,
        42,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* زمین */

    ctx.fillStyle =
        "#3fa447";

    ctx.fillRect(
        0,
        H - 100,
        W,
        100
    );


    ctx.fillStyle =
        "#268631";

    ctx.fillRect(
        0,
        H - 100,
        W,
        12
    );


    /* درخت‌ها */

    for(
        let x = -50;
        x < W + 200;
        x += 230
    ){

        drawTree(
            x,
            H - 270
        );

    }

}


/* =========================
   درخت
========================= */

function drawTree(x,y){

    ctx.fillStyle =
        "#704214";

    ctx.fillRect(
        x,
        y,
        45,
        170
    );


    ctx.fillStyle =
        "#238b35";

    ctx.beginPath();

    ctx.arc(
        x + 22,
        y - 20,
        75,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        x - 25,
        y + 20,
        50,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        x + 70,
        y + 20,
        50,
        0,
        Math.PI * 2
    );

    ctx.fill();

}


/* =========================
   استیکمن
========================= */

function drawPlayer(){

    let x =
        player.x;

    let y =
        player.y;

    let move =
        Math.sin(
            player.walk
        ) * 25;


    ctx.strokeStyle =
        "#111";

    ctx.lineWidth = 7;

    ctx.lineCap =
        "round";


    /* اسم */

    ctx.fillStyle =
        "#111";

    ctx.font =
        "bold 23px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        PLAYER_NAME,
        x,
        y - 175
    );


    /* سر */

    ctx.beginPath();

    ctx.arc(
        x,
        y - 115,
        28,
        0,
        Math.PI * 2
    );

    ctx.stroke();


    /* بدن */

    ctx.beginPath();

    ctx.moveTo(
        x,
        y - 87
    );

    ctx.lineTo(
        x,
        y
    );

    ctx.stroke();


    /* دست چپ */

    ctx.beginPath();

    ctx.moveTo(
        x,
        y - 60
    );

    ctx.lineTo(
        x - 50,
        y - 25 + move
    );

    ctx.stroke();


    /* دست راست */

    ctx.beginPath();

    ctx.moveTo(
        x,
        y - 60
    );

    ctx.lineTo(
        x + 50,
        y - 25 - move
    );

    ctx.stroke();


    /* پا چپ */

    ctx.beginPath();

    ctx.moveTo(
        x,
        y
    );

    ctx.lineTo(
        x - 30,
        y + 70 + move
    );

    ctx.stroke();


    /* پا راست */

    ctx.beginPath();

    ctx.moveTo(
        x,
        y
    );

    ctx.lineTo(
        x + 30,
        y + 70 - move
    );

    ctx.stroke();


    ctx.textAlign =
        "left";

}


/* =========================
   ادمین
========================= */

const adminButton =
    document.getElementById(
        "adminButton"
    );

const adminPanel =
    document.getElementById(
        "adminPanel"
    );

const adminName =
    document.getElementById(
        "adminName"
    );


if(
    PLAYER_NAME === ADMIN_NAME
){

    adminButton.style.display =
        "block";

    adminName.textContent =
        "👑 tahagamertnt";

}


adminButton.addEventListener(
    "click",
    function(){

        adminPanel.style.display =
            "block";

    }
);


function closeAdmin(){

    adminPanel.style.display =
        "none";

}


function adminMessage(){

    let msg =
        prompt(
            "📢 پیام ادمین:"
        );

    if(msg){

        alert(
            "📢 ADMIN:\n\n" +
            msg
        );

    }

}


function changeSpeed(){

    let value =
        prompt(
            "🏃 سرعت جدید:",
            player.speed
        );

    if(value !== null){

        let n =
            Number(value);

        if(
            n > 0 &&
            n <= 50
        ){

            player.speed = n;

        }

    }

}


function giveCoins(){

    player.coins += 100;

    alert(
        "🪙 +100 Coins\n\n" +
        "Coins: " +
        player.coins
    );

}


function teleport(){

    player.x =
        W / 2;

}


let night = false;

function nightMode(){

    night =
        !night;

}


/* =========================
   بازی
========================= */

function gameLoop(){

    update();

    drawForest();

    if(night){

        ctx.fillStyle =
            "rgba(10,20,60,.6)";

        ctx.fillRect(
            0,
            0,
            W,
            H
        );

    }

    drawPlayer();

    requestAnimationFrame(
        gameLoop
    );

}


gameLoop();

</script>

</body>
</html>
