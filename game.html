<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>Stickman World</title>

<style>

*{
    box-sizing:border-box;
    user-select:none;
}

html,body{

    margin:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:#60cfff;

    font-family:Arial;
}

canvas{

    display:block;

    width:100%;
    height:100%;

    touch-action:none;
}

#hud{

    position:fixed;

    top:10px;
    left:10px;

    z-index:10;

    background:#000b;

    color:white;

    padding:10px 15px;

    border-radius:14px;

    line-height:1.7;
}

#admin{

    color:#ffd700;

    font-weight:bold;

    display:none;
}

#players{

    position:fixed;

    top:10px;
    right:10px;

    z-index:10;

    background:#000b;

    color:white;

    padding:10px;

    border-radius:14px;

    min-width:140px;
}

#controls{

    position:fixed;

    bottom:18px;

    left:0;
    right:0;

    display:flex;

    justify-content:space-between;

    padding:0 18px;

    z-index:20;

    direction:ltr;
}

.group{

    display:flex;

    gap:10px;
}

button{

    width:68px;
    height:68px;

    border-radius:50%;

    border:2px solid white;

    background:#000b;

    color:white;

    font-size:25px;

    touch-action:none;
}

#run{
    background:#2563eb;
}

#jump{
    background:#f59e0b;
}

</style>

</head>

<body>

<canvas id="game"></canvas>


<div id="hud">

👤 <span id="myName"></span>

<br>

🏠 <span id="myRoom"></span>

<br>

❤️ <span id="health">100</span>

<br>

⭐ <span id="score">0</span>

<div id="admin">
👑 ADMIN
</div>

</div>


<div id="players">

👥 بازیکنان

<div id="list"></div>

</div>


<div id="controls">

<div class="group">

<button id="left">◀</button>

<button id="right">▶</button>

<button id="run">🏃</button>

</div>

<button id="jump">⬆</button>

</div>


<script src="/socket.io/socket.io.js"></script>

<script>

/* =====================
   اطلاعات
===================== */

const socket = io();

const myName =
    localStorage.getItem("player")
    || "Player";

const myRoom =
    localStorage.getItem("room")
    || "------";

document.getElementById(
    "myName"
).textContent = myName;

document.getElementById(
    "myRoom"
).textContent = myRoom;

if(
    myName.toLowerCase()
    === "tahagamertnt"
){

    document.getElementById(
        "admin"
    ).style.display = "block";

}


/* =====================
   Canvas
===================== */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");


function resize(){

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

}

resize();

window.addEventListener(
    "resize",
    resize
);


/* =====================
   دنیا
===================== */

const WORLD = 6000;

const GROUND = 500;


/* =====================
   بازیکن
===================== */

const me = {

    id:"",

    x:500,

    y:0,

    vx:0,

    vy:0,

    direction:1,

    walking:false,

    running:false,

    jumping:false,

    health:100,

    score:0,

    frame:0
};


const players = {};


/* =====================
   کنترل
===================== */

const keys = {

    left:false,

    right:false,

    run:false,

    jump:false
};


window.addEventListener(
"keydown",
e => {

    if(
        e.key === "ArrowLeft" ||
        e.key.toLowerCase() === "a"
    ){
        keys.left = true;
    }

    if(
        e.key === "ArrowRight" ||
        e.key.toLowerCase() === "d"
    ){
        keys.right = true;
    }

    if(e.key === "Shift"){
        keys.run = true;
    }

    if(e.code === "Space"){
        e.preventDefault();
        keys.jump = true;
    }

});


window.addEventListener(
"keyup",
e => {

    if(
        e.key === "ArrowLeft" ||
        e.key.toLowerCase() === "a"
    ){
        keys.left = false;
    }

    if(
        e.key === "ArrowRight" ||
        e.key.toLowerCase() === "d"
    ){
        keys.right = false;
    }

    if(e.key === "Shift"){
        keys.run = false;
    }

    if(e.code === "Space"){
        keys.jump = false;
    }

});


function touchButton(
    id,
    key
){

    const button =
        document.getElementById(id);

    button.addEventListener(
        "pointerdown",
        e => {

            e.preventDefault();

            keys[key] = true;

        }
    );

    button.addEventListener(
        "pointerup",
        e => {

            e.preventDefault();

            keys[key] = false;

        }
    );

    button.addEventListener(
        "pointercancel",
        () => {

            keys[key] = false;

        }
    );

}

touchButton("left","left");
touchButton("right","right");
touchButton("run","run");
touchButton("jump","jump");


/* =====================
   Socket
===================== */

socket.on(
"connect",
() => {

    me.id = socket.id;

    socket.emit("gameReady");

});


/* =====================
   همه بازیکنان
===================== */

socket.on(
"players",
list => {

    list.forEach(p => {

        if(p.id === me.id){

            me.health =
                p.health ?? 100;

            me.score =
                p.score ?? 0;

            return;
        }

        players[p.id] = {

            id:p.id,

            name:p.name,

            admin:p.admin,

            x:p.x,

            y:p.y,

            direction:p.direction,

            walking:p.walking,

            running:p.running,

            jumping:p.jumping,

            frame:0
        };

    });

    updateList();

});


/* =====================
   حرکت دوستان
===================== */

socket.on(
"move",
p => {

    if(p.id === me.id)
        return;

    if(!players[p.id]){

        players[p.id] = {
            ...p,
            frame:0
        };

        return;
    }

    Object.assign(
        players[p.id],
        p
    );

});


/* =====================
   خروج دوست
===================== */

socket.on(
"playerLeft",
id => {

    delete players[id];

    updateList();

});


/* =====================
   لیست
===================== */

function updateList(){

    const list =
        document.getElementById("list");

    list.innerHTML =
        "👤 " + myName;

    if(
        myName.toLowerCase()
        === "tahagamertnt"
    ){

        list.innerHTML +=
            " 👑";

    }

    Object.values(players)
    .forEach(p => {

        list.innerHTML +=
            "<br>👤 " +
            p.name +
            (
                p.admin
                ? " 👑"
                : ""
            );

    });

}


/* =====================
   فیزیک
===================== */

function update(){

    let speed =
        keys.run ? 8 : 4;

    me.walking = false;
    me.running = false;


    if(keys.left){

        me.vx = -speed;

        me.direction = -1;

        me.walking = true;

    }
    else if(keys.right){

        me.vx = speed;

        me.direction = 1;

        me.walking = true;

    }
    else{

        me.vx *= .75;

        if(
            Math.abs(me.vx)
            < .1
        ){
            me.vx = 0;
        }

    }


    if(
        keys.run &&
        me.walking
    ){

        me.running = true;

    }


    me.x += me.vx;


    /* پرش */

    if(
        keys.jump &&
        !me.jumping
    ){

        me.vy = -14;

        me.jumping = true;

    }


    me.vy += .7;

    me.y += me.vy;


    if(me.y >= 0){

        me.y = 0;

        me.vy = 0;

        me.jumping = false;

    }


    if(me.x < 30)
        me.x = 30;

    if(
        me.x >
        WORLD - 30
    ){
        me.x =
            WORLD - 30;
    }


    me.frame++;

}


/* =====================
   ارسال
===================== */

let lastSend = 0;

function send(){

    const now =
        Date.now();

    if(
        now - lastSend < 40
    ){
        return;
    }

    lastSend = now;

    socket.emit(
        "move",
        {

            x:me.x,

            y:me.y,

            direction:
                me.direction,

            walking:
                me.walking,

            running:
                me.running,

            jumping:
                me.jumping
        }
    );

}


/* =====================
   دوربین
===================== */

function camera(){

    let x =
        me.x -
        canvas.width / 2;

    if(x < 0)
        x = 0;

    if(
        x >
        WORLD -
        canvas.width
    ){

        x =
            WORLD -
            canvas.width;

    }

    return x;

}


/* =====================
   پس زمینه
===================== */

function background(){

    ctx.fillStyle =
        "#60cfff";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* خورشید */

    ctx.fillStyle =
        "#fde047";

    ctx.beginPath();

    ctx.arc(
        canvas.width - 100,
        90,
        45,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* ابرها */

    for(
        let x=-100;
        x<canvas.width+400;
        x+=350
    ){

        ctx.fillStyle =
            "#ffffffaa";

        ctx.beginPath();

        ctx.arc(
            x,
            100,
            30,
            0,
            Math.PI*2
        );

        ctx.arc(
            x+40,
            90,
            40,
            0,
            Math.PI*2
        );

        ctx.arc(
            x+80,
            105,
            30,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

}


/* =====================
   زمین
===================== */

function ground(){

    ctx.fillStyle =
        "#22c55e";

    ctx.fillRect(
        0,
        GROUND,
        canvas.width,
        canvas.height
    );


    ctx.fillStyle =
        "#15803d";

    ctx.fillRect(
        0,
        GROUND,
        canvas.width,
        10
    );

}


/* =====================
   درخت
===================== */

function tree(worldX){

    const cam =
        camera();

    const x =
        worldX - cam;

    if(
        x < -100 ||
        x > canvas.width + 100
    ){
        return;
    }


    ctx.fillStyle =
        "#78350f";

    ctx.fillRect(
        x-10,
        GROUND-100,
        20,
        100
    );


    ctx.fillStyle =
        "#166534";

    ctx.beginPath();

    ctx.arc(
        x,
        GROUND-125,
        45,
        0,
        Math.PI*2
    );

    ctx.fill();

}


/* =====================
   خانه
===================== */

function house(worldX){

    const cam =
        camera();

    const x =
        worldX - cam;

    if(
        x < -200 ||
        x > canvas.width+200
    ){
        return;
    }


    ctx.fillStyle =
        "#fbbf24";

    ctx.fillRect(
        x-80,
        GROUND-120,
        160,
        120
    );


    ctx.fillStyle =
        "#dc2626";

    ctx.beginPath();

    ctx.moveTo(
        x-105,
        GROUND-120
    );

    ctx.lineTo(
        x,
        GROUND-200
    );

    ctx.lineTo(
        x+105,
        GROUND-120
    );

    ctx.closePath();

    ctx.fill();


    ctx.fillStyle =
        "#78350f";

    ctx.fillRect(
        x-20,
        GROUND-70,
        40,
        70
    );

}


/* =====================
   استیکمن
===================== */

function stickman(
    p,
    x,
    y
){

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.scale(
        p.direction || 1,
        1
    );


    const walking =
        p.walking;

    const animation =
        walking
        ? Math.sin(
            (p.frame || 0)*.3
        )*15
        : 0;


    /* اسم */

    ctx.font =
        "bold 16px Arial";

    ctx.textAlign =
        "center";

    ctx.lineWidth = 4;

    ctx.strokeStyle =
        "#000";

    ctx.fillStyle =
        "#fff";

    ctx.strokeText(
        p.name,
        0,
        -125
    );

    ctx.fillText(
        p.name,
        0,
        -125
    );


    /* تاج ادمین */

    if(
        p.name.toLowerCase()
        === "tahagamertnt"
    ){

        ctx.font =
            "22px Arial";

        ctx.fillStyle =
            "#ffd700";

        ctx.fillText(
            "👑",
            0,
            -148
        );

    }


    ctx.strokeStyle =
        "#111";

    ctx.lineWidth =
        7;

    ctx.lineCap =
        "round";


    /* سر */

    ctx.beginPath();

    ctx.arc(
        0,
        -92,
        22,
        0,
        Math.PI*2
    );

    ctx.fillStyle =
        "#f8fafc";

    ctx.fill();

    ctx.stroke();


    /* بدن */

    ctx.beginPath();

    ctx.moveTo(
        0,
        -70
    );

    ctx.lineTo(
        0,
        -25
    );

    ctx.stroke();


    /* دست‌ها */

    ctx.beginPath();

    ctx.moveTo(
        0,
        -60
    );

    ctx.lineTo(
        -32,
        -30+animation
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
        0,
        -60
    );

    ctx.lineTo(
        32,
        -30-animation
    );

    ctx.stroke();


    /* پاها */

    ctx.beginPath();

    ctx.moveTo(
        0,
        -25
    );

    ctx.lineTo(
        -20+animation,
        20
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.moveTo(
        0,
        -25
    );

    ctx.lineTo(
        20-animation,
        20
    );

    ctx.stroke();


    ctx.restore();

}


/* =====================
   رسم بازی
===================== */

function draw(){

    background();

    ground();


    for(
        let x=300;
        x<WORLD;
        x+=450
    ){

        tree(x);

    }


    house(1200);
    house(3000);
    house(4800);


    const cam =
        camera();


    Object.values(players)
    .forEach(p => {

        p.frame =
            (p.frame || 0)+1;

        stickman(
            p,
            p.x-cam,
            GROUND+p.y
        );

    });


    stickman(
        me,
        canvas.width/2,
        GROUND+me.y
    );


    document.getElementById(
        "health"
    ).textContent =
        me.health;

    document.getElementById(
        "score"
    ).textContent =
        me.score;

}


/* =====================
   شروع
===================== */

function loop(){

    update();

    send();

    draw();

    requestAnimationFrame(loop);

}

loop();

</script>

</body>

</html>
