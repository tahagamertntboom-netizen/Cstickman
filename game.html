<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Stickman World</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#60cfff;
    font-family:Arial,sans-serif;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    touch-action:none;
}

#hud{
    position:fixed;
    top:12px;
    left:12px;
    z-index:20;
    color:white;
    background:rgba(0,0,0,.7);
    padding:12px 16px;
    border-radius:15px;
    font-size:16px;
    line-height:1.8;
}

#admin{
    color:#ffd700;
    font-weight:bold;
    display:none;
}

#players{
    position:fixed;
    top:12px;
    right:12px;
    z-index:20;
    color:white;
    background:rgba(0,0,0,.7);
    padding:12px;
    border-radius:15px;
    min-width:140px;
}

#controls{
    position:fixed;
    bottom:20px;
    left:0;
    right:0;
    z-index:30;
    display:flex;
    justify-content:space-between;
    padding:0 20px;
    direction:ltr;
    pointer-events:none;
}

.group{
    display:flex;
    gap:10px;
}

.control{
    width:68px;
    height:68px;
    border-radius:50%;
    border:2px solid white;
    background:rgba(0,0,0,.65);
    color:white;
    font-size:26px;
    pointer-events:auto;
    touch-action:none;
}

#run{
    background:#2563eb;
}

#jump{
    background:#f59e0b;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
👤 <span id="name"></span><br>
🏠 اتاق: <span id="room"></span><br>
❤️ جان: <span id="health">100</span><br>
⭐ امتیاز: <span id="score">0</span>

<div id="admin">👑 ADMIN</div>
</div>

<div id="players">
👥 بازیکنان
<div id="playerList"></div>
</div>

<div id="controls">

<div class="group">
<button class="control" id="left">◀</button>
<button class="control" id="right">▶</button>
<button class="control" id="run">🏃</button>
</div>

<button class="control" id="jump">⬆</button>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

/* =========================
   اطلاعات
========================= */

const socket = io();

const myName =
    localStorage.getItem("player") || "Player";

const roomCode =
    localStorage.getItem("room") || "------";

document.getElementById("name").textContent = myName;
document.getElementById("room").textContent = roomCode;

if(myName.toLowerCase() === "tahagamertnt"){
    document.getElementById("admin").style.display = "block";
}


/* =========================
   Canvas
========================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

resize();

window.addEventListener("resize",resize);


/* =========================
   دنیای بازی
========================= */

const WORLD_WIDTH = 6000;
const GROUND = 500;


/* =========================
   بازیکن من
========================= */

const me = {

    id:"",
    x:500,
    y:0,

    vx:0,
    vy:0,

    direction:1,

    jumping:false,
    walking:false,
    running:false,

    health:100,
    score:0,

    frame:0
};


/* بازیکن‌های دیگر */

const otherPlayers = {};


/* =========================
   کنترل
========================= */

const keys = {
    left:false,
    right:false,
    run:false,
    jump:false
};


/* کیبورد */

window.addEventListener("keydown",function(e){

    if(
        e.key === "ArrowLeft" ||
        e.key.toLowerCase() === "a"
    ){
        keys.left = true;
    }

    if(
        e.key === "ArrowRight" ||
        e.key.toLowerCase() === "d"
    ){
        keys.right = true;
    }

    if(e.key === "Shift"){
        keys.run = true;
    }

    if(e.code === "Space"){
        e.preventDefault();
        keys.jump = true;
    }

});


window.addEventListener("keyup",function(e){

    if(
        e.key === "ArrowLeft" ||
        e.key.toLowerCase() === "a"
    ){
        keys.left = false;
    }

    if(
        e.key === "ArrowRight" ||
        e.key.toLowerCase() === "d"
    ){
        keys.right = false;
    }

    if(e.key === "Shift"){
        keys.run = false;
    }

    if(e.code === "Space"){
        keys.jump = false;
    }

});


/* موبایل */

function mobileControl(id,key){

    const button =
        document.getElementById(id);

    button.addEventListener(
        "pointerdown",
        function(e){
            e.preventDefault();
            keys[key] = true;
        }
    );

    button.addEventListener(
        "pointerup",
        function(e){
            e.preventDefault();
            keys[key] = false;
        }
    );

    button.addEventListener(
        "pointercancel",
        function(){
            keys[key] = false;
        }
    );

    button.addEventListener(
        "pointerleave",
        function(){
            keys[key] = false;
        }
    );
}

mobileControl("left","left");
mobileControl("right","right");
mobileControl("run","run");
mobileControl("jump","jump");


/* =========================
   اتصال
========================= */

socket.on("connect",function(){

    me.id = socket.id;

    socket.emit("gameJoin");

});


/* =========================
   بازیکن‌ها
========================= */

socket.on("gamePlayers",function(list){

    list.forEach(function(p){

        if(p.id === me.id){
            return;
        }

        otherPlayers[p.id] = {
            id:p.id,
            name:p.name || "Player",
            admin:!!p.admin,

            x:Number(p.x) || 500,
            y:Number(p.y) || 0,

            direction:p.direction || 1,

            walking:!!p.walking,
            running:!!p.running,
            jumping:!!p.jumping,

            frame:0
        };

    });

    updatePlayerList();

});


socket.on("playerMove",function(p){

    if(p.id === me.id){
        return;
    }

    if(!otherPlayers[p.id]){

        otherPlayers[p.id] = {
            id:p.id,
            name:p.name || "Player",
            admin:!!p.admin,
            x:500,
            y:0,
            direction:1,
            walking:false,
            running:false,
            jumping:false,
            frame:0
        };

    }

    const player =
        otherPlayers[p.id];

    player.x = Number(p.x) || player.x;
    player.y = Number(p.y) || 0;

    player.direction =
        p.direction || 1;

    player.walking =
        !!p.walking;

    player.running =
        !!p.running;

    player.jumping =
        !!p.jumping;

});


socket.on("playerLeave",function(id){

    delete otherPlayers[id];

    updatePlayerList();

});


/* =========================
   لیست بازیکنان
========================= */

function updatePlayerList(){

    const list =
        document.getElementById("playerList");

    list.innerHTML =
        "👤 " + myName;

    if(myName.toLowerCase() === "tahagamertnt"){
        list.innerHTML += " 👑";
    }

    Object.values(otherPlayers).forEach(function(p){

        list.innerHTML +=
            "<br>👤 " +
            p.name +
            (
                p.name.toLowerCase() ===
                "tahagamertnt"
                ? " 👑"
                : ""
            );

    });

}


/* =========================
   فیزیک
========================= */

function update(){

    let speed = 4;

    me.walking = false;
    me.running = false;


    if(keys.run){
        speed = 8;
        me.running = true;
    }


    if(keys.left){

        me.vx = -speed;
        me.direction = -1;
        me.walking = true;

    }
    else if(keys.right){

        me.vx = speed;
        me.direction = 1;
        me.walking = true;

    }
    else{

        me.vx *= 0.75;

        if(Math.abs(me.vx) < 0.1){
            me.vx = 0;
        }

    }


    me.x += me.vx;


    /* پرش */

    if(
        keys.jump &&
        !me.jumping
    ){

        me.vy = -14;
        me.jumping = true;

    }


    me.vy += 0.7;

    me.y += me.vy;


    if(me.y >= 0){

        me.y = 0;
        me.vy = 0;
        me.jumping = false;

    }


    /* مرز */

    if(me.x < 40){
        me.x = 40;
    }

    if(me.x > WORLD_WIDTH - 40){
        me.x = WORLD_WIDTH - 40;
    }


    me.frame++;


    document.getElementById("health")
        .textContent = me.health;

    document.getElementById("score")
        .textContent = me.score;

}


/* =========================
   ارسال حرکت
========================= */

let lastSend = 0;

function sendMovement(){

    const now = Date.now();

    if(now - lastSend < 40){
        return;
    }

    lastSend = now;

    socket.emit(
        "playerMove",
        {
            x:me.x,
            y:me.y,
            direction:me.direction,
            walking:me.walking,
            running:me.running,
            jumping:me.jumping
        }
    );

}


/* =========================
   دوربین
========================= */

function getCamera(){

    let camera =
        me.x -
        canvas.width / 2;

    if(camera < 0){
        camera = 0;
    }

    const max =
        WORLD_WIDTH -
        canvas.width;

    if(camera > max){
        camera = max;
    }

    return camera;
}


/* =========================
   پس‌زمینه
========================= */

function drawBackground(){

    const sky =
        ctx.createLinearGradient(
            0,
            0,
            0,
            canvas.height
        );

    sky.addColorStop(
        0,
        "#38bdf8"
    );

    sky.addColorStop(
        1,
        "#dbeafe"
    );

    ctx.fillStyle = sky;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* خورشید */

    ctx.fillStyle = "#fde047";

    ctx.beginPath();

    ctx.arc(
        canvas.width - 100,
        90,
        45,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* ابر */

    for(
        let x = -200;
        x < canvas.width + 400;
        x += 400
    ){

        ctx.fillStyle = "rgba(255,255,255,.8)";

        ctx.beginPath();

        ctx.arc(
            x,
            120,
            30,
            0,
            Math.PI * 2
        );

        ctx.arc(
            x + 40,
            105,
            40,
            0,
            Math.PI * 2
        );

        ctx.arc(
            x + 85,
            120,
            30,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }

}


/* =========================
   زمین
========================= */

function drawGround(){

    ctx.fillStyle = "#22c55e";

    ctx.fillRect(
        0,
        GROUND,
        canvas.width,
        canvas.height
    );


    ctx.fillStyle = "#15803d";

    ctx.fillRect(
        0,
        GROUND,
        canvas.width,
        12
    );


    /* جاده */

    ctx.fillStyle = "#64748b";

    const camera = getCamera();

    ctx.fillRect(
        -camera,
        GROUND + 50,
        WORLD_WIDTH,
        90
    );

}


/* =========================
   درخت
========================= */

function drawTree(xWorld){

    const camera = getCamera();

    const x =
        xWorld - camera;

    if(
        x < -100 ||
        x > canvas.width + 100
    ){
        return;
    }


    ctx.fillStyle = "#78350f";

    ctx.fillRect(
        x - 12,
        GROUND - 100,
        24,
        100
    );


    ctx.fillStyle = "#166534";

    ctx.beginPath();

    ctx.arc(
        x,
        GROUND - 130,
        48,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        x - 35,
        GROUND - 115,
        35,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        x + 35,
        GROUND - 115,
        35,
        0,
        Math.PI * 2
    );

    ctx.fill();

}


/* =========================
   خانه
========================= */

function drawHouse(xWorld){

    const camera = getCamera();

    const x =
        xWorld - camera;

    if(
        x < -250 ||
        x > canvas.width + 250
    ){
        return;
    }


    /* خانه */

    ctx.fillStyle = "#fbbf24";

    ctx.fillRect(
        x - 90,
        GROUND - 130,
        180,
        130
    );


    /* سقف */

    ctx.fillStyle = "#dc2626";

    ctx.beginPath();

    ctx.moveTo(
        x - 115,
        GROUND - 130
    );

    ctx.lineTo(
        x,
        GROUND - 220
    );

    ctx.lineTo(
        x + 115,
        GROUND - 130
    );

    ctx.closePath();

    ctx.fill();


    /* در */

    ctx.fillStyle = "#78350f";

    ctx.fillRect(
        x - 22,
        GROUND - 75,
        44,
        75
    );


    /* پنجره */

    ctx.fillStyle = "#38bdf8";

    ctx.fillRect(
        x - 70,
        GROUND - 105,
        35,
        35
    );

    ctx.fillRect(
        x + 35,
        GROUND - 105,
        35,
        35
    );

}


/* =========================
   استیکمن واقعی
========================= */

function drawStickman(
    p,
    screenX,
    screenY
){

    ctx.save();

    ctx.translate(
        screenX,
        screenY
    );

    ctx.scale(
        p.direction || 1,
        1
    );


    let animation = 0;

    if(p.walking){
        animation =
            Math.sin(
                (p.frame || 0) * 0.35
            ) * 14;
    }


    /* اسم */

    ctx.font =
        "bold 16px Arial";

    ctx.textAlign =
        "center";

    ctx.fillStyle =
        "white";

    ctx.strokeStyle =
        "black";

    ctx.lineWidth = 4;

    ctx.strokeText(
        p.name,
        0,
        -125
    );

    ctx.fillText(
        p.name,
        0,
        -125
    );


    /* تاج */

    if(
        p.name.toLowerCase() ===
        "tahagamertnt"
    ){

        ctx.font =
            "22px Arial";

        ctx.fillStyle =
            "#ffd700";

        ctx.fillText(
            "👑",
            0,
            -148
        );

    }


    /* استیکمن */

    ctx.strokeStyle =
        "#111827";

    ctx.lineWidth = 7;

    ctx.lineCap =
        "round";


    /* سر */

    ctx.beginPath();

    ctx.arc(
        0,
        -92,
        22,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "#f8fafc";

    ctx.fill();

    ctx.stroke();


    /* چشم */

    ctx.fillStyle =
        "#111827";

    ctx.beginPath();

    ctx.arc(
        7,
        -96,
        3,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* بدن */

    ctx.beginPath();

    ctx.moveTo(
        0,
        -69
    );

    ctx.lineTo(
        0,
        -25
    );

    ctx.stroke();


    /* دست چپ */

    ctx.beginPath();

    ctx.moveTo(
        0,
        -60
    );

    ctx.lineTo(
        -32,
        -32 + animation
    );

    ctx.stroke();


    /* دست راست */

    ctx.beginPath();

    ctx.moveTo(
        0,
        -60
    );

    ctx.lineTo(
        32,
        -32 - animation
    );

    ctx.stroke();


    /* پای چپ */

    ctx.beginPath();

    ctx.moveTo(
        0,
        -25
    );

    ctx.lineTo(
        -20 + animation,
        18
    );

    ctx.stroke();


    /* پای راست */

    ctx.beginPath();

    ctx.moveTo(
        0,
        -25
    );

    ctx.lineTo(
        20 - animation,
        18
    );

    ctx.stroke();


    /* سایه */

    ctx.restore();

}


/* =========================
   رسم همه چیز
========================= */

function draw(){

    drawBackground();

    drawGround();


    /* درخت‌ها */

    for(
        let x = 250;
        x < WORLD_WIDTH;
        x += 430
    ){

        drawTree(x);

    }


    /* خانه‌ها */

    drawHouse(1100);
    drawHouse(2800);
    drawHouse(4500);


    const camera =
        getCamera();


    /* بازیکنان دیگر */

    Object.values(
        otherPlayers
    ).forEach(function(p){

        p.frame =
            (p.frame || 0) + 1;

        drawStickman(
            p,
            p.x - camera,
            GROUND + p.y
        );

    });


    /* خودم */

    drawStickman(
        me,
        canvas.width / 2,
        GROUND + me.y
    );

}


/* =========================
   شروع
========================= */

function gameLoop(){

    update();

    sendMovement();

    draw();

    requestAnimationFrame(
        gameLoop
    );

}

gameLoop();

</script>

</body>
</html>
