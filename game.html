<!DOCTYPE html>
<html lang="fa">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Stickman World</title>

<style>

*{
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}

html,
body{

    margin:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:#7dd3fc;

}

canvas{

    display:block;

    width:100%;
    height:100%;

    touch-action:none;

}

#info{

    position:fixed;

    top:12px;

    left:50%;

    transform:translateX(-50%);

    padding:9px 18px;

    border-radius:15px;

    background:#0008;

    color:white;

    font-family:Arial;

    text-align:center;

    z-index:10;

}

#controls{

    position:fixed;

    left:0;
    right:0;
    bottom:20px;

    display:flex;

    justify-content:space-between;

    padding:0 20px;

    pointer-events:none;

}

.controlGroup{

    display:flex;

    gap:12px;

}

.control{

    width:70px;
    height:70px;

    border-radius:50%;

    border:2px solid white;

    background:#0008;

    color:white;

    font-size:28px;

    pointer-events:auto;

    touch-action:none;

}

#jump{

    width:80px;
    height:80px;

    background:#f59e0b;

}

</style>

</head>

<body>

<canvas id="game"></canvas>


<div id="info">

🎮 <span id="name"></span>

<br>

اتاق:
<span id="room"></span>

</div>


<div id="controls">

<div class="controlGroup">

<button
class="control"
id="left"
type="button"
>
◀
</button>

<button
class="control"
id="right"
type="button"
>
▶
</button>

</div>

<button
class="control"
id="jump"
type="button"
>
⬆
</button>

</div>


<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");


/* =========================
   اطلاعات بازیکن
========================= */

const myName =
localStorage.getItem("player")
|| "Player";

const roomCode =
localStorage.getItem("room")
|| "";


document.getElementById("name")
.textContent = myName;

document.getElementById("room")
.textContent = roomCode;


/* =========================
   اندازه صفحه
========================= */

function resize(){

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

}

resize();

window.addEventListener(
    "resize",
    resize
);


/* =========================
   دنیا
========================= */

const WORLD_WIDTH = 5000;

const GROUND_Y = 520;


/* =========================
   بازیکن
========================= */

const me = {

    id:"",

    name:myName,

    x:300,

    y:GROUND_Y,

    vx:0,

    vy:0,

    direction:1,

    walking:false,

    jumping:false,

    frame:0

};


const others = {};


/* =========================
   کنترل
========================= */

const keys = {

    left:false,

    right:false,

    jump:false

};


/* کیبورد */

window.addEventListener(
    "keydown",
    function(e){

        if(
            e.key === "a" ||
            e.key === "A" ||
            e.key === "ش"
        ){

            keys.left = true;

        }


        if(
            e.key === "d" ||
            e.key === "D" ||
            e.key === "ی"
        ){

            keys.right = true;

        }


        if(e.code === "Space"){

            e.preventDefault();

            keys.jump = true;

        }

    }
);


window.addEventListener(
    "keyup",
    function(e){

        if(
            e.key === "a" ||
            e.key === "A" ||
            e.key === "ش"
        ){

            keys.left = false;

        }


        if(
            e.key === "d" ||
            e.key === "D" ||
            e.key === "ی"
        ){

            keys.right = false;

        }


        if(e.code === "Space"){

            keys.jump = false;

        }

    }
);


/* =========================
   کنترل موبایل
========================= */

function mobileControl(
    id,
    key
){

    const button =
        document.getElementById(id);


    button.addEventListener(
        "pointerdown",
        function(e){

            e.preventDefault();

            keys[key] = true;

        }
    );


    button.addEventListener(
        "pointerup",
        function(e){

            e.preventDefault();

            keys[key] = false;

        }
    );


    button.addEventListener(
        "pointercancel",
        function(){

            keys[key] = false;

        }
    );


    button.addEventListener(
        "pointerleave",
        function(){

            keys[key] = false;

        }
    );

}


mobileControl(
    "left",
    "left"
);

mobileControl(
    "right",
    "right"
);

mobileControl(
    "jump",
    "jump"
);


/* =========================
   اتصال به اتاق
========================= */

socket.on(
    "connect",
    function(){

        me.id =
            socket.id;


        socket.emit(
            "gameJoin"
        );

    }
);


/* =========================
   بازیکن‌های موجود
========================= */

socket.on(
    "gamePlayers",
    function(list){

        list.forEach(
            function(p){

                if(
                    p.id === me.id
                ){

                    me.x =
                        p.x || me.x;

                    return;

                }


                others[p.id] = {

                    ...p,

                    y:
                        GROUND_Y,

                    frame:0

                };

            }
        );

    }
);


/* =========================
   بازیکن جدید
========================= */

socket.on(
    "playerJoinedGame",
    function(p){

        if(
            p.id === me.id
        ){

            return;

        }


        others[p.id] = {

            ...p,

            y:GROUND_Y,

            frame:0

        };

    }
);


/* =========================
   حرکت بازیکنان
========================= */

socket.on(
    "playerMove",
    function(p){

        if(
            p.id === me.id
        ){

            return;

        }


        if(!others[p.id]){

            others[p.id] = {

                ...p,

                frame:0

            };

        }
        else{

            others[p.id].x =
                p.x;

            others[p.id].y =
                p.y;

            others[p.id].direction =
                p.direction;

            others[p.id].walking =
                p.walking;

            others[p.id].jumping =
                p.jumping;

        }

    }
);


/* =========================
   خروج بازیکن
========================= */

socket.on(
    "playerLeave",
    function(id){

        delete others[id];

    }
);


/* =========================
   فیزیک
========================= */

function updatePlayer(){

    me.walking = false;


    /* حرکت چپ */

    if(keys.left){

        me.vx = -5;

        me.direction = -1;

        me.walking = true;

    }


    /* حرکت راست */

    else if(keys.right){

        me.vx = 5;

        me.direction = 1;

        me.walking = true;

    }


    else{

        me.vx *= .75;

    }


    me.x += me.vx;


    /* پرش */

    if(
        keys.jump &&
        !me.jumping
    ){

        me.vy = -13;

        me.jumping = true;

    }


    me.vy += .6;

    me.y += me.vy;


    /* زمین */

    if(
        me.y >= GROUND_Y
    ){

        me.y = GROUND_Y;

        me.vy = 0;

        me.jumping = false;

    }


    /* محدودیت دنیا */

    if(me.x < 50){

        me.x = 50;

    }


    if(
        me.x >
        WORLD_WIDTH - 50
    ){

        me.x =
            WORLD_WIDTH - 50;

    }


    me.frame++;

}


/* =========================
   ارسال حرکت
========================= */

let lastSend = 0;

function sendPosition(){

    const now =
        Date.now();


    if(now - lastSend < 30){

        return;

    }


    lastSend = now;


    socket.emit(
        "playerMove",
        {

            x:me.x,

            y:me.y,

            direction:
                me.direction,

            walking:
                me.walking,

            jumping:
                me.jumping

        }
    );

}


/* =========================
   دوربین
========================= */

let cameraX = 0;

function updateCamera(){

    const target =
        me.x -
        canvas.width / 2;


    cameraX +=
        (target - cameraX) *
        .1;


    if(cameraX < 0){

        cameraX = 0;

    }


    const maxCamera =
        WORLD_WIDTH -
        canvas.width;


    if(cameraX > maxCamera){

        cameraX =
            maxCamera;

    }

}


/* =========================
   آسمان
========================= */

function drawSky(){

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            canvas.height
        );


    gradient.addColorStop(
        0,
        "#38bdf8"
    );

    gradient.addColorStop(
        1,
        "#dbeafe"
    );


    ctx.fillStyle =
        gradient;


    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* خورشید */

    ctx.fillStyle =
        "#fde047";


    ctx.beginPath();

    ctx.arc(
        canvas.width - 110,
        90,
        45,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* ابرها */

    drawCloud(
        200 - cameraX * .15,
        120,
        1
    );

    drawCloud(
        700 - cameraX * .15,
        170,
        .8
    );

    drawCloud(
        1300 - cameraX * .15,
        100,
        1.1
    );

}


/* =========================
   ابر
========================= */

function drawCloud(
    x,
    y,
    scale
){

    ctx.fillStyle =
        "#ffffffcc";


    ctx.beginPath();

    ctx.arc(
        x,
        y,
        25 * scale,
        0,
        Math.PI * 2
    );

    ctx.arc(
        x + 35 * scale,
        y - 12 * scale,
        35 * scale,
        0,
        Math.PI * 2
    );

    ctx.arc(
        x + 70 * scale,
        y,
        25 * scale,
        0,
        Math.PI * 2
    );

    ctx.fill();

}


/* =========================
   زمین
========================= */

function drawGround(){

    const screenGround =
        GROUND_Y;


    ctx.fillStyle =
        "#22c55e";


    ctx.fillRect(
        0,
        screenGround,
        canvas.width,
        canvas.height
    );


    ctx.fillStyle =
        "#15803d";


    ctx.fillRect(
        0,
        screenGround,
        canvas.width,
        12
    );


    /* خطوط زمین */

    ctx.fillStyle =
        "#166534";


    for(
        let x =
            -cameraX % 100;
        x <
            canvas.width;
        x += 100
    ){

        ctx.fillRect(
            x,
            GROUND_Y + 40,
            50,
            4
        );

    }

}


/* =========================
   درخت
========================= */

function drawTree(
    x
){

    const screenX =
        x - cameraX;


    if(
        screenX < -150 ||
        screenX >
        canvas.width + 150
    ){

        return;

    }


    ctx.fillStyle =
        "#78350f";


    ctx.fillRect(
        screenX - 12,
        GROUND_Y - 130,
        24,
        130
    );


    ctx.fillStyle =
        "#166534";


    ctx.beginPath();

    ctx.arc(
        screenX,
        GROUND_Y - 155,
        55,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        screenX - 40,
        GROUND_Y - 130,
        40,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        screenX + 40,
        GROUND_Y - 130,
        40,
        0,
        Math.PI * 2
    );

    ctx.fill();

}


/* =========================
   استیکمن
========================= */

function drawStickman(
    p
){

    const x =
        p.x - cameraX;


    const y =
        p.y;


    if(
        x < -100 ||
        x >
        canvas.width + 100
    ){

        return;

    }


    const walking =
        p.walking
        ? Math.sin(
            p.frame * .3
        )
        : 0;


    ctx.save();


    ctx.translate(
        x,
        y
    );


    ctx.scale(
        p.direction || 1,
        1
    );


    /* اسم */

    ctx.font =
        "bold 16px Arial";

    ctx.textAlign =
        "center";

    ctx.fillStyle =
        "white";

    ctx.strokeStyle =
        "#111827";

    ctx.lineWidth =
        4;


    ctx.strokeText(
        p.name,
        0,
        -125
    );


    ctx.fillText(
        p.name,
        0,
        -125
    );


    /* بدن */

    ctx.strokeStyle =
        "#111827";

    ctx.lineWidth =
        6;

    ctx.lineCap =
        "round";


    /* سر */

    ctx.beginPath();

    ctx.arc(
        0,
        -95,
        17,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "#f8fafc";

    ctx.fill();

    ctx.stroke();


    /* چشم */

    ctx.fillStyle =
        "#111827";


    ctx.beginPath();

    ctx.arc(
        6,
        -98,
        3,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* بدن */

    ctx.beginPath();

    ctx.moveTo(
        0,
        -78
    );

    ctx.lineTo(
        0,
        -40
    );

    ctx.stroke();


    /* دست چپ */

    ctx.beginPath();

    ctx.moveTo(
        0,
        -70
    );

    ctx.lineTo(
        -27,
        -45 + walking * 8
    );

    ctx.stroke();


    /* دست راست */

    ctx.beginPath();

    ctx.moveTo(
        0,
        -70
    );

    ctx.lineTo(
        27,
        -45 - walking * 8
    );

    ctx.stroke();


    /* پای چپ */

    ctx.beginPath();

    ctx.moveTo(
        0,
        -40
    );

    ctx.lineTo(
        -20 + walking * 12,
        0
    );

    ctx.stroke();


    /* پای راست */

    ctx.beginPath();

    ctx.moveTo(
        0,
        -40
    );

    ctx.lineTo(
        20 - walking * 12,
        0
    );

    ctx.stroke();


    ctx.restore();

}


/* =========================
   رسم دنیا
========================= */

function draw(){

    drawSky();

    drawGround();


    /* درخت‌ها */

    for(
        let x = 100;
        x < WORLD_WIDTH;
        x += 350
    ){

        drawTree(x);

    }


    /* بازیکنان دیگر */

    for(
        const id in others
    ){

        const p =
            others[id];

        p.frame++;

        drawStickman(p);

    }


    /* خودمان */

    drawStickman(me);

}


/* =========================
   بازی
========================= */

function gameLoop(){

    updatePlayer();

    updateCamera();

    sendPosition();

    draw();

    requestAnimationFrame(
        gameLoop
    );

}


gameLoop();

</script>

</body>

</html>
