<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Stickman Forest</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#75d7ff;
    font-family:Arial,sans-serif;
    touch-action:none;
}

canvas{
    display:block;
    width:100vw;
    height:100vh;
}

#adminButton{
    display:none;
    position:fixed;
    top:15px;
    right:15px;
    z-index:20;
    padding:12px 18px;
    border:0;
    border-radius:14px;
    background:#7c3aed;
    color:white;
    font-size:16px;
    font-weight:bold;
}

#adminPanel{
    display:none;
    position:fixed;
    top:65px;
    right:15px;
    width:280px;
    max-width:calc(100vw - 30px);
    z-index:19;
    padding:18px;
    border-radius:18px;
    background:#18181b;
    color:white;
    text-align:center;
    box-shadow:0 10px 35px #0008;
}

.adminBtn{
    width:100%;
    padding:12px;
    margin:5px 0;
    border:0;
    border-radius:10px;
    background:#333;
    color:white;
    font-size:15px;
}

.close{
    background:#b91c1c;
}

.controls{
    position:fixed;
    bottom:20px;
    left:0;
    right:0;
    display:flex;
    justify-content:space-between;
    padding:0 20px;
    z-index:10;
}

.control{
    width:65px;
    height:65px;
    border:0;
    border-radius:18px;
    background:#222b;
    color:white;
    font-size:28px;
}

</style>
</head>

<body>

<canvas id="game"></canvas>

<button id="adminButton">⚡ ADMIN</button>

<div id="adminPanel">

    <h2>⚡ ADMIN PANEL</h2>

    <p id="adminName"></p>

    <button class="adminBtn" onclick="adminMessage()">
        📢 پیام
    </button>

    <button class="adminBtn" onclick="changeSpeed()">
        🏃 تغییر سرعت
    </button>

    <button class="adminBtn" onclick="giveCoins()">
        🪙 دادن سکه
    </button>

    <button class="adminBtn" onclick="teleport()">
        📍 تلپورت
    </button>

    <button class="adminBtn" onclick="nightMode()">
        🌙 شب
    </button>

    <button class="adminBtn close" onclick="closeAdmin()">
        ❌ بستن
    </button>

</div>

<div class="controls">

    <button class="control" id="left">⬅️</button>

    <button class="control" id="right">➡️</button>

</div>


<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = window.innerWidth;
let H = window.innerHeight;

function resize(){

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W;
    canvas.height = H;

}

resize();

window.addEventListener("resize",resize);


/* اسم ادمین */

const PLAYER_NAME = "tahagamertnt";

const ADMIN_NAME = "tahagamertnt";


/* بازیکن */

let player = {

    x: W / 2,

    y: H - 180,

    speed: 6,

    walk: 0,

    coins: 0

};


/* کیبورد */

let keys = {};

document.addEventListener("keydown",function(e){

    keys[e.key] = true;

});

document.addEventListener("keyup",function(e){

    keys[e.key] = false;

});


/* گوشی */

let left = false;
let right = false;

const leftButton =
    document.getElementById("left");

const rightButton =
    document.getElementById("right");


function startLeft(e){

    e.preventDefault();
    left = true;

}

function stopLeft(e){

    e.preventDefault();
    left = false;

}

function startRight(e){

    e.preventDefault();
    right = true;

}

function stopRight(e){

    e.preventDefault();
    right = false;

}


leftButton.addEventListener(
    "touchstart",
    startLeft,
    {passive:false}
);

leftButton.addEventListener(
    "touchend",
    stopLeft,
    {passive:false}
);

leftButton.addEventListener(
    "touchcancel",
    stopLeft
);


rightButton.addEventListener(
    "touchstart",
    startRight,
    {passive:false}
);

rightButton.addEventListener(
    "touchend",
    stopRight,
    {passive:false}
);

rightButton.addEventListener(
    "touchcancel",
    stopRight
);


/* حرکت */

function update(){

    let moving = false;


    if(
        keys["a"] ||
        keys["A"] ||
        keys["ش"] ||
        left
    ){

        player.x -= player.speed;

        player.walk += 0.35;

        moving = true;

    }


    if(
        keys["d"] ||
        keys["D"] ||
        keys["ی"] ||
        right
    ){

        player.x += player.speed;

        player.walk += 0.35;

        moving = true;

    }


    if(!moving){

        player.walk *= 0.8;

    }


    if(player.x < 50){

        player.x = 50;

    }


    if(player.x > W - 50){

        player.x = W - 50;

    }


    player.y = H - 180;

}


/* جنگل */

function drawForest(){

    let sky =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );

    sky.addColorStop(
        0,
        "#69cfff"
    );

    sky.addColorStop(
        1,
        "#d8f7ff"
    );

    ctx.fillStyle = sky;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* خورشید */

    ctx.fillStyle = "#ffd83d";

    ctx.beginPath();

    ctx.arc(
        90,
        80,
        42,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* زمین */

    ctx.fillStyle = "#3fa447";

    ctx.fillRect(
        0,
        H - 100,
        W,
        100
    );


    ctx.fillStyle = "#268631";

    ctx.fillRect(
        0,
        H - 100,
        W,
        12
    );


    /* درخت‌ها */

    for(
        let x = -50;
        x < W + 200;
        x += 230
    ){

        drawTree(
            x,
            H - 270
        );

    }

}


/* درخت */

function drawTree(x,y){

    ctx.fillStyle = "#704214";

    ctx.fillRect(
        x,
        y,
        45,
        170
    );


    ctx.fillStyle = "#238b35";

    ctx.beginPath();

    ctx.arc(
        x + 22,
        y - 20,
        75,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        x - 25,
        y + 20,
        50,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        x + 70,
        y + 20,
        50,
        0,
        Math.PI * 2
    );

    ctx.fill();

}


/* استیکمن */

function drawPlayer(){

    let x = player.x;
    let y = player.y;

    let move =
        Math.sin(player.walk) * 25;


    ctx.strokeStyle = "#111";
    ctx.lineWidth = 7;
    ctx.lineCap = "round";


    /* اسم */

    ctx.fillStyle = "#111";

    ctx.font = "bold 23px Arial";

    ctx.textAlign = "center";

    ctx.fillText(
        PLAYER_NAME,
        x,
        y - 175
    );


    /* سر */

    ctx.beginPath();

    ctx.arc(
        x,
        y - 115,
        28,
        0,
        Math.PI * 2
    );

    ctx.stroke();


    /* بدن */

    ctx.beginPath();

    ctx.moveTo(
        x,
        y - 87
    );

    ctx.lineTo(
        x,
        y
    );

    ctx.stroke();


    /* دست چپ */

    ctx.beginPath();

    ctx.moveTo(
        x,
        y - 60
    );

    ctx.lineTo(
        x - 50,
        y - 25 + move
    );

    ctx.stroke();


    /* دست راست */

    ctx.beginPath();

    ctx.moveTo(
        x,
        y - 60
    );

    ctx.lineTo(
        x + 50,
        y - 25 - move
    );

    ctx.stroke();


    /* پای چپ */

    ctx.beginPath();

    ctx.moveTo(
        x,
        y
    );

    ctx.lineTo(
        x - 30,
        y + 70 + move
    );

    ctx.stroke();


    /* پای راست */

    ctx.beginPath();

    ctx.moveTo(
        x,
        y
    );

    ctx.lineTo(
        x + 30,
        y + 70 - move
    );

    ctx.stroke();


    ctx.textAlign = "left";

}


/* =========================
   ADMIN
========================= */

const adminButton =
    document.getElementById("adminButton");

const adminPanel =
    document.getElementById("adminPanel");

const adminName =
    document.getElementById("adminName");


/* مستقیم بررسی می‌کنیم */

if(PLAYER_NAME === ADMIN_NAME){

    adminButton.style.display =
        "block";

    adminName.textContent =
        "👑 tahagamertnt";

}


adminButton.onclick = function(){

    adminPanel.style.display =
        "block";

};


function closeAdmin(){

    adminPanel.style.display =
        "none";

}


function adminMessage(){

    let msg =
        prompt("📢 پیام ادمین:");

    if(msg){

        alert(
            "📢 ADMIN:\n\n" +
            msg
        );

    }

}


function changeSpeed(){

    let value =
        prompt(
            "🏃 سرعت جدید:",
            player.speed
        );

    if(value !== null){

        let number =
            Number(value);

        if(
            number > 0 &&
            number <= 50
        ){

            player.speed =
                number;

            alert(
                "سرعت شد: " +
                number
            );

        }

    }

}


function giveCoins(){

    player.coins += 100;

    alert(
        "🪙 +100 Coins\n\n" +
        "Coins: " +
        player.coins
    );

}


function teleport(){

    player.x =
        W / 2;

    alert(
        "📍 تلپورت شدی!"
    );

}


let night = false;


function nightMode(){

    night = !night;

}


/* حلقه بازی */

function gameLoop(){

    update();

    drawForest();

    if(night){

        ctx.fillStyle =
            "rgba(10,20,60,.6)";

        ctx.fillRect(
            0,
            0,
            W,
            H
        );

    }

    drawPlayer();

    requestAnimationFrame(
        gameLoop
    );

}


gameLoop();

</script>

</body>
</html>
