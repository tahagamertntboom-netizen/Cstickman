<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no,
viewport-fit=cover">

<title>Stickman Forest</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    position:fixed;
    inset:0;
    background:#75d7ff;
    touch-action:none;
    overscroll-behavior:none;
}

body{
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
    width:100vw;
    height:100vh;
    touch-action:none;
}


/* =========================
   کنترل موبایل
========================= */

.controls{
    position:fixed;
    left:0;
    right:0;
    bottom:max(18px,env(safe-area-inset-bottom));
    display:flex;
    justify-content:flex-start;
    padding-left:20px;
    z-index:50;
    pointer-events:none;
}

.control-group{
    display:flex;
    gap:12px;
    pointer-events:auto;
}

.control{
    width:68px;
    height:68px;
    border:0;
    border-radius:20px;
    background:rgba(20,20,20,.65);
    color:white;
    font-size:28px;

    touch-action:none;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
}

.control:active{
    transform:scale(.94);
}


/* =========================
   ADMIN
========================= */

#adminButton{
    display:none;

    position:fixed;

    top:max(15px,env(safe-area-inset-top));
    right:15px;

    z-index:100;

    padding:12px 18px;

    border:0;
    border-radius:14px;

    background:#7c3aed;
    color:white;

    font-size:16px;
    font-weight:bold;

    touch-action:manipulation;
}

#adminPanel{
    display:none;

    position:fixed;

    top:70px;
    right:15px;

    width:280px;
    max-width:calc(100vw - 30px);

    z-index:90;

    padding:18px;

    border-radius:18px;

    background:rgba(20,20,25,.96);
    color:white;

    text-align:center;

    box-shadow:0 10px 35px #0008;
}

.adminBtn{
    width:100%;

    padding:12px;
    margin:5px 0;

    border:0;
    border-radius:10px;

    background:#333;

    color:white;

    font-size:15px;

    touch-action:manipulation;
}

.close{
    background:#b91c1c;
}


/* =========================
   موبایل
========================= */

@media(max-width:700px){

    .control{
        width:64px;
        height:64px;
        font-size:27px;
    }

    #adminButton{
        font-size:14px;
        padding:10px 14px;
    }

}


/* =========================
   کامپیوتر
========================= */

@media(min-width:701px){

    .controls{
        display:none;
    }

}

</style>
</head>


<body>

<canvas id="game"></canvas>


<button id="adminButton">
⚡ ADMIN
</button>


<div id="adminPanel">

    <h2>⚡ ADMIN PANEL</h2>

    <p id="adminName"></p>

    <button class="adminBtn" onclick="adminMessage()">
        📢 پیام
    </button>

    <button class="adminBtn" onclick="changeSpeed()">
        🏃 تغییر سرعت
    </button>

    <button class="adminBtn" onclick="giveCoins()">
        🪙 دادن سکه
    </button>

    <button class="adminBtn" onclick="teleport()">
        📍 تلپورت
    </button>

    <button class="adminBtn" onclick="nightMode()">
        🌙 شب
    </button>

    <button class="adminBtn close" onclick="closeAdmin()">
        ❌ بستن
    </button>

</div>


<div class="controls">

    <div class="control-group">

        <button
            class="control"
            id="left"
            type="button">
            ⬅️
        </button>

        <button
            class="control"
            id="right"
            type="button">
            ➡️
        </button>

    </div>

</div>


<script src="/game.js"></script>

</body>
</html>
