<!DOCTYPE html>
<html>
<head>
<title>Stickman Forest</title>
<style>
body{
margin:0;
overflow:hidden;
}
canvas{
display:block;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

canvas.width=900;
canvas.height=500;


let player={
x:450,
y:330,
name:"Taha",
speed:5,
walk:0
};


let keys={};


document.addEventListener("keydown",e=>{
keys[e.key]=true;
});


document.addEventListener("keyup",e=>{
keys[e.key]=false;
});


let trees=[
{x:100},
{x:300},
{x:650},
{x:800}
];


function update(){

if(keys["a"] || keys["A"] || keys["ش"]){
player.x-=player.speed;
player.walk+=0.4;
}


if(keys["d"] || keys["D"] || keys["ی"]){
player.x+=player.speed;
player.walk+=0.4;
}

}



function forest(){

ctx.fillStyle="#87ceeb";
ctx.fillRect(0,0,900,500);


// خورشید
ctx.fillStyle="yellow";
ctx.beginPath();
ctx.arc(100,80,40,0,Math.PI*2);
ctx.fill();


// زمین
ctx.fillStyle="#3c9b42";
ctx.fillRect(0,400,900,100);


// درخت‌ها
trees.forEach(t=>{

ctx.fillStyle="#6b3b18";
ctx.fillRect(t.x,260,40,140);


ctx.fillStyle="green";
ctx.beginPath();
ctx.arc(t.x+20,220,80,0,Math.PI*2);
ctx.fill();

});

}



function stickman(){

let x=player.x;
let y=player.y;

let move=Math.sin(player.walk)*25;


ctx.strokeStyle="black";
ctx.fillStyle="black";
ctx.lineWidth=6;


// اسم

ctx.font="22px Arial";
ctx.fillText(player.name,x-35,y-120);


// سر

ctx.beginPath();
ctx.arc(x,y-90,25,0,Math.PI*2);
ctx.stroke();


// بدن

ctx.beginPath();
ctx.moveTo(x,y-65);
ctx.lineTo(x,y+20);
ctx.stroke();


// دست راست و چپ متحرک

ctx.beginPath();

ctx.moveTo(x,y-40);
ctx.lineTo(x-40,y+move);

ctx.moveTo(x,y-40);
ctx.lineTo(x+40,y-move);

ctx.stroke();


// پاها

ctx.beginPath();

ctx.moveTo(x,y+20);
ctx.lineTo(x-25,y+80+move);

ctx.moveTo(x,y+20);
ctx.lineTo(x+25,y+80-move);

ctx.stroke();

}



function loop(){

update();

forest();

stickman();

requestAnimationFrame(loop);

}


loop();

</script>

</body>
</html>
