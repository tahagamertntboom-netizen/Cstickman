<!DOCTYPE html>
<html lang="fa">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>Stickman Game</title>

<style>

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Arial;
    background:#55cfff;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

#hud{
    position:fixed;
    top:10px;
    left:10px;

    z-index:10;

    color:white;

    background:#000b;

    padding:12px 15px;

    border-radius:13px;

    line-height:1.8;
}

#admin{
    display:none;
    color:#ffd700;
    font-weight:bold;
}

#online{
    position:fixed;
    top:10px;
    right:10px;

    z-index:10;

    color:white;

    background:#000b;

    padding:10px;

    border-radius:13px;
}

#controls{
    position:fixed;

    bottom:20px;

    left:20px;
    right:20px;

    z-index:20;

    display:flex;

    justify-content:space-between;

    direction:ltr;
}

.group{
    display:flex;
    gap:10px;
}

.control{
    width:68px;
    height:68px;

    border-radius:50%;

    border:2px solid white;

    color:white;

    background:#000b;

    font-size:26px;

    touch-action:none;
}

#run{
    background:#2563eb;
}

#jump{
    background:#f59e0b;
}

</style>

</head>

<body>

<canvas id="game"></canvas>


<div id="hud">

👤 <span id="playerName"></span>

<br>

🏠 اتاق:
<span id="room"></span>

<br>

❤️ جان:
<span id="health">100</span>

<div id="admin">
👑 ADMIN
</div>

</div>


<div id="online">

👥 آنلاین

<div id="onlineList"></div>

</div>


<div id="controls">

<div class="group">

<button
class="control"
id="left"
>
◀
</button>

<button
class="control"
id="right"
>
▶
</button>

<button
class="control"
id="run"
>
🏃
</button>

</div>

<button
class="control"
id="jump"
>
⬆
</button>

</div>


<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();


/* اطلاعات */

const playerName =
localStorage.getItem("player")
|| "Player";

const room =
localStorage.getItem("room")
|| "------";


document.getElementById(
    "playerName"
).textContent =
    playerName;

document.getElementById(
    "room"
).textContent =
    room;


if(
    playerName.toLowerCase()
    === "tahagamertnt"
){
    document.getElementById(
        "admin"
    ).style.display =
        "block";
}


/* Canvas */

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");


function resize(){

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

}

resize();

window.addEventListener(
    "resize",
    resize
);


/* بازیکن */

const me = {

    x:500,
    y:0,

    vx:0,
    vy:0,

    direction:1,

    walking:false,
    running:false,
    jumping:false,

    frame:0,

    health:100
};


const others = {};


/* کنترل */

const keys = {
    left:false,
    right:false,
    run:false,
    jump:false
};


/* کیبورد */

window.addEventListener(
    "keydown",
    e => {

        if(
            e.key === "ArrowLeft" ||
            e.key.toLowerCase() === "a"
        ){
            keys.left = true;
        }

        if(
            e.key === "ArrowRight" ||
            e.key.toLowerCase() === "d"
        ){
            keys.right = true;
        }

        if(e.key === "Shift"){
            keys.run = true;
        }

        if(e.code === "Space"){

            e.preventDefault();

            keys.jump = true;
        }

    }
);


window.addEventListener(
    "keyup",
    e => {

        if(
            e.key === "ArrowLeft" ||
            e.key.toLowerCase() === "a"
        ){
            keys.left = false;
        }

        if(
            e.key === "ArrowRight" ||
            e.key.toLowerCase() === "d"
        ){
            keys.right = false;
        }

        if(e.key === "Shift"){
            keys.run = false;
        }

        if(e.code === "Space"){
            keys.jump = false;
        }

    }
);


/* دکمه‌های موبایل */

function mobileButton(
    id,
    key
){

    const button =
        document.getElementById(id);

    button.addEventListener(
        "pointerdown",
        e => {

            e.preventDefault();

            keys[key] = true;

        }
    );

    button.addEventListener(
        "pointerup",
        e => {

            e.preventDefault();

            keys[key] = false;

        }
    );

    button.addEventListener(
        "pointercancel",
        () => {
            keys[key] = false;
        }
    );

}

mobileButton("left","left");
mobileButton("right","right");
mobileButton("run","run");
mobileButton("jump","jump");


/* بازیکنان */

socket.on(
    "players",
    list => {

        list.forEach(
            p => {

                if(
                    p.id === socket.id
                ){
                    return;
                }

                others[p.id] = {
                    ...p,
                    frame:0
                };

            }
        );

        updateOnline();

    }
);


socket.on(
    "playerMove",
    p => {

        if(
            p.id === socket.id
        ){
            return;
        }

        if(!others[p.id]){

            others[p.id] = {
                ...p,
                frame:0
            };

        }
        else{

            Object.assign(
                others[p.id],
                p
            );

        }

    }
);


socket.on(
    "playerLeft",
    id => {

        delete others[id];

        updateOnline();

    }
);


/* لیست */

function updateOnline(){

    const box =
        document.getElementById(
            "onlineList"
        );

    box.innerHTML =
        "👤 " + playerName;

    Object.values(
        others
    ).forEach(
        p => {

            box.innerHTML +=
                "<br>👤 " +
                p.name;

        }
    );

}


/* فیزیک */

function update(){

    const speed =
        keys.run ? 8 : 4;

    me.walking = false;
    me.running = false;


    if(keys.left){

        me.vx = -speed;
        me.direction = -1;
        me.walking = true;

    }
    else if(keys.right){

        me.vx = speed;
        me.direction = 1;
        me.walking = true;

    }
    else{

        me.vx *= 0.75;

        if(
            Math.abs(me.vx) < 0.1
        ){
            me.vx = 0;
        }

    }


    if(
        keys.run &&
        me.walking
    ){
        me.running = true;
    }


    me.x += me.vx;


    /* پرش */

    if(
        keys.jump &&
        !me.jumping
    ){

        me.vy = -14;

        me.jumping = true;

    }


    me.vy += 0.7;

    me.y += me.vy;


    if(me.y >= 0){

        me.y = 0;

        me.vy = 0;

        me.jumping = false;

    }


    if(me.x < 30)
        me.x = 30;

    if(me.x > 5970)
        me.x = 5970;


    me.frame++;

}


/* ارسال حرکت */

let lastSend = 0;

function sendMove(){

    const now =
        Date.now();

    if(
        now - lastSend < 40
    ){
        return;
    }

    lastSend = now;

    socket.emit(
        "move",
        {
            x:me.x,
            y:me.y,
            direction:me.direction,
            walking:me.walking,
            running:me.running,
            jumping:me.jumping
        }
    );

}


/* دوربین */

function getCamera(){

    let camera =
        me.x -
        canvas.width / 2;

    if(camera < 0)
        camera = 0;

    const max =
        6000 -
        canvas.width;

    if(camera > max)
        camera = Math.max(0,max);

    return camera;

}


/* آسمان */

function drawSky(){

    ctx.fillStyle =
        "#55cfff";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* خورشید */

    ctx.fillStyle =
        "#ffe066";

    ctx.beginPath();

    ctx.arc(
        canvas.width - 100,
        90,
        45,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* ابر */

    for(
        let x=-100;
        x<canvas.width+500;
        x+=350
    ){

        ctx.fillStyle =
            "rgba(255,255,255,.9)";

        ctx.beginPath();

        ctx.arc(
            x,
            120,
            30,
            0,
            Math.PI*2
        );

        ctx.arc(
            x+40,
            105,
            40,
            0,
            Math.PI*2
        );

        ctx.arc(
            x+85,
            120,
            30,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

}


/* زمین */

function drawGround(){

    ctx.fillStyle =
        "#22c55e";

    ctx.fillRect(
        0,
        500,
        canvas.width,
        canvas.height
    );


    ctx.fillStyle =
        "#15803d";

    ctx.fillRect(
        0,
        500,
        canvas.width,
        12
    );


    /* جاده */

    ctx.fillStyle =
        "#64748b";

    ctx.fillRect(
        0,
        555,
        canvas.width,
        80
    );

}


/* استیکمن */

function drawStickman(
    p,
    x,
    y
){

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.scale(
        p.direction || 1,
        1
    );


    const animation =
        p.walking
        ? Math.sin(
            (p.frame || 0) * 0.35
        ) * 14
        : 0;


    /* اسم */

    ctx.font =
        "bold 17px Arial";

    ctx.textAlign =
        "center";

    ctx.lineWidth = 4;

    ctx.strokeStyle =
        "#000";

    ctx.fillStyle =
        "#fff";

    ctx.strokeText(
        p.name,
        0,
        -130
    );

    ctx.fillText(
        p.name,
        0,
        -130
    );


    /* تاج ادمین */

    if(
        p.name.toLowerCase()
        === "tahagamertnt"
    ){

        ctx.font =
            "22px Arial";

        ctx.fillStyle =
            "#ffd700";

        ctx.fillText(
            "👑",
            0,
            -153
        );

    }


    /* بدن */

    ctx.strokeStyle =
        "#111";

    ctx.lineWidth = 7;

    ctx.lineCap =
        "round";


    /* سر */

    ctx.fillStyle =
        "#fff";

    ctx.beginPath();

    ctx.arc(
        0,
        -95,
        22,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.stroke();


    /* چشم */

    ctx.fillStyle =
        "#111";

    ctx.beginPath();

    ctx.arc(
        7,
        -99,
        3,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* بدن */

    ctx.beginPath();

    ctx.moveTo(
        0,
        -73
    );

    ctx.lineTo(
        0,
        -25
    );

    ctx.stroke();


    /* دست اول */

    ctx.beginPath();

    ctx.moveTo(
        0,
        -60
    );

    ctx.lineTo(
        -32,
        -30 + animation
    );

    ctx.stroke();


    /* دست دوم */

    ctx.beginPath();

    ctx.moveTo(
        0,
        -60
    );

    ctx.lineTo(
        32,
        -30 - animation
    );

    ctx.stroke();


    /* پا اول */

    ctx.beginPath();

    ctx.moveTo(
        0,
        -25
    );

    ctx.lineTo(
        -20 + animation,
        22
    );

    ctx.stroke();


    /* پا دوم */

    ctx.beginPath();

    ctx.moveTo(
        0,
        -25
    );

    ctx.lineTo(
        20 - animation,
        22
    );

    ctx.stroke();


    ctx.restore();

}


/* رسم */

function draw(){

    drawSky();

    drawGround();

    const camera =
        getCamera();


    /* دوستان */

    Object.values(
        others
    ).forEach(
        p => {

            p.frame =
                (p.frame || 0) + 1;

            drawStickman(
                p,
                p.x - camera,
                500 + p.y
            );

        }
    );


    /* خودم */

    drawStickman(
        me,
        canvas.width / 2,
        500 + me.y
    );


    document.getElementById(
        "health"
    ).textContent =
        me.health;

}


/* حلقه بازی */

function loop(){

    update();

    sendMove();

    draw();

    requestAnimationFrame(loop);

}

loop();

</script>

</body>

</html>
