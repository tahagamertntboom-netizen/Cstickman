<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stickman Game</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#7dd3fc;
}

#game{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}


/* =========================
   اطلاعات
========================= */

#info{
    position:fixed;
    top:15px;
    left:15px;
    z-index:20;

    padding:10px 15px;

    border-radius:12px;

    background:rgba(0,0,0,.65);

    color:white;

    font-size:16px;
}


/* =========================
   دکمه ادمین
========================= */

#adminButton{

    display:none;

    position:fixed;

    top:15px;
    right:15px;

    z-index:100;

    border:0;

    border-radius:12px;

    padding:13px 20px;

    background:#dc2626;

    color:white;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:0 5px 20px #0007;
}

#adminButton:active{
    transform:scale(.95);
}


/* =========================
   صفحه ادمین
========================= */

#adminOverlay{

    display:none;

    position:fixed;

    inset:0;

    z-index:200;

    background:rgba(0,0,0,.72);

    align-items:center;

    justify-content:center;

    padding:20px;
}


/* پنل اصلی */

#adminPanel{

    width:min(650px,95vw);

    max-height:90vh;

    overflow:auto;

    background:#111827;

    color:white;

    border-radius:25px;

    padding:25px;

    box-shadow:
        0 20px 80px #000;

}


/* عنوان */

.adminHeader{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:20px;

}

.adminTitle{

    font-size:28px;

    font-weight:bold;

}

#closeAdmin{

    border:0;

    width:45px;

    height:45px;

    border-radius:50%;

    background:#374151;

    color:white;

    font-size:22px;

    cursor:pointer;

}


/* =========================
   بازیکنان
========================= */

.section{

    margin-top:18px;

    padding:18px;

    background:#1f2937;

    border-radius:18px;

}

.sectionTitle{

    font-size:19px;

    font-weight:bold;

    margin-bottom:12px;

}

#playerList{

    display:grid;

    grid-template-columns:
        repeat(auto-fit,minmax(150px,1fr));

    gap:10px;

}

.playerButton{

    border:0;

    border-radius:12px;

    padding:12px;

    background:#374151;

    color:white;

    cursor:pointer;

    font-size:15px;

}

.playerButton.selected{

    outline:3px solid #facc15;

    background:#4b5563;

}


/* =========================
   قابلیت‌ها
========================= */

.actions{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:12px;

}

.actionButton{

    border:0;

    min-height:65px;

    border-radius:15px;

    color:white;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

}

.actionButton:active{

    transform:scale(.97);

}


.fly{
    background:#7c3aed;
}

.color{
    background:#db2777;
}

.kill{
    background:#dc2626;
}

.kick{
    background:#ea580c;
}

.allColor{
    background:#0891b2;
}


/* =========================
   وضعیت
========================= */

#adminStatus{

    margin-top:15px;

    padding:12px;

    border-radius:12px;

    background:#0f172a;

    color:#cbd5e1;

    text-align:center;

}


/* =========================
   کنترل‌ها
========================= */

#controls{

    position:fixed;

    left:0;
    right:0;
    bottom:20px;

    z-index:50;

    display:flex;

    justify-content:space-between;

    padding:0 20px;

    pointer-events:none;
}

.controlGroup{

    display:flex;

    gap:12px;

    pointer-events:auto;
}

.control{

    width:70px;
    height:70px;

    border:0;

    border-radius:50%;

    background:rgba(15,23,42,.8);

    color:white;

    font-size:28px;

    font-weight:bold;

    cursor:pointer;

    touch-action:none;

}

</style>
</head>


<body>


<!-- =========================
     بازی
========================= -->

<canvas id="game"></canvas>


<!-- اطلاعات -->

<div id="info">
    🎮 Player
</div>


<!-- =========================
     دکمه ADMIN
========================= -->

<button
    id="adminButton"
    type="button"
>
    👑 ADMIN
</button>


<!-- =========================
     صفحه ADMIN
========================= -->

<div id="adminOverlay">

    <div id="adminPanel">

        <div class="adminHeader">

            <div class="adminTitle">
                👑 پنل مدیریت
            </div>

            <button
                id="closeAdmin"
                type="button"
            >
                ✕
            </button>

        </div>


        <!-- بازیکنان -->

        <div class="section">

            <div class="sectionTitle">
                👥 انتخاب بازیکن
            </div>

            <div id="playerList">
                بازیکنی پیدا نشد
            </div>

        </div>


        <!-- قابلیت‌ها -->

        <div class="section">

            <div class="sectionTitle">
                ⚡ قابلیت‌های بازیکن
            </div>

            <div class="actions">

                <button
                    id="flyButton"
                    class="actionButton fly"
                    type="button"
                >
                    ✈️ پرواز
                </button>

                <button
                    id="colorButton"
                    class="actionButton color"
                    type="button"
                >
                    🌈 رنگی شدن
                </button>

                <button
                    id="killButton"
                    class="actionButton kill"
                    type="button"
                >
                    💀 کشتن
                </button>

                <button
                    id="kickButton"
                    class="actionButton kick"
                    type="button"
                >
                    🚪 بیرون انداختن
                </button>

            </div>

        </div>


        <!-- همه بازیکنان -->

        <div class="section">

            <div class="sectionTitle">
                👥 همه بازیکنان
            </div>

            <button
                id="allColorButton"
                class="actionButton allColor"
                type="button"
                style="width:100%;"
            >
                🌈 رنگی کردن همه
            </button>

        </div>


        <div id="adminStatus">
            بازیکنی انتخاب نشده
        </div>

    </div>

</div>


<!-- =========================
     کنترل بازی
========================= -->

<div id="controls">

    <div class="controlGroup">

        <button
            id="left"
            class="control"
            type="button"
        >
            ◀
        </button>

        <button
            id="right"
            class="control"
            type="button"
        >
            ▶
        </button>

    </div>


    <div class="controlGroup">

        <button
            id="jump"
            class="control"
            type="button"
        >
            ⬆
        </button>

    </div>

</div>


<!-- Socket.IO -->

<script src="/socket.io/socket.io.js"></script>

<!-- بازی -->

<script src="/game.js"></script>


<script>

const socket = io();


/* =========================
   اسم
========================= */

const storedName =
    localStorage.getItem("player");

const playerName =
    String(storedName || "")
        .trim();

const safeName =
    playerName ||
    "Player";


document.getElementById(
    "info"
).textContent =
    "🎮 " + safeName;


/* =========================
   تشخیص ادمین
========================= */

const isAdmin =
    safeName.toLowerCase() ===
    "tahagamertnt";


const adminButton =
    document.getElementById(
        "adminButton"
    );

const overlay =
    document.getElementById(
        "adminOverlay"
    );

const closeButton =
    document.getElementById(
        "closeAdmin"
    );


if(isAdmin){

    adminButton.style.display =
        "block";

}


/* =========================
   باز کردن پنل
========================= */

adminButton.onclick =
function(){

    if(!isAdmin)
        return;

    overlay.style.display =
        "flex";

};


/* =========================
   بستن پنل
========================= */

closeButton.onclick =
function(){

    overlay.style.display =
        "none";

};


overlay.addEventListener(
    "click",
    function(e){

        if(e.target === overlay){

            overlay.style.display =
                "none";

        }

    }
);


/* =========================
   بازیکن انتخاب شده
========================= */

let selectedPlayer = null;


function selectPlayer(
    id,
    name
){

    selectedPlayer =
        id;

    document.querySelectorAll(
        ".playerButton"
    ).forEach(
        button => {

            button.classList.remove(
                "selected"
            );

        }
    );


    const button =
        document.querySelector(
            `[data-id="${id}"]`
        );


    if(button){

        button.classList.add(
            "selected"
        );

    }


    document.getElementById(
        "adminStatus"
    ).textContent =
        "🎯 انتخاب شد: " +
        name;

}


/* =========================
   لیست بازیکنان
========================= */

socket.on(
    "players",
    function(players){

        if(!isAdmin)
            return;

        const list =
            document.getElementById(
                "playerList"
            );

        list.innerHTML = "";


        if(
            !Array.isArray(players) ||
            players.length === 0
        ){

            list.textContent =
                "بازیکنی نیست";

            return;

        }


        players.forEach(
            player => {

                if(
                    !player ||
                    player.id === socket.id
                )
                    return;


                const button =
                    document.createElement(
                        "button"
                    );


                button.className =
                    "playerButton";


                button.dataset.id =
                    player.id;


                const name =
                    player.name ||
                    "Player";


                button.textContent =
                    "👤 " + name;


                button.onclick =
                    function(){

                        selectPlayer(
                            player.id,
                            name
                        );

                    };


                list.appendChild(
                    button
                );

            }
        );

    }
);


/* =========================
   ارسال دستور
========================= */

function sendAdminAction(
    action
){

    if(!isAdmin)
        return;


    if(!selectedPlayer){

        document.getElementById(
            "adminStatus"
        ).textContent =
            "⚠️ اول یک بازیکن را انتخاب کن";

        return;

    }


    socket.emit(
        "adminAction",
        {
            action:
                action,

            targetId:
                selectedPlayer
        }
    );


    document.getElementById(
        "adminStatus"
    ).textContent =
        "✅ دستور ارسال شد";

}


/* =========================
   دکمه‌ها
========================= */

document.getElementById(
    "flyButton"
).onclick =
function(){

    sendAdminAction(
        "fly"
    );

};


document.getElementById(
    "colorButton"
).onclick =
function(){

    sendAdminAction(
        "color"
    );

};


document.getElementById(
    "killButton"
).onclick =
function(){

    sendAdminAction(
        "kill"
    );

};


document.getElementById(
    "kickButton"
).onclick =
function(){

    sendAdminAction(
        "kick"
    );

};


document.getElementById(
    "allColorButton"
).onclick =
function(){

    if(!isAdmin)
        return;

    socket.emit(
        "adminAction",
        {
            action:
                "allColor"
        }
    );


    document.getElementById(
        "adminStatus"
    ).textContent =
        "🌈 برای همه فعال شد";

};

</script>

</body>
</html>
