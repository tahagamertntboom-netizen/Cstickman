<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Test</title>
</head>

<body>

<input id="name" placeholder="اسم">

<button
type="button"
id="testButton">
تأیید
</button>

<div id="result"></div>

<script>

document
.getElementById("testButton")
.addEventListener("click", function(event){

    event.preventDefault();

    document
    .getElementById("result")
    .textContent =
    "دکمه کار کرد ✅";

});

</script>

</body>
</html>
