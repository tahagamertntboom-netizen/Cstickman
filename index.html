<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stickman</title>

<style>
body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#172554;
    font-family:Arial;
    color:white;
}

.box{
    width:90%;
    max-width:400px;
    padding:30px;
    background:#111827;
    border-radius:20px;
    text-align:center;
}

input,button{
    width:100%;
    padding:15px;
    margin-top:12px;
    border:0;
    border-radius:12px;
    font-size:18px;
    box-sizing:border-box;
}

button{
    background:#22c55e;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

#lobby{
    display:none;
}

#error{
    color:#f87171;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="box">

<div id="namePage">

<h1>🎮 STICKMAN</h1>

<input
    id="name"
    placeholder="اسم بازیکن"
    maxlength="20"
>

<button id="confirm">
    ✅ تأیید اسم
</button>

<div id="error"></div>

</div>


<div id="lobby">

<h2>
سلام <span id="showName"></span> 👋
</h2>

<button id="create">
🏠 ساخت اتاق
</button>

<input
    id="code"
    placeholder="کد ۶ رقمی"
    maxlength="6"
    inputmode="numeric"
>

<button id="join">
🚪 ورود به اتاق
</button>

<div id="room"></div>

</div>

</div>


<script>

const namePage =
document.getElementById("namePage");

const lobby =
document.getElementById("lobby");

const nameInput =
document.getElementById("name");

const confirmButton =
document.getElementById("confirm");

const error =
document.getElementById("error");

const showName =
document.getElementById("showName");


confirmButton.addEventListener(
    "click",
    function(){

        const name =
            nameInput.value.trim();

        if(name === ""){

            error.textContent =
                "اول اسمت را بنویس!";

            return;
        }

        localStorage.setItem(
            "player",
            name
        );

        showName.textContent =
            name;

        namePage.style.display =
            "none";

        lobby.style.display =
            "block";

    }
);


/* تست دکمه ساخت */

document.getElementById(
    "create"
).addEventListener(
    "click",
    function(){

        const code =
            Math.floor(
                100000 +
                Math.random() * 900000
            );

        document.getElementById(
            "room"
        ).textContent =
            "کد اتاق شما: " + code;

    }
);


/* تست ورود */

document.getElementById(
    "join"
).addEventListener(
    "click",
    function(){

        const code =
            document.getElementById(
                "code"
            ).value.trim();

        if(!/^\d{6}$/.test(code)){

            document.getElementById(
                "room"
            ).textContent =
                "❌ کد باید ۶ رقمی باشد!";

            return;
        }

        document.getElementById(
            "room"
        ).textContent =
            "✅ کد " +
            code +
            " دریافت شد!";

    }
);

</script>

</body>
</html>
