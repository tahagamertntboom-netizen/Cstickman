<!DOCTYPE html>
<html lang="fa">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Stickman Lobby</title>

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

    font-family:Arial,sans-serif;

    background:
    linear-gradient(
        135deg,
        #0f172a,
        #172554,
        #312e81
    );

    color:white;
}

.container{

    width:100%;

    max-width:450px;

    padding:30px;

    border-radius:25px;

    background:
    rgba(15,23,42,.96);

    box-shadow:
    0 20px 60px #0008;

    text-align:center;
}

h1{

    font-size:40px;

    margin:0 0 10px;
}

.subtitle{

    color:#a5b4fc;

    margin-bottom:25px;
}

input{

    width:100%;

    padding:15px;

    margin:7px 0;

    border:0;

    border-radius:13px;

    font-size:17px;

    outline:none;
}

button{

    width:100%;

    padding:15px;

    margin-top:10px;

    border:0;

    border-radius:13px;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;
}

.create{

    background:#22c55e;

    color:white;
}

.join{

    background:#6366f1;

    color:white;
}

.start{

    background:#f59e0b;

    color:white;
}

#room{

    display:none;
}

#roomCode{

    font-size:38px;

    letter-spacing:7px;

    color:#22c55e;

    margin:15px 0;
}

.players{

    margin-top:20px;

    padding:15px;

    border-radius:15px;

    background:#0b1220;
}

.player{

    padding:10px;

    margin:6px 0;

    border-radius:10px;

    background:#1e293b;
}

#error{

    color:#f87171;

    margin-top:12px;
}

</style>

</head>


<body>


<div class="container">

<h1>🎮 STICKMAN</h1>

<div class="subtitle">
Multiplayer Lobby
</div>


<div id="menu">

<input
    id="name"
    maxlength="20"
    autocomplete="off"
    placeholder="اسم بازیکن"
>


<button
    id="createButton"
    class="create"
>
🏠 ساخت اتاق
</button>


<input
    id="roomInput"
    inputmode="numeric"
    maxlength="6"
    autocomplete="off"
    placeholder="کد ۶ رقمی اتاق"
>


<button
    id="joinButton"
    class="join"
>
🚪 ورود به اتاق
</button>


<div id="error"></div>

</div>


<div id="room">

<div>
کد اتاق شما:
</div>


<div id="roomCode">
------
</div>


<div class="players">

<h3>
👥 بازیکنان
</h3>


<div id="playersList"></div>

</div>


<button
    id="startButton"
    class="start"
>
🎮 ورود به بازی
</button>

</div>

</div>


<script src="/socket.io/socket.io.js"></script>

<script src="/lobby.js"></script>

</body>

</html>
