<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Stickman</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial;

    background:
        linear-gradient(
            135deg,
            #0f172a,
            #312e81
        );

    color: white;
}

.box {
    width: 90%;
    max-width: 430px;

    background: #111827;

    padding: 30px;

    border-radius: 25px;

    text-align: center;

    box-shadow:
        0 20px 60px #0008;
}

h1 {
    font-size: 40px;
    margin-top: 0;
}

input {
    width: 100%;

    padding: 16px;

    margin: 7px 0;

    border: 0;

    border-radius: 12px;

    font-size: 18px;
}

button {
    width: 100%;

    padding: 16px;

    margin-top: 10px;

    border: 0;

    border-radius: 12px;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;
}

#confirm {
    background: #22c55e;
    color: white;
}

#create {
    background: #16a34a;
    color: white;
}

#join {
    background: #6366f1;
    color: white;
}

#enter {
    background: #f59e0b;
    color: white;
}

#error {
    color: #f87171;
    min-height: 25px;
    margin-top: 10px;
}

#namePage {
    display: block;
}

#roomPage {
    display: none;
}

#code {
    font-size: 42px;

    color: #4ade80;

    letter-spacing: 8px;

    margin: 20px 0;
}

#enter {
    display: none;
}

#players {
    background: #020617;

    border-radius: 12px;

    padding: 12px;

    margin-top: 15px;
}

.player {
    background: #1e293b;

    margin: 5px;

    padding: 8px;

    border-radius: 8px;
}

</style>

</head>

<body>

<div class="box">


<!-- =====================
     صفحه اسم
===================== -->

<div id="namePage">

<h1>🎮 STICKMAN</h1>

<p>اول اسمت را انتخاب کن</p>

<input
    id="name"
    maxlength="20"
    placeholder="اسم بازیکن"
>

<button id="confirm">
    ✅ تأیید اسم
</button>

<div id="error"></div>

</div>


<!-- =====================
     اتاق
===================== -->

<div id="roomPage">

<h2>🎮 لابی</h2>

<p>
اسم شما:
<strong id="myName"></strong>
</p>

<button id="create">
    🏠 ساخت اتاق
</button>

<input
    id="roomCodeInput"
    maxlength="6"
    inputmode="numeric"
    placeholder="کد ۶ رقمی"
>

<button id="join">
    🚪 ورود با کد
</button>

<div id="roomBox"
style="display:none">

<p>کد اتاق:</p>

<div id="code">
------
</div>

<div id="players">

👥 بازیکنان

<div id="playerList"></div>

</div>

<button id="enter">
    🎮 ورود به بازی
</button>

</div>

<div id="roomError"></div>

</div>

</div>


<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

let myName = "";
let myRoom = "";


/* =====================
   عناصر
===================== */

const namePage =
    document.getElementById("namePage");

const roomPage =
    document.getElementById("roomPage");

const nameInput =
    document.getElementById("name");

const error =
    document.getElementById("error");

const roomError =
    document.getElementById("roomError");

const myNameText =
    document.getElementById("myName");

const codeText =
    document.getElementById("code");

const roomBox =
    document.getElementById("roomBox");

const playerList =
    document.getElementById("playerList");

const enter =
    document.getElementById("enter");


/* =====================
   تأیید اسم
===================== */

document.getElementById(
    "confirm"
).onclick = function() {

    const name =
        nameInput.value.trim();

    if (!name) {

        error.textContent =
            "اول اسم را وارد کن!";

        return;
    }

    myName = name;

    localStorage.setItem(
        "player",
        myName
    );

    namePage.style.display =
        "none";

    roomPage.style.display =
        "block";

    myNameText.textContent =
        myName;

};


/* =====================
   ساخت اتاق
===================== */

document.getElementById(
    "create"
).onclick = function() {

    roomError.textContent = "";

    socket.emit(
        "createRoom",
        myName
    );

};


/* =====================
   ورود اتاق
===================== */

document.getElementById(
    "join"
).onclick = function() {

    const code =
        document.getElementById(
            "roomCodeInput"
        ).value.trim();

    if (!/^\d{6}$/.test(code)) {

        roomError.textContent =
            "کد باید دقیقاً ۶ رقمی باشد!";

        return;
    }

    roomError.textContent = "";

    socket.emit(
        "joinRoom",
        {
            name: myName,
            code: code
        }
    );

};


/* =====================
   اتاق ساخته شد
===================== */

socket.on(
    "roomCreated",
    function(code) {

        showRoom(code);

    }
);


/* =====================
   وارد شد
===================== */

socket.on(
    "roomJoined",
    function(code) {

        showRoom(code);

    }
);


/* =====================
   نمایش اتاق
===================== */

function showRoom(code) {

    myRoom =
        String(code);

    localStorage.setItem(
        "room",
        myRoom
    );

    roomBox.style.display =
        "block";

    codeText.textContent =
        myRoom;

}


/* =====================
   بازیکنان
===================== */

socket.on(
    "players",
    function(players) {

        playerList.innerHTML = "";

        players.forEach(
            function(p) {

                const div =
                    document.createElement(
                        "div"
                    );

                div.className =
                    "player";

                div.textContent =
                    "👤 " + p.name;

                if (p.admin) {

                    div.textContent +=
                        " 👑 ADMIN";

                }

                playerList.appendChild(
                    div
                );

            }
        );

        enter.style.display =
            "block";

    }
);


/* =====================
   خطا
===================== */

socket.on(
    "errorMessage",
    function(message) {

        if (
            namePage.style.display
            !== "none"
        ) {

            error.textContent =
                message;

        } else {

            roomError.textContent =
                message;

        }

    }
);


/* =====================
   ورود بازی
===================== */

enter.onclick = function() {

    localStorage.setItem(
        "player",
        myName
    );

    localStorage.setItem(
        "room",
        myRoom
    );

    window.location.href =
        "/game.html";

};

</script>

</body>

</html>
