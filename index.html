<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Stickman</title>

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    font-family:Arial;

    background:
    linear-gradient(
        135deg,
        #0f172a,
        #312e81
    );

    color:white;
}

.container{

    width:90%;

    max-width:430px;

    padding:30px;

    border-radius:25px;

    background:#111827;

    box-shadow:0 20px 60px #0008;

    text-align:center;
}

h1{

    font-size:40px;

    margin-top:0;
}

.subtitle{

    color:#a5b4fc;

    margin-bottom:25px;
}

input{

    width:100%;

    padding:15px;

    border:0;

    border-radius:13px;

    font-size:18px;

    outline:none;

    text-align:center;
}

button{

    width:100%;

    padding:15px;

    margin-top:12px;

    border:0;

    border-radius:13px;

    background:#22c55e;

    color:white;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;
}

#lobby{

    display:none;
}

</style>

</head>

<body>

<div class="container">

<!-- صفحه اول -->

<div id="namePage">

<h1>🎮 STICKMAN</h1>

<div class="subtitle">
Multiplayer Lobby
</div>

<input
id="name"
type="text"
placeholder="اسم بازیکن"
maxlength="20"
>

<button
id="confirm"
>
✅ تأیید اسم
</button>

</div>


<!-- بعد از تأیید -->

<div id="lobby">

<h1>
سلام <span id="player"></span> 👋
</h1>

<button>
🏠 ساخت اتاق
</button>

<button>
🚪 ورود به اتاق
</button>

</div>

</div>


<script>

const button =
document.getElementById("confirm");

const input =
document.getElementById("name");

const namePage =
document.getElementById("namePage");

const lobby =
document.getElementById("lobby");

const player =
document.getElementById("player");


button.onclick = function(){

    const name =
    input.value.trim();

    if(name === ""){

        alert(
            "اول اسمت را بنویس!"
        );

        return;
    }

    player.textContent =
    name;

    namePage.style.display =
    "none";

    lobby.style.display =
    "block";

};

</script>

</body>

</html>
