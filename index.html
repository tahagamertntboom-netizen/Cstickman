<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<title>Stickman Lobby</title>

<style>

body{
    background:#111;
    color:white;
    font-family:tahoma;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}


.box{
    background:#333;
    padding:30px;
    border-radius:20px;
    text-align:center;
    width:350px;
}


input,button{

    width:90%;
    padding:12px;
    margin:8px;
    border-radius:10px;
    border:0;
    font-size:17px;

}


button{

    background:#4caf50;
    color:white;
    cursor:pointer;

}


#room{

    margin-top:20px;
    color:#ffd700;
    font-size:22px;

}

</style>

</head>


<body>


<div class="box">


<h1>🎮 Stickman</h1>


<input id="name" placeholder="اسم بازیکن">


<button onclick="createRoom()">
ساخت لابی
</button>



<input id="code" placeholder="کد لابی">


<button onclick="joinRoom()">
ورود
</button>



<div id="room"></div>



</div>


<script src="lobby.js"></script>


</body>

</html>
