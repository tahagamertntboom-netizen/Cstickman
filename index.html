<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Stickman Lobby</title>

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    font-family:Arial;

    background:
    linear-gradient(
        135deg,
        #0f172a,
        #312e81
    );

    color:white;

    padding:20px;
}

.box{

    width:100%;

    max-width:430px;

    background:#111827;

    padding:30px;

    border-radius:25px;

    box-shadow:
    0 20px 70px #0009;

    text-align:center;
}

h1{

    font-size:40px;

    margin:0 0 5px;
}

.subtitle{

    color:#a5b4fc;

    margin-bottom:25px;
}

input{

    width:100%;

    padding:16px;

    margin:7px 0;

    border:0;

    border-radius:13px;

    font-size:17px;

    outline:none;
}

button{

    width:100%;

    padding:16px;

    margin-top:10px;

    border:0;

    border-radius:13px;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;
}

#create{

    background:#22c55e;

    color:white;
}

#join{

    background:#6366f1;

    color:white;
}

#enter{

    background:#f59e0b;

    color:white;

    display:none;
}

#error{

    min-height:25px;

    margin-top:12px;

    color:#f87171;
}

#room{

    display:none;
}

.code{

    font-size:42px;

    letter-spacing:8px;

    color:#4ade80;

    margin:20px 0;
}

.players{

    background:#020617;

    padding:15px;

    border-radius:15px;

    margin-top:15px;
}

.player{

    padding:8px;

    margin:5px;

    background:#1e293b;

    border-radius:9px;
}

</style>

</head>

<body>

<div class="box">

<div id="menu">

<h1>🎮 STICKMAN</h1>

<div class="subtitle">
Multiplayer
</div>

<input
id="name"
maxlength="20"
placeholder="اسم بازیکن"
autocomplete="off"
>

<button id="create">
🏠 ساخت اتاق
</button>

<input
id="codeInput"
maxlength="6"
inputmode="numeric"
placeholder="کد ۶ رقمی اتاق"
autocomplete="off"
>

<button id="join">
🚪 ورود به اتاق
</button>

<div id="error"></div>

</div>


<div id="room">

<h2>
🎉 اتاق ساخته شد!
</h2>

<div>
کد اتاق:
</div>

<div
class="code"
id="code">
------
</div>

<div class="players">

👥 بازیکنان

<div id="playerList"></div>

</div>

<button id="enter">
🎮 ورود به بازی
</button>

<div id="roomError"></div>

</div>

</div>


<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

let myName = "";
let myCode = "";


const menu =
document.getElementById("menu");

const room =
document.getElementById("room");

const nameInput =
document.getElementById("name");

const codeInput =
document.getElementById("codeInput");

const error =
document.getElementById("error");

const roomCode =
document.getElementById("code");

const playerList =
document.getElementById("playerList");

const enter =
document.getElementById("enter");


/* =====================
   اسم
===================== */

function getName(){

    const name =
        nameInput.value.trim();

    if(!name){

        error.textContent =
            "اسم بازیکن را وارد کن!";

        return null;
    }

    return name;
}


/* =====================
   ساخت اتاق
===================== */

document.getElementById("create")
.onclick = function(){

    const name =
        getName();

    if(!name)
        return;

    myName = name;

    error.textContent = "";

    socket.emit(
        "createRoom",
        name
    );

};


/* =====================
   ورود
===================== */

document.getElementById("join")
.onclick = function(){

    const name =
        getName();

    if(!name)
        return;

    const code =
        codeInput.value.trim();

    if(!/^\d{6}$/.test(code)){

        error.textContent =
            "کد باید دقیقاً ۶ رقمی باشد!";

        return;
    }

    myName = name;

    error.textContent = "";

    socket.emit(
        "joinRoom",
        {
            code:code,
            name:name
        }
    );

};


/* =====================
   اتاق ساخته شد
===================== */

socket.on(
    "roomCreated",
    function(code){

        openRoom(code);

    }
);


/* =====================
   وارد شد
===================== */

socket.on(
    "roomJoined",
    function(code){

        openRoom(code);

    }
);


/* =====================
   بازیکنان
===================== */

socket.on(
    "players",
    function(players){

        playerList.innerHTML = "";

        players.forEach(
            function(p){

                const div =
                    document.createElement(
                        "div"
                    );

                div.className =
                    "player";

                div.textContent =
                    "👤 " + p.name;

                if(p.admin){

                    div.textContent +=
                        " 👑 ADMIN";

                }

                playerList.appendChild(
                    div
                );

            }
        );

        enter.style.display =
            "block";

    }
);


/* =====================
   خطا
===================== */

socket.on(
    "errorMessage",
    function(message){

        error.textContent =
            message;

    }
);


/* =====================
   باز کردن اتاق
===================== */

function openRoom(code){

    myCode =
        String(code);

    localStorage.setItem(
        "player",
        myName
    );

    localStorage.setItem(
        "room",
        myCode
    );

    menu.style.display =
        "none";

    room.style.display =
        "block";

    roomCode.textContent =
        myCode;

}


/* =====================
   ورود بازی
===================== */

enter.onclick = function(){

    localStorage.setItem(
        "player",
        myName
    );

    localStorage.setItem(
        "room",
        myCode
    );

    window.location.href =
        "/game.html";

};

</script>

</body>

</html>
