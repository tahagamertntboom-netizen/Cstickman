<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Stickman Lobby</title>

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

    font-family:Arial,sans-serif;

    background:
    linear-gradient(
        135deg,
        #0f172a,
        #312e81
    );

    color:white;
}

.container{

    width:100%;

    max-width:450px;

    padding:30px;

    border-radius:25px;

    background:#0f172a;

    box-shadow:
    0 20px 60px #0008;

    text-align:center;
}

h1{

    margin:0 0 10px;

    font-size:40px;
}

.subtitle{

    color:#a5b4fc;

    margin-bottom:25px;
}

input{

    width:100%;

    padding:15px;

    margin:8px 0;

    border:0;

    border-radius:13px;

    font-size:17px;

    text-align:center;

    outline:none;
}

button{

    width:100%;

    padding:15px;

    margin-top:10px;

    border:0;

    border-radius:13px;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;
}

#confirm{

    background:#22c55e;

    color:white;
}

#create{

    background:#22c55e;

    color:white;
}

#join{

    background:#6366f1;

    color:white;
}

#play{

    background:#f59e0b;

    color:white;
}

#namePage{

    display:block;
}

#lobby{

    display:none;
}

#room{

    display:none;
}

#roomCode{

    margin:20px 0;

    padding:18px;

    background:#020617;

    border-radius:15px;

    color:#22c55e;

    font-size:38px;

    font-weight:bold;

    letter-spacing:7px;

    direction:ltr;
}

#error{

    min-height:25px;

    margin-top:10px;

    color:#f87171;
}

</style>

</head>

<body>

<div class="container">

<h1>🎮 STICKMAN</h1>

<div class="subtitle">
Multiplayer Lobby
</div>


<!-- صفحه اسم -->

<div id="namePage">

<input
    id="name"
    placeholder="اسم بازیکن"
    maxlength="20"
>

<button
    type="button"
    id="confirm"
>
✅ تأیید اسم
</button>

</div>


<!-- صفحه لابی -->

<div id="lobby">

<h2>
سلام <span id="player"></span> 👋
</h2>

<button
    type="button"
    id="create"
>
🏠 ساخت اتاق
</button>

<input
    id="roomInput"
    maxlength="6"
    inputmode="numeric"
    placeholder="کد ۶ رقمی اتاق"
>

<button
    type="button"
    id="join"
>
🚪 ورود به اتاق
</button>

<div id="error"></div>

</div>


<!-- صفحه اتاق -->

<div id="room">

<h2>
🎉 اتاق ساخته شد
</h2>

<p>
کد را به دوستت بده:
</p>

<div id="roomCode">
------
</div>

<button
    type="button"
    id="play"
>
🎮 ورود به بازی
</button>

</div>

</div>


<script>

let myName = "";

let currentRoom = "";


/* عناصر */

const namePage =
document.getElementById("namePage");

const lobby =
document.getElementById("lobby");

const room =
document.getElementById("room");

const nameInput =
document.getElementById("name");

const player =
document.getElementById("player");

const roomInput =
document.getElementById("roomInput");

const roomCode =
document.getElementById("roomCode");

const error =
document.getElementById("error");


/* =========================
   تأیید اسم
========================= */

document
.getElementById("confirm")
.onclick = function(){

    const name =
    nameInput.value.trim();

    if(name === ""){

        alert(
            "اول اسمت را بنویس!"
        );

        return;
    }

    myName = name;

    player.textContent =
    myName;

    namePage.style.display =
    "none";

    lobby.style.display =
    "block";

};


/* =========================
   ساخت اتاق
========================= */

document
.getElementById("create")
.onclick = function(){

    error.textContent = "";

    currentRoom =
        Math.floor(
            100000 +
            Math.random() * 900000
        ).toString();

    roomCode.textContent =
    currentRoom;

    lobby.style.display =
    "none";

    room.style.display =
    "block";

};


/* =========================
   ورود با کد
========================= */

document
.getElementById("join")
.onclick = function(){

    const code =
    roomInput.value.trim();

    if(!/^\d{6}$/.test(code)){

        error.textContent =
        "کد باید دقیقاً ۶ رقمی باشد!";

        return;
    }

    currentRoom =
    code;

    roomCode.textContent =
    currentRoom;

    lobby.style.display =
    "none";

    room.style.display =
    "block";

};


/* =========================
   ورود به بازی
========================= */

document
.getElementById("play")
.onclick = function(){

    localStorage.setItem(
        "player",
        myName
    );

    localStorage.setItem(
        "room",
        currentRoom
    );

    window.location.href =
    "game.html";

};

</script>

</body>

</html>
