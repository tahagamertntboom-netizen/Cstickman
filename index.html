<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Stickman Lobby</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:Arial,sans-serif;

    color:white;

    background:
    linear-gradient(
        135deg,
        #0f172a,
        #312e81
    );
}

.box{
    width:92%;
    max-width:430px;

    padding:30px;

    border-radius:25px;

    background:#111827;

    box-shadow:
    0 20px 70px #0009;

    text-align:center;
}

h1{
    font-size:40px;
    margin:0 0 10px;
}

input{
    width:100%;

    padding:16px;

    margin:7px 0;

    border:0;

    border-radius:12px;

    font-size:18px;

    outline:none;
}

button{
    width:100%;

    padding:16px;

    margin-top:10px;

    border:0;

    border-radius:12px;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;
}

#confirm{
    background:#22c55e;
    color:white;
}

#create{
    background:#16a34a;
    color:white;
}

#join{
    background:#6366f1;
    color:white;
}

#enter{
    background:#f59e0b;
    color:white;
}

#error{
    color:#f87171;
    min-height:25px;
    margin-top:10px;
}

#namePage{
    display:block;
}

#lobbyPage{
    display:none;
}

#roomArea{
    display:none;
}

#roomCode{
    font-size:42px;
    color:#4ade80;
    letter-spacing:8px;
    margin:18px 0;
}

#players{
    margin-top:15px;
    padding:12px;

    border-radius:15px;

    background:#020617;
}

.player{
    padding:9px;
    margin:5px;

    border-radius:9px;

    background:#1e293b;
}

#enter{
    display:none;
}

</style>

</head>

<body>

<div class="box">

<!-- صفحه اسم -->

<div id="namePage">

<h1>🎮 STICKMAN</h1>

<p>
اول اسم بازیکنت را وارد کن
</p>

<input
id="nameInput"
maxlength="20"
autocomplete="off"
placeholder="اسم بازیکن"
>

<button id="confirm">
✅ تأیید اسم
</button>

<div id="error"></div>

</div>


<!-- لابی -->

<div id="lobbyPage">

<h2>
سلام <span id="myName"></span> 👋
</h2>

<button id="create">
🏠 ساخت اتاق
</button>

<input
id="codeInput"
maxlength="6"
inputmode="numeric"
autocomplete="off"
placeholder="کد ۶ رقمی اتاق"
>

<button id="join">
🚪 ورود به اتاق
</button>

<div id="lobbyError"></div>


<div id="roomArea">

<hr>

<p>
کد اتاق:
</p>

<div id="roomCode">
------
</div>

<div id="players">

👥 بازیکنان

<div id="playerList"></div>

</div>

<button id="enter">
🎮 ورود به بازی
</button>

</div>

</div>

</div>


<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

let playerName = "";
let roomCode = "";


const namePage =
document.getElementById("namePage");

const lobbyPage =
document.getElementById("lobbyPage");

const nameInput =
document.getElementById("nameInput");

const error =
document.getElementById("error");

const lobbyError =
document.getElementById("lobbyError");

const myName =
document.getElementById("myName");

const roomArea =
document.getElementById("roomArea");

const roomCodeText =
document.getElementById("roomCode");

const playerList =
document.getElementById("playerList");

const enterButton =
document.getElementById("enter");


/* تأیید اسم */

document.getElementById(
    "confirm"
).onclick = () => {

    const name =
        nameInput.value.trim();

    if (!name) {

        error.textContent =
            "اول اسم را بنویس!";

        return;
    }

    playerName = name;

    localStorage.setItem(
        "player",
        playerName
    );

    namePage.style.display =
        "none";

    lobbyPage.style.display =
        "block";

    myName.textContent =
        playerName;

};


/* ساخت اتاق */

document.getElementById(
    "create"
).onclick = () => {

    lobbyError.textContent = "";

    socket.emit(
        "createRoom",
        playerName
    );

};


/* ورود */

document.getElementById(
    "join"
).onclick = () => {

    const code =
        document.getElementById(
            "codeInput"
        ).value.trim();

    if (!/^\d{6}$/.test(code)) {

        lobbyError.textContent =
            "کد باید دقیقاً ۶ رقمی باشد!";

        return;
    }

    socket.emit(
        "joinRoom",
        {
            name: playerName,
            code: code
        }
    );

};


/* اتاق ساخته شد */

socket.on(
    "roomCreated",
    code => {

        openRoom(code);

    }
);


/* وارد اتاق شد */

socket.on(
    "roomJoined",
    code => {

        openRoom(code);

    }
);


/* باز کردن اتاق */

function openRoom(code){

    roomCode =
        String(code);

    localStorage.setItem(
        "room",
        roomCode
    );

    roomArea.style.display =
        "block";

    roomCodeText.textContent =
        roomCode;

}


/* بازیکنان */

socket.on(
    "players",
    players => {

        playerList.innerHTML = "";

        players.forEach(
            player => {

                const div =
                    document.createElement(
                        "div"
                    );

                div.className =
                    "player";

                div.textContent =
                    "👤 " +
                    player.name;

                if(player.admin){
                    div.textContent +=
                        " 👑";
                }

                playerList.appendChild(
                    div
                );

            }
        );

        enterButton.style.display =
            "block";

    }
);


/* خطا */

socket.on(
    "errorMessage",
    message => {

        if(
            lobbyPage.style.display
            === "block"
        ){
            lobbyError.textContent =
                message;
        }
        else{
            error.textContent =
                message;
        }

    }
);


/* ورود به بازی */

enterButton.onclick = () => {

    localStorage.setItem(
        "player",
        playerName
    );

    localStorage.setItem(
        "room",
        roomCode
    );

    window.location.href =
        "/game.html";

};

</script>

</body>

</html>
