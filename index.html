<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Stickman Lobby</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;

    font-family:Arial,sans-serif;

    background:
    linear-gradient(135deg,#0f172a,#312e81);

    color:white;
}

.box{
    width:100%;
    max-width:430px;

    padding:30px;

    border-radius:25px;

    background:#111827;

    box-shadow:0 20px 60px #0008;

    text-align:center;
}

h1{
    margin:0 0 10px;
    font-size:40px;
}

.subtitle{
    color:#a5b4fc;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:16px;
    margin:8px 0;

    border:0;
    outline:none;

    border-radius:13px;

    font-size:18px;

    text-align:center;
}

button{
    width:100%;
    padding:16px;
    margin-top:10px;

    border:0;
    border-radius:13px;

    font-size:18px;
    font-weight:bold;

    cursor:pointer;
}

#confirm{
    background:#22c55e;
    color:white;
}

#create{
    background:#22c55e;
    color:white;
}

#join{
    background:#6366f1;
    color:white;
}

#play{
    background:#f59e0b;
    color:white;
}

#namePage{
    display:block;
}

#lobbyPage{
    display:none;
}

#roomPage{
    display:none;
}

.code{
    margin:20px 0;
    padding:20px;

    border-radius:15px;

    background:#020617;

    color:#22c55e;

    font-size:40px;
    font-weight:bold;

    letter-spacing:8px;
}

#error{
    min-height:25px;
    margin-top:12px;
    color:#f87171;
}

.player{
    padding:10px;
    margin:6px 0;

    border-radius:10px;

    background:#1e293b;
}

</style>
</head>


<body>


<div class="box">

<h1>🎮 STICKMAN</h1>

<div class="subtitle">
Multiplayer Lobby
</div>


<!-- =====================
     صفحه اسم
===================== -->

<div id="namePage">

<input
    id="name"
    type="text"
    maxlength="20"
    autocomplete="off"
    placeholder="اسم خودت را بنویس"
>

<button
    id="confirm"
    type="button"
>
✅ تأیید اسم
</button>

<div id="error"></div>

</div>


<!-- =====================
     لابی
===================== -->

<div id="lobbyPage">

<h2>
سلام <span id="myName"></span> 👋
</h2>

<button
    id="create"
    type="button"
>
🏠 ساخت اتاق
</button>

<input
    id="roomInput"
    type="text"
    inputmode="numeric"
    maxlength="6"
    autocomplete="off"
    placeholder="کد ۶ رقمی اتاق"
>

<button
    id="join"
    type="button"
>
🚪 ورود به اتاق
</button>

</div>


<!-- =====================
     اتاق
===================== -->

<div id="roomPage">

<h2>
🎉 اتاق ساخته شد
</h2>

<p>
کد اتاق:
</p>

<div id="code" class="code">
------
</div>

<div id="players"></div>

<button
    id="play"
    type="button"
>
🎮 ورود به بازی
</button>

</div>


</div>


<script src="/socket.io/socket.io.js"></script>


<script>

/* =========================
   متغیرها
========================= */

let myPlayerName = "";

let currentRoom = "";


/* عناصر صفحه */

const namePage =
    document.getElementById("namePage");

const lobbyPage =
    document.getElementById("lobbyPage");

const roomPage =
    document.getElementById("roomPage");

const nameInput =
    document.getElementById("name");

const myName =
    document.getElementById("myName");

const roomInput =
    document.getElementById("roomInput");

const error =
    document.getElementById("error");

const code =
    document.getElementById("code");

const players =
    document.getElementById("players");


/* =========================
   اتصال به Socket.IO
========================= */

const socket = io();


/* =========================
   تأیید اسم
========================= */

document
.getElementById("confirm")
.addEventListener(
    "click",
    function(){

        const name =
            nameInput.value.trim();


        if(name === ""){

            error.textContent =
                "اول اسمت را بنویس!";

            return;
        }


        myPlayerName =
            name;


        localStorage.setItem(
            "player",
            name
        );


        myName.textContent =
            name;


        error.textContent =
            "";


        namePage.style.display =
            "none";


        lobbyPage.style.display =
            "block";

    }
);


/* =========================
   ساخت اتاق
========================= */

document
.getElementById("create")
.addEventListener(
    "click",
    function(){

        if(!myPlayerName){

            return;
        }


        socket.emit(
            "createRoom",
            myPlayerName
        );

    }
);


/* =========================
   اتاق ساخته شد
========================= */

socket.on(
    "roomCreated",
    function(roomCode){

        currentRoom =
            String(roomCode);


        code.textContent =
            currentRoom;


        localStorage.setItem(
            "room",
            currentRoom
        );


        lobbyPage.style.display =
            "none";


        roomPage.style.display =
            "block";

    }
);


/* =========================
   ورود به اتاق
========================= */

document
.getElementById("join")
.addEventListener(
    "click",
    function(){

        const roomCode =
            roomInput.value.trim();


        if(!/^[0-9]{6}$/.test(roomCode)){

            error.textContent =
                "کد باید ۶ رقمی باشد!";

            return;
        }


        socket.emit(
            "joinRoom",
            {
                roomCode:roomCode,
                playerName:myPlayerName
            }
        );

    }
);


/* =========================
   ورود موفق
========================= */

socket.on(
    "joinedRoom",
    function(roomCode){

        currentRoom =
            String(roomCode);


        code.textContent =
            currentRoom;


        localStorage.setItem(
            "room",
            currentRoom
        );


        lobbyPage.style.display =
            "none";


        roomPage.style.display =
            "block";

    }
);


/* =========================
   بازیکنان
========================= */

socket.on(
    "roomPlayers",
    function(list){

        players.innerHTML = "";


        list.forEach(
            function(player){

                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "player";


                div.textContent =
                    "👤 " +
                    player.name;


                players.appendChild(
                    div
                );

            }
        );

    }
);


/* =========================
   خطا
========================= */

socket.on(
    "roomError",
    function(message){

        error.textContent =
            message;

    }
);


/* =========================
   ورود به بازی
========================= */

document
.getElementById("play")
.addEventListener(
    "click",
    function(){

        localStorage.setItem(
            "player",
            myPlayerName
        );


        localStorage.setItem(
            "room",
            currentRoom
        );


        window.location.href =
            "/game.html";

    }
);


/* =========================
   Enter برای اسم
========================= */

nameInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            document
            .getElementById("confirm")
            .click();

        }

    }
);

</script>

</body>
</html>
