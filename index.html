<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Stickman Lobby</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:Arial,sans-serif;

    background:
    linear-gradient(
        135deg,
        #0f172a,
        #312e81
    );

    color:white;
}

.box{
    width:90%;
    max-width:430px;

    padding:30px;

    text-align:center;

    background:#111827;

    border-radius:25px;

    box-shadow:
    0 20px 60px #0008;
}

h1{
    font-size:38px;
}

input{
    width:100%;

    padding:15px;

    margin:10px 0;

    border:0;
    border-radius:12px;

    font-size:18px;

    text-align:center;
}

button{
    width:100%;

    padding:15px;

    margin-top:10px;

    border:0;

    border-radius:12px;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;
}

#createButton{
    background:#22c55e;
    color:white;
}

#startButton{
    background:#f59e0b;
    color:white;
}

#room{
    display:none;
}

.code{
    margin:20px 0;

    padding:20px;

    background:#020617;

    border-radius:15px;

    font-size:42px;

    font-weight:bold;

    letter-spacing:8px;

    color:#22c55e;
}

#error{
    margin-top:15px;
    color:#f87171;
}

</style>
</head>

<body>

<div class="box">

<h1>🎮 STICKMAN</h1>

<div id="menu">

<input
    id="name"
    maxlength="20"
    placeholder="اسم بازیکن"
>

<button id="createButton">
🏠 ساخت اتاق
</button>

<div id="error"></div>

</div>


<div id="room">

<h2>
🎉 اتاق ساخته شد!
</h2>

<p>
کد اتاق را به دوستت بده:
</p>

<div
    id="roomCode"
    class="code"
>
------
</div>

<button id="startButton">
🎮 ورود به بازی
</button>

</div>

</div>


<script src="/socket.io/socket.io.js"></script>

<script src="/lobby.js"></script>

</body>
</html>
