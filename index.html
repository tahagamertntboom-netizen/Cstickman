<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Stickman</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    font-family: Arial;

    color: white;

    background:
    linear-gradient(
        135deg,
        #020617,
        #172554,
        #312e81
    );
}

.box {

    width: 92%;

    max-width: 430px;

    padding: 30px;

    background: #111827;

    border-radius: 25px;

    text-align: center;

    box-shadow:
    0 20px 70px #000b;
}

h1 {

    font-size: 42px;

    margin-bottom: 10px;
}

input {

    width: 100%;

    padding: 16px;

    border: none;

    border-radius: 12px;

    margin-top: 10px;

    font-size: 18px;
}

button {

    width: 100%;

    padding: 16px;

    border: none;

    border-radius: 12px;

    margin-top: 12px;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;

    color: white;
}

button:active {

    transform: scale(.97);
}

#confirm {

    background: #22c55e;
}

#error {

    color: #f87171;

    min-height: 25px;

    margin-top: 10px;
}

</style>

</head>

<body>

<div class="box">

<h1>🎮 STICKMAN</h1>

<p>
برای شروع اسمت را وارد کن
</p>

<input
    id="nameInput"
    maxlength="20"
    placeholder="اسم بازیکن"
    autocomplete="off"
>

<button
    id="confirm"
    type="button"
>
✅ تأیید اسم
</button>

<div id="error"></div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script src="/lobby.js"></script>

</body>

</html>
